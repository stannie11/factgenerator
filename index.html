ating."}, {"f": "Alpine ibex horn rings can be counted like tree rings to determine the exact age of the animal.", "a": "Scientist counts ibex horn rings, arrives at fourteen, ibex nods, correct, continues grazing."}, {"f": "Musk oxen have a winter undercoat called qiviut that is eight times warmer than sheep's wool.", "a": "Musk ox and sheep at cold weather test, sheep in three layers, musk ox in just qiviut, both equally warm."}, {"f": "Goats have no teeth in their upper jaw and press food against their hard palate with their lower teeth.", "a": "Goat at dental exam, upper jaw completely empty, dentist counts, confirms, goat chews throughout examination."}, {"f": "Mouflon migrate to lower mountain elevations in winter to escape the deepest snow.", "a": "Mouflon checks snow depth forecast, packs up, descends two hundred metres, finds spot, very efficient planning."}, {"f": "Kangaroos cannot move their hind legs independently on land but can when swimming.", "a": "Kangaroo in pool, hind legs moving independently for first time, looks delighted, tries walking on land, locked again."}, {"f": "Female red kangaroos can pause an embryo's development during drought until conditions improve.", "a": "Female kangaroo checks weather forecast, terrible drought, embryo receives pause notification, waits, rain arrives, resume."}, {"f": "Wallabies eat leaves, bark, and juicy roots in addition to grasses giving them a varied diet.", "a": "Wallaby at forest buffet, ignores the grass section, heads to bark and roots, very particular preferences."}, {"f": "Tree kangaroos have long sharp claws and rough paw pads for maximum grip when climbing vertical trunks.", "a": "Tree kangaroo approaches vertical tree trunk, grips with all four paws, walks straight up, gravity optional."}, {"f": "Koalas smell permanently of eucalyptus which also helps deter fleas and ticks from their fur.", "a": "Koala at parasite inspection, inspector finds nothing, notes strong eucalyptus scent, parasites clearly avoiding it."}, {"f": "Wombats have a rear end made largely of tough cartilage and bone they use to crush intruders against burrow walls.", "a": "Intruder enters wombat burrow, wombat retreats, reverses hard, intruder sandwiched against wall, wombat nods."}, {"f": "Bandicoots dig small conical holes with their pointed snouts to extract insect larvae from the soil.", "a": "Bandicoot crosses lawn, perfect cone-shaped holes appearing behind it, gardener follows, baffled by the pattern."}, {"f": "Sugar gliders have a membrane from wrist to ankle allowing them to glide silently between trees.", "a": "Sugar glider at treetop, spreads arms and legs, membrane deploys, glides forty metres in complete silence."}, {"f": "Tasmanian devils store fat in their tail and a thin tail signals an unhealthy or starving animal.", "a": "Tasmanian devil at health check, vet measures tail girth first, tail fat levels normal, diet confirmed adequate."}, {"f": "The thylacine had a backward-opening pouch so that scrub and debris did not enter while running.", "a": "Thylacine diagram in museum shows backward pouch, designer notes on board say practical for dense vegetation."}, {"f": "Platypuses have a waterproof coat as effective as an otter's for staying dry during extended dives.", "a": "Platypus and otter compared after diving, both coats checked, equally dry, very different animals same result."}, {"f": "Echidnas curl into a ball of spines when threatened or dig straight down until only their spiny back shows.", "a": "Predator approaches echidna, echidna digs rapidly, disappears downward, only spines visible, predator stares at spines."}, {"f": "Giant anteaters never fully destroy a termite mound but eat for a few minutes then move on so the colony survives.", "a": "Giant anteater at termite mound, eats portion, checks watch, moves on, mound staff look at damage, begin repairs."}, {"f": "Two-toed sloths spend almost their entire lives upside down including giving birth and mating.", "a": "Sloth gives birth hanging from branch, baby immediately hangs on, both upside down, very unremarkable for them."}, {"f": "Armadillos are excellent swimmers that can inflate their lungs and float or walk along the river bottom.", "a": "Armadillo at river, inflates lungs, floats across, or deflates, walks along bottom, chooses based on mood."}, {"f": "Pangolins have no teeth but have a stomach containing small stones to grind up ants and termites like birds.", "a": "Pangolin at digestion demo, opens mouth to show no teeth, points to stomach, rattles slightly, stones inside."}, {"f": "African elephant trunks end in two finger-like lips while Asian elephants have only one.", "a": "African and Asian elephant at anatomy comparison, both raise trunks, count lip-tips, two versus one, confirmed."}, {"f": "An elephant's trunk is powerful enough to lift a heavy log but delicate enough to pick a single blade of grass.", "a": "Elephant lifts log with trunk, sets it down, picks single grass blade from ground, both with equal precision."}, {"f": "Asian female elephants have no visible tusks or only small stubs called tushes.", "a": "Asian female elephant at tusk inspection, inspector looks, finds tiny stubs, marks tushes on clipboard."}, {"f": "Manatees have lungs running the full length of their back which helps distribute their buoyancy evenly.", "a": "Manatee at buoyancy test, perfectly horizontal at all depths, scientist notes lung positioning as the key."}, {"f": "Dugongs have fine sensory hairs on their smooth skin that help them navigate in murky seagrass water.", "a": "Dugong navigating cloudy water, hairs detecting water movement, finds seagrass bed, arrives perfectly on target."}, {"f": "Hyraxes have sweat glands on the soles of their feet that produce a sticky substance preventing them from sliding.", "a": "Hyrax on vertical rock face, feet sticking perfectly, other animals watching from below, very suspicious grip."}, {"f": "Aardvarks have thick skin that is insensitive to the bites of tens of thousands of angry ants or termites.", "a": "Aardvark pushes snout into termite mound, termites bite furiously, aardvark completely unfazed, keeps eating."}, {"f": "Elephant shrews drum on the ground with their hind legs to warn nearby relatives of approaching danger.", "a": "Elephant shrew spots eagle, drums hind legs rapidly, all nearby relatives vanish into cover simultaneously."}, {"f": "Ring-tailed lemurs spend much more time on the ground than other lemurs, which is very unusual for Madagascar primates.", "a": "Ring-tailed lemur at lemur conference, all others arrive in treetops, ring-tail walks in on the ground, shrugs."}, {"f": "Sifakas hold their arms wide during their sideways ground hops to maintain balance.", "a": "Sifaka crosses open ground, arms extended like a tightrope walker, bouncing sideways rapidly, arrives safely."}, {"f": "Aye-ayes have continuously growing front teeth like rodents for gouging into wood to reach larvae.", "a": "Aye-aye dentist appointment, dentist measures tooth growth rate, checks rodent chart, interesting for a primate."}, {"f": "Slow lorises rub their venom onto their young before going hunting to protect them from predators.", "a": "Slow loris parent carefully applies venom to baby's fur before leaving, predator approaches baby, backs away fast."}, {"f": "Galagos have foldable ears they can tuck away to protect them while racing through thorny scrubland.", "a": "Galago charges through thorn bush at speed, ears folded flat, emerges unscratched, ears unfold, continues."}, {"f": "Tarsiers are the only completely carnivorous primates eating exclusively insects, lizards, and birds.", "a": "Tarsier at primate buffet, ignores fruit section entirely, heads straight to live insects, other primates stare."}, {"f": "Spider monkeys have a hairless tip on their prehensile tail that provides a perfect non-slip grip on branches.", "a": "Spider monkey hanging by tail tip, weight fully transferred, both hands free, tail grip completely reliable."}, {"f": "Squirrel monkeys have proportionally larger brains relative to body weight than humans do.", "a": "Squirrel monkey at brain-to-body ratio chart, score above human line, squirrel monkey points this out."}, {"f": "Capuchin monkeys knock on hollow tree trunks to check for the resonance that signals fat grubs inside.", "a": "Capuchin knocks tree, knocks again, hollow sound detected, marks spot, extracts grub, very systematic."}, {"f": "Uakaris develop a pale face when sick or malaria-infected and are immediately rejected by potential mates.", "a": "Uakari with pale face approaches potential mate, mate checks face colour, shakes head, walks away."}, {"f": "Baboons have developed tough sitting pads on their bottoms from spending so much time on the ground.", "a": "Baboon sits on rocky ground, completely comfortable, other animals wincing, baboon reads newspaper, unbothered."}, {"f": "Mandrills avoid direct eye contact within the group as it is interpreted as a serious provocative challenge.", "a": "Mandrill accidentally makes eye contact with dominant male, both freeze, junior slowly looks away, crisis averted."}, {"f": "A rhesus macaque's social rank is determined directly by the rank of its mother at the time of birth.", "a": "Baby rhesus macaque born, immediately assigned rank from mother's position, other macaques update the list."}, {"f": "Barbary macaque males use infants as a social buffer, carrying babies to defuse tension with dominant males.", "a": "Barbary macaque male picks up infant, approaches dominant male, dominant male immediately becomes friendly."}, {"f": "Japanese macaques learned to wash their food in seawater for both cleanliness and added salty flavour.", "a": "Japanese macaque dips sweet potato in river, dips in sea, compares, nods at sea version, salty is better."}, {"f": "Proboscis monkeys can swim powerfully and sometimes leap from great heights into rivers to escape crocodiles.", "a": "Proboscis monkey on high branch, crocodile below on land, monkey leaps into river, crocodile very confused."}, {"f": "Langur babies are born with bright orange coats that change colour later, encouraging the whole group to protect them.", "a": "Langur baby born bright orange, entire group immediately gathers around it, orange colour clearly working."}, {"f": "Gibbons have extremely flexible wrist joints that rotate freely making their brachiation appear effortless.", "a": "Gibbon swings through canopy at speed, wrists rotating continuously, movement completely fluid, other primates watching."}, {"f": "Orang-utans use large leaves as umbrellas against rain or as megaphones to amplify their calls.", "a": "Orang-utan caught in rain, selects large leaf, holds overhead, completely dry, other orang-utans copying idea."}, {"f": "Chimpanzees have distinct cultures with western groups using stones to crack nuts while eastern groups do not.", "a": "Western chimpanzee cracks nut with stone, eastern chimpanzee visiting watches, looks at stone, looks at nut, tries."}, {"f": "Bonobos readily share food with strangers to build friendly relationships outside their immediate group.", "a": "Bonobo spots stranger at forest edge, picks up fruit, walks over, offers it, stranger accepts, new friendship begins."}, {"f": "Gorillas are very gentle and only attack humans when truly cornered or protecting their family.", "a": "Gorilla silverback approaches tourist too close, pauses, tourist backs away, gorilla returns to eating, crisis over."}, {"f": "Flying foxes have no tail membrane like normal bats which gives them more agility between forest trees.", "a": "Flying fox and bat racing through dense forest, flying fox turns tighter, no membrane catching branches."}, {"f": "Pygmy bats can reduce their heart rate to just a few beats per minute during winter hibernation.", "a": "Pygmy bat in hibernation, scientist attaches heart monitor, reads three beats per minute, checks equipment twice."}, {"f": "Vampire bats can run surprisingly fast on the ground and sneak up on prey from the legs rather than overhead.", "a": "Vampire bat lands away from sleeping animal, runs along ground, approaches from legs, animal never wakes up."}, {"f": "Long-eared bats hunt primarily by sound, listening for the soft footfall of caterpillars on leaves.", "a": "Long-eared bat in garden, ears rotating, detects caterpillar walking on leaf three metres away, dives precisely."}, {"f": "Daubenton's bats can swim if they accidentally land in water, using their wings as oars to get ashore.", "a": "Daubenton's bat falls into pond, converts wings to rowing position, paddles to bank, climbs out, flies off."}, {"f": "Porcupine fish have jaws strong enough to crack the shells of crabs and hermit crabs with ease.", "a": "Porcupine fish spots hermit crab shell, examines it, bites cleanly through it, crab very surprised by the development."}, {"f": "Cowfish secrete a toxic mucus through their skin under extreme stress that can kill nearby fish.", "a": "Cowfish extremely stressed in tank, toxic cloud appears, other tank occupants evacuating rapidly, cowfish apologises."}, {"f": "Trumpetfish sometimes swim alongside larger harmless fish using them as camouflage to approach prey unseen.", "a": "Trumpetfish slots in alongside passing grouper, perfectly vertical, preys swims close, trumpetfish strikes, grouper unaware."}, {"f": "Stonefish spines can penetrate through rubber dive boot soles making them extremely hazardous to step on.", "a": "Diver in full rubber boots steps on stonefish, boots irrelevant, stonefish unbothered, diver immediately exits water."}, {"f": "Scorpionfish rely completely on camouflage and lie perfectly still until prey swims directly in front of them.", "a": "Scorpionfish on reef, motionless for four hours, small fish swims past its mouth, opens, closes, four more hours."}, {"f": "Mudskippers store water around their gill chambers that allows them to breathe on land between tide returns.", "a": "Mudskipper walks beach at low tide, checks gill water reserves, still good, continues land expedition."}, {"f": "Blennies have small tentacle-like projections above their eyes for sensing water current direction.", "a": "Blennie at current sensing competition, tentacles rotating, identifies flow direction instantly, other fish using fins."}, {"f": "Gobies keep tail contact with their shrimp partners at all times and vibrate to signal incoming danger.", "a": "Goby tail touching shrimp, goby vibrates, shrimp stops excavating, both retreat into burrow, threat passes."}, {"f": "Cleaner wrasse sometimes cheat by taking a bite of healthy client tissue instead of parasites.", "a": "Cleaner wrasse removes parasite, client relaxed, wrasse takes sneaky nibble of skin, client jolts, wrasse looks innocent."}, {"f": "Trigger fish defend their nests so aggressively that they will charge and bite scuba divers who come too close.", "a": "Trigger fish spots diver near nest, charges immediately, diver retreats vertically, trigger fish returns to nest."}, {"f": "Surgeonfish get their name from the scalpel-sharp spines at the base of their tail used to slash attackers.", "a": "Surgeonfish explains name to curious fish, slowly raises tail to show spine, curious fish backs away politely."}, {"f": "Squirrelfish produce grunting and clicking sounds using their swim bladder to defend their territory.", "a": "Squirrelfish returns to territory, spots intruder, activates swim bladder sounds, intruder hears grunting, leaves."}, {"f": "Male cardinal fish cannot eat for weeks because their entire mouth is occupied by hundreds of incubating eggs.", "a": "Male cardinal fish at meal time, looks at food, looks at eggs in mouth, sighs, food still there tomorrow."}, {"f": "Giant manta rays have two flexible flaps near their mouth that direct plankton-rich water efficiently inward.", "a": "Giant manta ray approaches plankton cloud, deploys mouth flaps, water channelled in perfectly, feeding complete."}, {"f": "Stingrays often bury themselves under a thin layer of sand to become invisible to passing predators.", "a": "Stingray at sandy bottom, covers itself efficiently, only eyes visible, shark swims past, sees nothing, stingray safe."}, {"f": "Guitar sharks propel themselves with powerful tail sweeps like a shark rather than undulating their fin edges.", "a": "Guitar shark identified by tail propulsion technique, shark examines it, ray examines it, both somewhat related."}, {"f": "Sawfish use their saw to slash through shoals of fish to injure several at once before eating them.", "a": "Sawfish spots dense fish school, swings rostrum through it, multiple stunned fish floating, sawfish collects calmly."}, {"f": "Whale sharks have thousands of tiny teeth on their eyeballs to protect the eyes from debris.", "a": "Marine biologist examining whale shark eye, discovers teeth, drops clipboard, examines other eye, more teeth."}, {"f": "Basking sharks filter thousands of litres of water per hour by swimming open-mouthed through plankton patches.", "a": "Basking shark sets feeding timer, opens mouth, swims through plankton patch for one hour, mouth closes, satisfied."}, {"f": "White sharks have a circulatory system that keeps their body warmer than the surrounding ocean water.", "a": "White shark at sea temperature measurement, water reading 12 degrees, shark internal reading 20 degrees, scientist notes."}, {"f": "Hammerhead sharks can make extremely sharp turns during chases thanks to their wide flat head design.", "a": "Hammerhead chasing stingray, stingray cuts left at full speed, hammerhead turns just as fast, stays on target."}, {"f": "Tiger shark teeth have a unique serrated edge perfectly designed for sawing through sea turtle shells.", "a": "Tiger shark and sea turtle encounter, turtle confident in shell, tiger shark assesses edge angle, turtle reassesses."}, {"f": "Bull sharks have specialised kidney glands that prevent them losing too much salt in freshwater rivers.", "a": "Bull shark at freshwater checkpoint, officer checks freshwater permit, shark shows kidney documents, waved through."}, {"f": "Thresher sharks often hunt in pairs herding fish schools into tight balls before using their tail whip.", "a": "Two thresher sharks coordinate fish herding, fish ball formed, both sharks position, tails swing simultaneously."}, {"f": "Nurse sharks use barbel filaments near their nostrils to feel for prey hidden in sand.", "a": "Nurse shark on sandy bottom, barbels probing sand systematically, locates buried ray, precision detection complete."}, {"f": "Lionfish have become a major plague in the Caribbean because they have no natural predators there.", "a": "Lionfish arrives in Caribbean, looks around for predators, sees none, sets up permanent residence immediately."}, {"f": "Sea grass pipefish can change colour from bright green to brown depending on the condition of the seagrass around them.", "a": "Pipefish checks surrounding seagrass colour, adjusts own colour to match, invisible again, waits for prey."}, {"f": "Pearl oysters build up mother of pearl layer by layer around an irritating grain of sand to eventually form a pearl.", "a": "Oyster detects sand grain, begins coating process, layer by layer, years pass, opens shell, perfect pearl inside."}, {"f": "Scallops have dozens of tiny bright blue eyes along the edge of their shell to detect movement.", "a": "Scallop spots shadow approaching, blue eyes all focus simultaneously, shell snaps shut, predator finds nothing."}, {"f": "Boring mussels secrete a mild acid to soften rock then rasp out a hollow with the edges of their shell.", "a": "Boring mussel at solid limestone, applies acid, tests softness, begins rasping, perfect burrow after three days."}, {"f": "Squid have an internal structure called a gladius, a transparent sliver that acts as their backbone.", "a": "Squid at anatomy exhibit, opens mantle to show gladius, tiny transparent sliver, visitors lean in to see it."}, {"f": "Deep sea anglerfish females release pheromones into the pitch-black ocean to attract males from a distance.", "a": "Female anglerfish releases pheromone in total darkness, male somewhere in blackness detects it, begins long journey."}, {"f": "Giant isopods can go months without eating because food arrives so rarely on the deep sea floor.", "a": "Giant isopod at deep sea restaurant, menu arrives every four months, isopod very patient, very hungry."}, {"f": "Dolphins consciously control their breathing and cannot accidentally drown while asleep like humans could.", "a": "Dolphin at sleep study, researcher explains it breathes consciously, dolphin nods, researcher asks how, dolphin shrugs."}, {"f": "Orcas can deliberately capsize ice floes by creating synchronized waves to dislodge seals resting on top.", "a": "Seal on ice floe, three orcas form line, swim together, wave created, ice tilts, seal slides off, orcas satisfied."}, {"f": "Leopard seals sometimes play with penguins, practising hunting techniques to demonstrate them to younger seals.", "a": "Leopard seal releases penguin, catches it again, releases again, young seal watching closely, valuable education."}, {"f": "Seal pups develop a layer of blubber within a few weeks thick enough to survive in ice-cold water.", "a": "Seal pup at blubber thickness test, week one thin, week four thick enough for Arctic water, approved."}, {"f": "Sea otters have loose pouches of skin under their forearms where they store favourite rocks while diving.", "a": "Sea otter checks rock pocket before diving, favourite flat rock still there, dives, uses it to crack clam."}, {"f": "California sea lions can produce calls that are equally clear both above and below the water surface.", "a": "California sea lion calls trainer underwater, trainer hears it perfectly above water too, very useful talent."}, {"f": "Walruses change colour based on temperature, appearing white in cold water and pink when warming up on land.", "a": "Walrus exits icy water looking white, lies in sun, gradually turns pink, like a very large mood ring."}, {"f": "Sperm whales have spermaceti, a waxy substance in their forehead that helps them adjust their buoyancy.", "a": "Sperm whale preparing for deep dive, cools spermaceti, density increases, sinks, warms it to rise, perfect control."}, {"f": "Humpback whales can travel thousands of kilometres during migration without stopping to feed at all.", "a": "Humpback whale packs nothing for migration, thousands of kilometres planned, no food stops scheduled, sets off."}, {"f": "Bowhead whales have the largest mouth of any animal, taking up nearly a third of their total body length.", "a": "Bowhead whale at comparative anatomy exhibit, mouth measurement takes three tape measures joined together."}, {"f": "Grey whales migrate so close to the shoreline that they are regularly visible to whale watchers on land.", "a": "Whale watcher on cliff spots grey whale three metres from shore, looks at boat, looks at whale, stays on cliff."}, {"f": "Dwarf minke whales are highly curious and often swim alongside research vessels for extended periods.", "a": "Research boat stops for lunch break, dwarf minke whale surfaces alongside, waits, still there after coffee."}, {"f": "Horseshoe crab blood clots immediately on contact with harmful bacteria making it invaluable in medicine.", "a": "Horseshoe crab at pharmaceutical meeting, blood sample in test tube, harmful bacteria added, clots instantly, scientists applaud."}, {"f": "Sea anemones have a single opening that serves as both mouth and anus for waste expulsion.", "a": "Sea anemone at anatomy class, teacher points out single opening, both uses, class very quiet, teacher moves on."}, {"f": "Corals live in symbiosis with microscopic algae that provide them with sugar and give them their vivid colours.", "a": "Coral bleached of algae looks pale and distressed, algae returns, colour floods back, coral visibly relieved."}, {"f": "Clownfish live in strict hierarchies and when the female dies the largest male transforms into a female.", "a": "Female clownfish gone, all remaining fish look at largest male, largest male takes a deep breath, transformation begins."}, {"f": "Moray eels have an excellent sense of smell that fully compensates for their poor eyesight in rock crevices.", "a": "Moray eel cannot see prey behind rock, nose air-sniffs, detects it precisely, strikes around corner, successful."}, {"f": "Barracudas have teeth anchored so deeply in their jaws they can slice prey cleanly in half in one bite.", "a": "Barracuda approaches large fish, fish confident it is too big, barracuda bites once, fish reconsidering this assessment."}, {"f": "Swordfish lose their scales and teeth as adults and their sword becomes their primary weapon.", "a": "Swordfish at annual tooth check, dentist finds none, scales gone too, sword still excellent, dentist closes chart."}, {"f": "Tuna fins can be retracted completely into grooves in their body for a perfectly streamlined profile.", "a": "Tuna at hydrodynamics test, fins retract into body completely, drag coefficient drops to near zero, engineer nods."}, {"f": "Sea bass ambush prey near shipwrecks, piers, and rocky coastlines where baitfish congregate.", "a": "Sea bass selects favourite shipwreck, settles into shadow, baitfish arrive, sea bass notes menu has arrived."}, {"f": "Salmon change colour and grow a hooked lower jaw during the spawning migration upstream.", "a": "Salmon starts migration silver, arrives at spawning ground red with hooked jaw, barely recognisable to itself."}, {"f": "Eels stop eating entirely at the start of their thousands-kilometre ocean migration.", "a": "Eel at start of Atlantic migration, closes mouth, sets off, mouth stays closed for entire journey."}, {"f": "Mudskippers can breathe through their intestines when water becomes completely deoxygenated or dries up.", "a": "Mudskipper in dried up pool, water gone, activates intestine breathing, carries on, very adaptable."}, {"f": "Pike are perfectly camouflaged with greenish-brown spots that make them invisible among aquatic vegetation.", "a": "Pike completely still in waterweeds, frog swims past, frog freezes, frog wasn't sure, frog leaves quickly."}, {"f": "There are documented cases of pet koi carp living to over one hundred years of age.", "a": "Koi pond owner inherits family koi, reads note, this fish is 87, owner sets very long reminder."}, {"f": "Catfish have no scales but have thick leathery skin covered in protective slime instead.", "a": "Catfish at fish costume party, others wearing scale patterns, catfish in smooth leather suit, judges approve."}, {"f": "Piranhas produce a barking sound using their swim bladder to warn rivals away from their territory.", "a": "Piranha at underwater territorial dispute, produces bark sound, rival hears underwater barking, backs away confused."}, {"f": "Electric eels must regularly surface to gulp air because their gills are not efficient enough for their oxygen needs.", "a": "Electric eel in meeting room, surfaces every few minutes to gulp air, chair asks if it is okay, eel nods."}, {"f": "Flying fish fold their fins flat as soon as they re-enter the water to accelerate immediately.", "a": "Flying fish glides over wave top, touches water surface, fins snap flat, launches forward at speed, barely slows."}, {"f": "Porcupine fish have no ribs which allows their body to inflate fully without any skeletal obstruction.", "a": "Porcupine fish at anatomy class, teacher points out absent ribs, fish demonstrates inflation, class very impressed."}, {"f": "Ocean sunfish bask flat on the water surface to warm up and attract seabirds to pick off their parasites.", "a": "Ocean sunfish lies flat, birds land on it methodically, parasite load decreasing, sunfish warming up, efficient."}, {"f": "Stonefish venom causes pain so severe that victims sometimes request amputation of the affected limb.", "a": "Doctor reads stonefish sting case notes, patient's request written clearly, doctor arranges urgent anti-venom instead."}, {"f": "Hagfish can tie a knot in their own body and slide it forward to produce extra leverage when tearing flesh.", "a": "Hagfish grips carcass, ties self into knot, slides knot toward tail end, pulls, tears flesh cleanly, unties."}, {"f": "Tarantulas use silk mainly to line their underground burrow and to detect the vibrations of approaching prey.", "a": "Tarantula at burrow entrance, silk lines detect vibration, prey approaching from left, tarantula positions accordingly."}, {"f": "The black widow's red hourglass marking on her abdomen acts as a vivid warning signal for potential threats.", "a": "Predator approaches black widow, spots red hourglass, freezes, backs away slowly, black widow does nothing."}, {"f": "Garden spiders rebuild their entire web each day because daily exposure to wind and dust destroys its stickiness.", "a": "Garden spider eats old web at dawn, rebuilds identical one by morning dew time, very consistent schedule."}, {"f": "Water spiders carry a shiny air layer around their abdomen held in place by hundreds of fine hydrophobic hairs.", "a": "Water spider descends to pond bottom, air layer still gleaming, checks home air bell, tops it up, comfortable."}, {"f": "Female scorpions carry their newborn young on their back for weeks until the babies complete their first moult.", "a": "Scorpion mother walks through desert, twenty babies on her back, stops periodically for them to readjust."}, {"f": "Centipedes are fast active nocturnal hunters pursuing insects and worms across the ground at night.", "a": "Centipede at night, all legs coordinating, rapid movement, catches cricket, centipede's speed is genuinely alarming."}, {"f": "Millipedes play a crucial ecological role by consuming dead leaves and converting them into rich humus.", "a": "Millipede at dead leaf pile, starts eating, converts pile to dark humus, soil quality improves, gardener grateful."}, {"f": "The praying mantis is the only insect that can turn its head over its shoulder to look directly behind itself.", "a": "Praying mantis hears noise behind, head rotates to check, all clear, head rotates back, continues watching forward."}, {"f": "Stick insects can deliberately shed a leg when grabbed and regrow it during the next moult.", "a": "Bird grabs stick insect's leg, leg detaches and remains, stick insect escapes, new leg visible at next moult."}, {"f": "Leaf insects are so perfectly camouflaged that other leaf insects sometimes try to eat each other.", "a": "Two leaf insects resting on same branch, one takes a small bite of the other, both extremely embarrassed."}, {"f": "Grasshoppers have hind legs that work like catapults storing energy in tensed muscles and releasing it at once.", "a": "Grasshopper at jump competition, tenses legs slowly, releases everything simultaneously, flies ten metres, lands."}, {"f": "Crickets chirp more rapidly as environmental temperature rises and can be used to estimate air temperature.", "a": "Meteorologist breaks thermometer, listens to cricket chirping instead, counts rate, converts, temperature accurate."}, {"f": "Firefly larvae are also bioluminescent and use their glow to warn predators they taste foul.", "a": "Bird picks up firefly larva, larva glows immediately, bird tastes it, grimaces, puts larva down, larva glows off."}, {"f": "Ladybirds have bright warning colours that signal to predators in nature that they are toxic and taste terrible.", "a": "Bird considers red ladybird, remembers previous experience, walks away, ladybird continues on its path unbothered."}, {"f": "Dung beetles roll their ball backwards using their hind legs while facing downward.", "a": "Dung beetle with ball, turns around, reverses with hind legs, navigates by Milky Way, arrives at destination."}, {"f": "Great diving beetles have sharp jaws powerful enough to catch and eat tadpoles and small fish.", "a": "Great diving beetle in pond, tadpoles scatter, small fish unsure, beetle makes its selection, pond very concerned."}, {"f": "Dragonflies have compound eyes made up of up to thirty thousand individual lenses giving them near 360 degree vision.", "a": "Dragonfly at vision test, examiner holds targets in every direction simultaneously, dragonfly identifies all instantly."}, {"f": "Damselflies are considerably more slender and fragile in build than the robust dragonflies they resemble.", "a": "Damselfly and dragonfly side by side, damselfly much more delicate, both flying, wind bothers only one."}, {"f": "Male cicadas produce sounds reaching 100 decibels by vibrating special tymbals on the sides of their abdomen.", "a": "Cicada at decibel competition, registers 100dB, judge moves measuring equipment further away, cicada turns up."}, {"f": "Aphids can infest an entire plant within days because they reproduce asexually and extremely rapidly.", "a": "Single aphid on rose, five days later entire plant covered, gardener looks at rosebush, then at the single aphid."}, {"f": "Ants milk aphids by gently tapping their abdomen with their antennae to stimulate honeydew production.", "a": "Ant farmer approaches aphid, taps abdomen delicately, droplet of honeydew appears, ant collects it, very gentle process."}, {"f": "Termite mounds are constructed from clay and saliva and are so solid they can barely be broken with a hammer.", "a": "Construction worker attempts to demolish termite mound with hammer, hammer bounces back, mound undamaged."}, {"f": "Male wasps have no sting at all as the sting is a modified egg-laying tube that only females possess.", "a": "Wasp colony sorting, females get stingers issued, males at separate counter, empty-handed, walk away confused."}, {"f": "Honeybees navigate on overcast days using a built-in compass that reads the polarisation pattern of skylight.", "a": "Overcast sky, other insects lost, honeybee checks internal compass, reads sky polarisation, flies directly home."}, {"f": "Bumblebees can decouple their wing muscles from their wings to generate heat purely by shivering their thorax.", "a": "Bumblebee in cold greenhouse, decouples wings, vibrates thorax, temperature rises, wings recouple, flies off warm."}, {"f": "Botfly larvae often enter hosts via licked bot fly eggs on legs which the host ingests during grooming.", "a": "Horse grazes, licks leg, botfly egg consumed, larva now in stomach, botfly was not invited, horse unaware."}, {"f": "Hoverflies are named for their ability to remain perfectly stationary in the air above a flower for seconds.", "a": "Hoverfly at flower, stationary in mid-air, not moving an inch, bee bumbles past confused, hoverfly still hovering."}, {"f": "Female mosquitoes detect the carbon dioxide in human breath from up to thirty metres away to locate hosts.", "a": "Mosquito at thirty metres, detects CO2 plume, tracks it upwind, finds sleeping human, plan underway."}, {"f": "Crane fly larvae called leatherjackets live underground and can cause significant damage to lawns from below.", "a": "Gardener puzzles over yellowing lawn patches, digs up one, finds leatherjackets below every patch, very organised damage."}, {"f": "Gnats are so tiny they can pass straight through the mesh of a standard mosquito screen or window net.", "a": "Homeowner installs mosquito screen, gnats stream through mesh unimpeded, homeowner looks at screen instructions."}, {"f": "Fleas have a flattened body that lets them move efficiently through dense animal fur.", "a": "Flea at pet fur navigation course, thin profile, moves between hairs effortlessly, other insects cannot follow."}, {"f": "Bed bugs are attracted to the body heat and carbon dioxide of a sleeping person to locate their meal.", "a": "Bed bug at heat and CO2 detector, follows trail to sleeping human, very systematic approach to dinner location."}, {"f": "Silverfish are often found in bathrooms because they are strongly attracted to high humidity environments.", "a": "Silverfish checks humidity levels in each room, dismisses kitchen, dismisses lounge, approves bathroom, moves in."}, {"f": "Pill bugs roll into a perfect sphere when threatened, a behaviour only pill bugs among woodlice can do.", "a": "Pill bug threatened, curls into perfect sphere, predator nudges sphere, rolls away, both follow it with eyes."}, {"f": "Millipedes have never been found with exactly one million legs with the record standing at just over 1300.", "a": "Scientist counting millipede legs, reaches 1306, announces new record, millipede unaware, continues eating leaf."}, {"f": "Banana spiders actively hunt insects on tree trunks and banana plants at night rather than building webs.", "a": "Banana spider at dusk, inspects tree trunk for insects, no web needed, catches two within first ten minutes."}, {"f": "Wolf spiders are superbly camouflaged in brown-grey tones making them nearly invisible on open ground.", "a": "Wolf spider completely motionless in garden, feet away from birdwatcher who is looking for a bird, never spotted."}, {"f": "Jumping spiders anchor a silk safety line before every jump in case the leap does not go as planned.", "a": "Jumping spider eyes target, attaches silk line to surface, leaps, misses slightly, line holds, swings to safety."}, {"f": "Harvestmen can deliberately lose a leg when grabbed and the detached leg continues moving to distract the predator.", "a": "Harvestman grabbed by bird, leg detaches, leg running around independently, bird follows leg, harvestman escapes."}, {"f": "Giant snails have a radula tongue covered in tens of thousands of microscopic teeth for rasping through plant matter.", "a": "Giant snail at leaf, tongue deploys, teeth rasping audibly, hole appearing methodically, snail very thorough."}, {"f": "Vineyard snails are protected in many European countries for their role in breaking down dead organic matter.", "a": "Vineyard snail at conservation meeting, protected status confirmed, snail's composting contributions noted with appreciation."}, {"f": "Slugs emerge at night because the air is more humid, significantly reducing their risk of drying out.", "a": "Slug checks humidity forecast, daytime dry, waits, evening arrives, humidity up, slug emerges, timing perfect."}, {"f": "Ram's horn snails have a flat spiral shell shaped exactly like an old postal bugle horn.", "a": "Ram's horn snail at shell identification, officer holds up posthorn diagram, holds up snail, match confirmed."}, {"f": "Mussels move very slowly across the sea floor using their muscular foot to find better attachment spots.", "a": "Mussel slightly dissatisfied with current rock, extends foot, shuffles slowly left, re-anchors, better view now."}, {"f": "Oysters form ecologically important reefs that provide shelter for hundreds of other species.", "a": "Oyster reef at marine biodiversity count, two hundred species listed as residents, reef very pleased with the numbers."}, {"f": "Squid escape predators by ejecting a jet of water through a funnel organ providing rapid jet propulsion.", "a": "Squid spotted by shark, funnel fires water jet, squid rockets backward, shark arrives at empty water."}, {"f": "Cuttlefish can match both the colour and three-dimensional texture of their surroundings within milliseconds.", "a": "Cuttlefish crosses sandy patch, skin colour and texture match sand perfectly, crosses rocky patch, matches rock instantly."}, {"f": "The nautilus is the only living cephalopod mollusc with an external hard shell.", "a": "Nautilus at cephalopod meeting, octopus no shell, squid internal shell, nautilus hard external shell, unique."}, {"f": "Argonaut octopuses trap air bubbles at the surface to regulate their buoyancy in open water.", "a": "Argonaut octopus surfaces, captures air bubble, stores in shell, descends, adjusts depth using bubble volume."}, {"f": "Deep sea squid often have arm hooks instead of suckers for gripping extremely slippery deep-ocean prey.", "a": "Deep sea squid grabs slippery prey with hooks, suckers would have failed, hooks very effective, prey disagrees."}, {"f": "Penguins have solid dense bones unlike flying birds which helps them dive more easily by reducing buoyancy.", "a": "Penguin and flying bird compared at buoyancy test, flying bird floats high, penguin sinks efficiently, perfect divers."}, {"f": "Emperor penguins lose up to half their body weight during the breeding fast of several months without food.", "a": "Emperor penguin at start of winter breeding, weighed at start and end, lost half body mass, still standing."}, {"f": "Puffin beaks are dull grey in winter and only develop their vivid rainbow colours in spring for breeding.", "a": "Puffin in January dull grey bill, birdwatcher confused, same puffin in April vivid orange and red bill, very different."}, {"f": "Gannets seal their nostrils before plunging into the sea and breathe through the corners of their beak instead.", "a": "Gannet before dive, nostrils close, beak corners slightly open, plunges, surfaces, nostrils reopen, all functional."}, {"f": "Cormorants have a hooked bill tip that helps them grip slippery fish during the catch.", "a": "Cormorant surfaces with eel in bill, eel very slippery, hook at bill tip maintains grip, eel cannot escape."}, {"f": "Grey herons swallow all prey headfirst, whether fish, mouse, or duckling, without exception.", "a": "Grey heron catches mouse on riverbank, turns it around, headfirst position confirmed, swallows whole, continues waiting."}, {"f": "White storks build their nests on rooftops and chimneys and return to the same nest site year after year.", "a": "White stork returns from Africa, flies over town, spots own nest on roof, lands, begins annual renovation."}, {"f": "Spoonbills feel prey by touch rather than sight, snapping their bill shut the instant they detect anything.", "a": "Spoonbill in murky water, bill sweeping, touches small fish, bill snaps in thirty milliseconds, fish gone."}, {"f": "Bitterns rely so heavily on their reed camouflage they stay motionless until a person is almost on top of them.", "a": "Birdwatcher nearly steps on bittern, bittern only then decides to fly, birdwatcher very surprised, so is bittern."}, {"f": "Female mallards produce the classic loud quack while males make a much quieter hoarse sound.", "a": "Duck identification test, loud quack recorded, confirmed female, quiet raspy sound recorded, confirmed male, many surprised."}, {"f": "Mute swans have such powerful flight muscles that a wing strike can cause serious injury to dogs or small animals.", "a": "Mute swan protecting nest, dog approaches, one wing strike, dog reassessing entire plan, swan returns to sitting."}, {"f": "Geese have sharp vision and keen hearing making them effective watch animals on farmyards and estates.", "a": "Estate owner replaces guard dog with geese, intruder approaches at night, geese alarm immediately, very effective."}, {"f": "Coots are highly territorial and engage in fierce water fights lying on their back and kicking with both legs.", "a": "Two coots dispute territory, both flop onto backs in water, kicking at each other, onlookers very confused."}, {"f": "Moorhens also climb into low shrubs and small trees along waterways unlike coots which stay on the water.", "a": "Moorhen spotted in hawthorn bush two metres above water, birdwatcher checks book, confirmed, this is normal."}, {"f": "Kingfishers have a third transparent eyelid that closes just before they hit the water to protect their eyes.", "a": "Kingfisher dives, transparent lid closes at water impact, opens on resurface, eyes perfectly protected, fish caught."}, {"f": "Great spotted woodpeckers use tree bark crevices as a forge clamping pine cones while extracting seeds.", "a": "Great spotted woodpecker with pine cone, inserts it into bark crack, hammers open, extracts seeds, very neat technique."}, {"f": "Cuckoo eggs match the host species eggs so perfectly in colour and pattern that the host rarely notices.", "a": "Reed warbler returns to nest, cuckoo egg present, counts eggs, all match, incubates all, one very large chick emerges."}, {"f": "Nightingale song can be heard clearly at a distance of one kilometre in quiet conditions.", "a": "Nightingale sings at forest edge, sound detected on smartphone microphone one kilometre away, peak volume measured."}, {"f": "Urban blackbirds have raised the pitch of their song over decades to be heard above traffic noise.", "a": "Rural blackbird and urban blackbird compared, urban sings noticeably higher pitched, both solving the same problem differently."}, {"f": "Starlings include impressions of frogs, other birds, and even human whistles within their complex songs.", "a": "Starling begins singing, transitions into frog croak, then swift call, then someone's ringtone, all very convincing."}, {"f": "Jackdaws have pale grey eyes used to communicate intensely within the flock through direct gaze.", "a": "Jackdaw flock dispute, two jackdaws exchange direct stare, message delivered, both look away, matter resolved."}, {"f": "Magpies are one of very few animals that pass the mirror self-recognition test.", "a": "Magpie placed before mirror, examines reflection, spots mark on feathers, checks own feathers, removes mark, passes."}, {"f": "Jay wing feathers have a blue iridescent patch that catches the light in specific lighting conditions.", "a": "Jay at rest, feathers look black, sunlight hits wing at angle, blue patch blazes unexpectedly, jay very pleased."}, {"f": "Male blue tits with a wider black chest stripe are more dominant and preferred by females.", "a": "Two male blue tits at female assessment, chest stripe measurements taken, wider stripe male chosen, narrower looks down."}, {"f": "Blue tits hang upside down from the thinnest branch tips to find aphids that other birds cannot reach.", "a": "Blue tit at branch tip, rotates to fully upside down, examines aphids on underside of leaves, other birds watching."}, {"f": "House sparrows take dust baths in dry soil to remove excess oils and parasites from their feathers.", "a": "House sparrow finds dry patch in garden, flops in, kicks vigorously, cloud of dust, emerges clean and ruffled."}, {"f": "Swifts have feet so short they can barely walk and all their toes point forward for clinging to surfaces.", "a": "Swift at ground level, attempts walking, shuffles awkwardly, immediately climbs vertical wall, vastly more comfortable."}, {"f": "Barn swallows catch all their insects in flight and skim low over ground or water surfaces to hunt.", "a": "Barn swallow at ten metres altitude, drops to two metres over field, catches fly, returns to ten metres, done."}, {"f": "House martins collect mud pellet by pellet from puddles to build their nest against exterior walls.", "a": "House martin at roadside puddle, collects one mud pellet, flies to nest site, returns, collects another, three hundred trips."}, {"f": "Short-eared owls have proportionally very long wings for their body size allowing highly efficient soaring flight.", "a": "Short-eared owl wingspan measured relative to body, ratio calculated, engineer notes this as optimal glide ratio."}, {"f": "Barn owls have asymmetrically placed ears allowing them to pinpoint prey sounds in three-dimensional space.", "a": "Barn owl in total darkness, mouse rustles under snow, both ear positions triangulate location, dive, perfect hit."}, {"f": "Eagle owls produce a territorial hoot audible up to four kilometres away on still nights.", "a": "Eagle owl hoots at dusk, sound carries four kilometres, other eagle owl hears it, replies, territory confirmed."}, {"f": "Little owls bob their heads repeatedly when curious about something unfamiliar in their environment.", "a": "Little owl spots unusual object in field, begins rapid head bobbing sequence, assesses from multiple angles, satisfied."}, {"f": "Buzzards are lazy hunters spending hours perched on posts scanning for easy prey rather than actively hunting.", "a": "Buzzard on post, has been there for three hours, vole crosses field, buzzard raises eyebrow, calculates effort required."}, {"f": "Kestrels hold their head perfectly still relative to the ground while their body adjusts to the wind.", "a": "Kestrel hovering, body moving with gusts, head completely motionless, ground reference locked, vole located."}, {"f": "Goshawks are ambush specialists often waiting in deep forest cover then bursting out at full speed for attacks.", "a": "Goshawk motionless in dark spruce, pigeon passes clearing, goshawk exits cover at full speed, six second pursuit."}, {"f": "Female sparrowhawks can be up to twice the weight of males making it one of the most extreme size differences in raptors.", "a": "Sparrowhawk pair weighed, female double the male, male looks at scale, looks at female, nods, walks away."}, {"f": "White-tailed eagles have a beak so powerful they can tear apart large fish and waterfowl with ease.", "a": "White-tailed eagle with large pike, tears it into manageable portions with three precise beak movements."}, {"f": "Red kites constantly adjust their deeply forked tail like a rudder to use the smallest thermal updrafts.", "a": "Red kite at low altitude, tail making constant micro-adjustments, rises on thermal invisible to everything else."}, {"f": "Vultures have stomach acid so potent it destroys bacteria lethal to every other known animal.", "a": "Vulture eating anthrax-infected carcass, stomach acid defeats anthrax, vulture continues eating, completely fine."}, {"f": "Condors have a wingspan of three metres and can cover tens of kilometres without a single wingbeat.", "a": "Condor spreads wings, catches thermal, travels thirty kilometres, lands, never flapped once, very fuel-efficient."}, {"f": "Flamingos have an unusually shaped bill with a built-in filter system for separating mud from edible matter.", "a": "Flamingo at muddy lake, bill inverted, filtering system running, mud out one side, food in, very efficient."}, {"f": "Male and female pelicans cooperate closely in raising young and often stay paired across multiple seasons.", "a": "Pelican couple at chick-rearing, share fish delivery schedule, both on incubation rotation, very organised parents."}, {"f": "Albatrosses can lower their heart rate almost to resting levels during sustained gliding flight over the ocean.", "a": "Albatross heart monitor during flight, gliding phase shows heart rate nearly identical to roosting rate, very efficient."}, {"f": "Penguins apply a waterproofing oil from a gland near their tail over their entire plumage before entering the sea.", "a": "Penguin at pre-dive routine, applies oil from tail gland to every feather systematically, enters water bone dry."}, {"f": "Ostriches have two toes on each foot with the inner toe bearing a large nail-like claw for defence.", "a": "Ostrich at toe identification, inner toe claw examined, officer writes nail or weapon, unclear, both accurate."}, {"f": "Emus have a double feather structure where two feathers grow from each single shaft.", "a": "Emu at feather identification exhibit, pulls one shaft, two feathers emerge, scientist examines, writes double output."}, {"f": "Cassowary helmets may help them push through dense vegetation at speed without damaging their head.", "a": "Cassowary running through dense rainforest, helmet clearing branches efficiently, arrives on other side undamaged."}, {"f": "Kiwis lay the largest egg relative to body size of any bird in the world.", "a": "Kiwi at egg size competition, egg measured against body, ratio calculated, every other bird eliminated."}, {"f": "Male peacocks shed their entire train immediately after the breeding season and spend summer with a short tail.", "a": "Peacock in October, magnificent tail completely gone overnight, looks at pile of feathers, shrugs, walks off."}, {"f": "Male pheasants have red facial wattles that enlarge and brighten during the breeding season.", "a": "Male pheasant in winter, modest red wattles, March arrives, wattles visibly expanding and brightening, breeding season confirmed."}, {"f": "Partridges spend the winter in tight family groups called coveys to share warmth and spot predators together.", "a": "Partridge covey in December field, all facing outward, sharing body warmth, collectively monitoring 360 degrees."}, {"f": "Quails produce a distinctive three-note call that sounds like wet-my-lips in English to birdwatchers.", "a": "Birdwatcher hears quail call, writes wet-my-lips in notebook, colleague looks at notebook, hears call, nods, exactly."}, {"f": "Black grouse males display together at communal lekking sites where females evaluate and choose the best performers.", "a": "Black grouse males at lek, all displaying simultaneously, females watching from edge, choosing, very competitive."}, {"f": "Capercaillie males enter a brief trance during their display song where they are completely deaf and blind for seconds.", "a": "Capercaillie male displaying, eyes glazed, ears not working, fox approaches, male oblivious, fox reconsidering the situation."}, {"f": "Dodos were distantly related to pigeons and grew large because their island had no ground predators before humans.", "a": "Dodo at evolutionary origins exhibit, points to pigeon ancestor, then to size chart, island life explains everything."}, {"f": "Moas lost their wings so completely in evolution that they had not even a single vestigial wing bone remaining.", "a": "Moa skeleton exhibit, skeleton complete, wing section labelled, nothing there, sign reads completely absent."}, {"f": "Elephant birds laid eggs containing the equivalent of over two hundred normal chicken eggs in volume.", "a": "Elephant bird egg found by researchers, volume calculated, two hundred chicken eggs, someone had to try."}, {"f": "Hummingbirds have a split tongue tip that works like a pump to draw nectar up rapidly.", "a": "Hummingbird at flower, tongue extends, tip splits, nectar pump activates, flower emptied in two seconds, next flower."}, {"f": "Kingfisher nests accumulate a thick lining of regurgitated fish bones over time from the growing chicks.", "a": "Kingfisher researcher opens nest burrow end of season, thick bone carpet inside, chicks very tidy eaters."}, {"f": "Bee-eaters carefully remove both the sting and venom sac from bees before swallowing to avoid being stung.", "a": "Bee-eater catches bee, taps it against branch twice, sting removed, venom sac flicked away, bee swallowed."}, {"f": "Hoopoes have a long bill perfectly built for probing deeply into soft soil for large insect larvae and worms.", "a": "Hoopoe at soil probe competition, bill inserted, extracts large larva cleanly, competitor with shorter bill still trying."}, {"f": "Toucan bills are extremely light despite their enormous size due to an internal honeycomb bone structure.", "a": "Toucan at bill weight competition, enormous bill on scale, reading very light, honeycomb structure doing its job."}, {"f": "Hornbills seal the nest cavity with the female inside during incubation passing food through a narrow slit.", "a": "Hornbill female sealed inside nest, male arrives with food at slit, passes it through, female takes it, satisfied."}, {"f": "Cockatoos are either left-footed or right-footed showing a clear individual preference for one paw over the other.", "a": "Cockatoo at food item, pauses, extends left foot, handles food left-footed, researcher notes it consistently does this."}, {"f": "Macaws can extract fruit from the hardest jungle pods using their beak with great precision.", "a": "Macaw at hard jungle pod, positions beak at exact angle, applies pressure, pod opens cleanly, contents retrieved."}, {"f": "Wild budgerigars follow rain patterns across inland Australia in enormous nomadic flocks.", "a": "Budgerigar flock watches weather satellite data, notes rain moving east, entire flock lifts off, follows it."}, {"f": "Lovebirds form extremely intense pair bonds and spend much of their time preening each other.", "a": "Lovebird couple at observation, preening session already at two hours, researcher notes continuously mutual grooming."}, {"f": "Lories have such a liquid diet that they produce extremely fluid droppings projected forcefully outward.", "a": "Lory keeper installs protective screens, lory dines on nectar, droppings fired outward at surprising velocity."}, {"f": "Birds of paradise clear their display perch meticulously of every leaf and twig before beginning their performance.", "a": "Bird of paradise at display perch, removes last leaf, removes tiny twig, inspects, clears one more spot, begins."}, {"f": "Bowerbirds paint the inner walls of their bower with crushed berries held in a small piece of bark as a brush.", "a": "Bowerbird selects bark fragment, crushes berry on it, applies to bower wall with deliberate strokes, interior now blue."}, {"f": "Lyrebirds have a syrinx so muscular and complex it can reproduce almost any natural or mechanical sound.", "a": "Lyrebird performs full minute of chainsaw, camera shutter, car alarm, and baby crying, perfectly in sequence."}, {"f": "Mockingbirds can sing continuously for hours incorporating dozens of species calls without repeating a phrase.", "a": "Mockingbird performing at dusk, twenty species calls done, still going, no repeat detected, two hours later still performing."}, {"f": "Grasshopper warblers hide by running mouse-like through dense ground vegetation rather than flying when threatened.", "a": "Grasshopper warbler alarmed, drops to ground, runs through base of reeds like a mouse, vanishes, birdwatcher confused."}, {"f": "Reed warblers can be distinguished from marsh warblers by their more uniform song and streaked back.", "a": "Reed warbler and marsh warbler side by side, identification guide open, back streaking checked, song compared, confirmed."}, {"f": "Robins are so curious they will perch within a metre of gardeners to wait for disturbed worms.", "a": "Gardener digging, robin lands thirty centimetres away, waits, worm exposed, robin takes it, returns to perch."}, {"f": "Wrens build multiple cock nests only one of which the female selects for actual egg laying.", "a": "Wren male builds four nests, presents tour to female, female inspects each, selects third one, male dismantles others."}, {"f": "Dunnocks have a complex polyandrous system where females maintain relationships with multiple males simultaneously.", "a": "Dunnock female with two males, both feeding her chicks, paternity uncertain, all three coexisting, researcher takes notes."}, {"f": "Pied wagtails produce a distinctive two-syllable call during their bounding undulating flight.", "a": "Pied wagtail at flight identification, call recorded during each wing-flap pattern, two syllables confirmed, classified."}, {"f": "Treecreepers always begin at the base of a tree and spiral upward before flying to the base of the next tree.", "a": "Treecreeper starts at base, spirals methodically upward, reaches top, flies to next tree base, starts again, very consistent."}, {"f": "Nuthatches are strongly site-faithful remaining in the same woodland patch throughout their entire life.", "a": "Nuthatch pair at twenty-year habitat check, same trees as always, same nest hole, same patch, very reliable residents."}, {"f": "Goldcrest song is so high-pitched that people over a certain age cannot hear it at all.", "a": "Mixed-age group listening for goldcrest, young members say they hear it, older members hearing nothing, all looking up."}, {"f": "Long-tailed tits sleep huddled tightly in rows on a branch to minimise heat loss through shared body warmth.", "a": "Long-tailed tit family at roosting time, line up on branch, press together tightly, body heat retained, all warm."}, {"f": "Red-backed shrikes impale prey on thorns forming a larder that can include lizards, mice, and large beetles.", "a": "Red-backed shrike larder inspection, contents include lizard, three beetles, two large caterpillars, all neatly arranged."}, {"f": "Golden orioles are often heard before they are seen as they stay very high in the canopy of tall trees.", "a": "Birdwatcher hears unmistakable oriole whistle, looks up for twenty minutes, never locates it, ticks heard on list."}, {"f": "Ravens cooperate with wolves helping locate carcasses and benefiting from the wolves opening them.", "a": "Raven leading wolf pack to frozen carcass, wolf opens it, raven lands and eats, long-established arrangement."}, {"f": "Rooks have a distinctly nasal gruff call quite different from the sharper cry of the carrion crow.", "a": "Rook and carrion crow call comparison at bird identification class, nasal versus sharp, both demonstrated, class notes."}, {"f": "Jackdaws are intensely site-faithful and return to exactly the same nest hole in the same building year after year.", "a": "Jackdaw returns from migration, flies directly to same chimney stack, inspects nest hole, materials still there, nods."}, {"f": "African wild dogs chirp and twitter to each other during hunts unlike any other canid's hunting communication.", "a": "African wild dog pack hunting, chirping and twittering throughout, prey listening, has never heard this before, confused."}];

const VOICEOVER = [
  f => `a deadpan narrator drops the fact cold and flat: "${f}." — said once`,
  f => `a warm curious narrator speaks with genuine wonder: "${f}." — one take`,
  f => `an urgent whispering narrator delivers it like a secret: "${f}." — hushed, intense`,
  f => `a deep cinematic nature-documentary narrator, slow and deliberate: "${f}."`,
  f => `a bright playful narrator pops it like a punchline: "${f}!" — quick and punchy`,
  f => `a breathless narrator rushes in mid-thought with genuine surprise: "${f}?!" — one exclamation`,
  f => `a calm BBC-documentary narrator with quiet authority: "${f}."`,
  f => `a high-energy sports commentator: "${f}!!" — explosive, once, done`,
];
const CAMERAS = [
  `Opens on extreme macro close-up barely recognisable, then instantly pulls back to reveal the subject.`,
  `Opens mid-action cutting straight into the most dynamic moment with no buildup.`,
  `Opens with a dramatic low-angle shot looking up giving the subject enormous scale.`,
  `Opens with a fast whip-pan swinging into the subject from the side full speed.`,
  `Opens with a crash-zoom punch directly into the subject's face or key detail.`,
  `Opens from the subject's POV then instantly cuts to wide shot revealing it.`,
  `Opens in slow-motion close-up of the most striking detail then snaps to normal speed.`,
  `Opens with a bird's-eye overhead shot then dramatically tilts to face-level.`,
];
const BGS = [
  "a lush jungle clearing with soft dappled sunlight filtering through the canopy",
  "a dramatic savanna at golden hour with long shadows stretching across the grass",
  "a vibrant coral reef teeming with colorful fish and swaying anemones",
  "a snowy arctic landscape with pale blue light and distant icebergs",
  "a dense rainforest with misty waterfalls cascading in the background",
  "a sun-baked desert with rippling heat haze and distant dunes",
  "a moonlit ocean surface with bioluminescent waves glowing below",
  "a vibrant underwater kelp forest with shafts of light cutting through",
  "a misty mountain valley with ancient trees and roaring waterfalls",
  "a vivid tidal pool teeming with starfish, crabs, and darting fish",
];

const pick = a => a[Math.floor(Math.random()*a.length)];
let used = JSON.parse(sessionStorage.getItem('u')||'[]');
let hist = [];

function getRandomFact() {
  let avail = FACTS.map((_,i)=>i).filter(i=>!used.includes(i));
  if (!avail.length) { used=[]; sessionStorage.setItem('u','[]'); avail=FACTS.map((_,i)=>i); }
  const idx = avail[Math.floor(Math.random()*avail.length)];
  used.push(idx); sessionStorage.setItem('u',JSON.stringify(used));
  document.getElementById('usedCount').textContent = used.length;
  return FACTS[idx];
}

function buildPrompt(f,a) {
  return `An 8-second Pixar-style comedic 3D animation YouTube Short, 9:16 vertical format, hyper-detailed, vibrant colors, exaggerated cartoony character design, expressive rubbery faces, slapstick energy, clean studio lighting.

VOICE: Use the voice named Alnilam. This is fixed — do not use any other voice.

AUDIO: Energetic upbeat background music from the very first frame. Over this music, ${pick(VOICEOVER)(f)} CRITICAL: voiceover speaks the fact ONCE then stops. No repetition, no filler, absolute silence from narrator after delivery.

VISUAL PACING: Every scene cut or visual transformation begins exactly 0.1 to 0.2 seconds BEFORE the corresponding spoken word. Visuals always lead audio by this fraction.

AUDIO OUTRO PAD: After the final word, animation continues 1.5 to 2 seconds with no voiceover. Background music fades gradually to complete silence. No abrupt ending.

VISUALS (0-8s): Full frame full screen: Pixar-style comedic 3D animation of ${a}. The background and setting must match the animal's natural habitat — forest animals in forests, savanna animals on savanna, ocean animals underwater, arctic animals on ice, jungle animals in jungle, desert animals in desert. NO presenter, NO "Did you know", NO intro. ${pick(CAMERAS)} The animal has exaggerated cartoon personality, big expressive eyes, rubbery reactions, comic timing. CRITICAL: the animal never speaks, never mouths words, never reacts to the voiceover — it only performs physical actions and expressions. The voiceover is separate from the animation. Continuous motion throughout. No loops, no repeated frames.

Pixar comedic art style throughout. No real-world footage.`;
}

function renderResult(item, n) {
  const p = buildPrompt(item.f, item.a);
  return `<div class="card"><div class="card-label">📌 Feitje${n>1?' '+n:''}</div><div class="fact-text">${item.f}</div></div>
<div class="card"><div class="card-label">🎨 Animatie${n>1?' '+n:''}</div><div class="anim-text">${item.a}</div></div>
<div class="card"><div class="card-label">📋 Google Flow Prompt${n>1?' '+n:''}</div><div class="prompt-box" id="pb${n}">${p}</div>
<button class="copy-btn" id="cb${n}" onclick="copyPrompt(${n})">Kopieer prompt${n>1?' '+n:''}</button></div>`;
}

function generate(count) {
  let html='';
  for(let i=1;i<=count;i++){
    const item=getRandomFact();
    hist.unshift({f:item.f,a:item.a,t:new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})});
    if(hist.length>12) hist.pop();
    html+=renderResult(item,i);
  }
  document.getElementById('results').innerHTML=html;
  renderHistory();
}

function copyPrompt(n) {
  navigator.clipboard.writeText(document.getElementById('pb'+n).textContent).then(()=>{
    const b=document.getElementById('cb'+n);
    b.textContent='Gekopieerd! ✓'; b.classList.add('copied');
    setTimeout(()=>{b.textContent='Kopieer prompt'+(n>1?' '+n:'');b.classList.remove('copied');},2500);
  });
}

function renderHistory() {
  if(!hist.length) return;
  document.getElementById('history').style.display='block';
  document.getElementById('historyList').innerHTML=hist.map((h,i)=>
    `<div class="history-item" onclick="loadH(${i})"><div class="history-fact">${h.f}</div><div class="history-meta">${h.t} · klik om te laden</div></div>`
  ).join('');
}

function loadH(i) {
  document.getElementById('results').innerHTML=renderResult({f:hist[i].f,a:hist[i].a},1);
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
