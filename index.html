polarised light signals for private communication — invisible to every other creature on the reef.", "a": "A mantis shrimp flashes a complex polarised light message to another mantis shrimp two metres away. All surrounding fish: see nothing. The message is received. A reply is sent. A full conversation happens in polarised light that the entire reef is completely blind to. Two fish watch the mantis shrimp gesturing at each other. No idea what is happening. Walk away."}, {"f": "The Greenland shark is the longest-lived vertebrate known — one specimen was estimated at 512 years old.", "a": "Scientists with carbon dating equipment approach an enormous pale shark at the bottom of the ocean. They take a sample. Run the tests. The result comes back: 512 years. One scientist shows the number to another. They both look at the shark. The shark is completely still. Has been completely still since the 1500s. One eye slowly opens. Closes again."}, {"f": "The mimic octopus was only discovered in 1998 — despite being common across Southeast Asian reefs for millions of years.", "a": "A marine biologist's office wall: decades of expedition photos. In the background of EVERY photo: an octopus, perfectly disguised as a different thing each time. A clipboard. A rock. A piece of coral. A boot. It has been in every photo for thirty years. The biologist notices it in 1998. Frames the photos. Looks closer at each one. It is in all of them."}, {"f": "The electric eel can produce three different types of electrical discharge for three different purposes.", "a": "An electric eel at a control panel with three clearly labelled buttons. NAVIGATE: low pulse, gentle, sends out a soft beep. STUN: medium pulse, a satisfying ZAP. KILL: the eel pauses before this one. Hovers a fin over it. Looks at camera. Does not press it. Presses STUN instead. A nearby fish goes horizontal. Close enough."}, {"f": "The slow loris has a toxic bite — it licks a venom gland in its armpit to create a toxic saliva before biting.", "a": "A slow loris moves through the jungle. Very slowly. An animal approaches. The slow loris raises one arm. Very slowly. Begins licking the armpit gland. Very slowly. Raises its head. Very slowly. The other animal left nine minutes ago. The slow loris continues raising its head in the dark. Alone. Still very slowly."}, {"f": "The honeybee's waggle dance communicates the exact distance, direction, and quality of a food source to the entire hive.", "a": "A bee returns to the hive and immediately launches into a very specific dance: figure eights, waggles, angles, duration. Other bees crowd around. One takes notes. Another calculates. A third draws a map. Fourteen seconds of dance: a complete GPS coordinate set. The crowd disperses and flies to the exact flower. The dancing bee sits down. Done."}, {"f": "The shrimp Halocaridina rubra has lived in sealed anchialine pools in Hawaii for 5 million years with no outside food source.", "a": "A geologist maps a volcanic island. Finds a sealed pool of water with no connection to the ocean. Peers in. Shrimp. MILLIONS of shrimp. He checks his notes. This pool has been sealed for 5 million years. He looks at the shrimp. The shrimp look back. Nobody knows how they got here. The shrimp were not asked."}, {"f": "The dragonfly can predict where prey will be and intercept it — rather than chasing it directly.", "a": "A dragonfly on a branch. A fly zigzags unpredictably across the clearing. The dragonfly does not follow it. It calculates. Angles. Speed. It launches — not toward the fly, but toward an empty point in space. The fly, following its own chaotic logic, arrives at exactly that point. The dragonfly is already there. The fly never understood what happened."}, {"f": "Some goblin sharks have been found with their own teeth in their stomachs — bitten off by the snapping force of their own jaw.", "a": "A goblin shark at a dentist. The dentist counts the teeth in its jaw. Counts the x-ray. Frowns. Counts again. There are fewer teeth in the jaw than in the stomach. The dentist looks at the shark. The shark opens its jaw and demonstrates the spring-loaded snap. The dentist steps back. Writes: self-inflicted tooth loss. Closes the file."}, {"f": "The pistol shrimp snap creates a water jet moving at 97 km/h — faster than most fish can swim.", "a": "A speed gun is pointed at a pistol shrimp in a tank. The shrimp snaps. The gun beeps: 97 km/h. The operator looks at the gun. Looks at the shrimp. The shrimp is 2 centimetres long. The operator shows the reading to a colleague. The colleague shakes their head. They look at the shrimp. The shrimp snaps again. Same reading."}, {"f": "Elephants communicate using infrasound — below 20Hz — which can travel through the ground for kilometres.", "a": "An elephant on a savanna presses one foot to the ground. CLOSE-UP: the soil vibrates almost invisibly. The elephant goes still. Its eyes move. In its mind: another herd, 30km away, mid-stride. The elephant turns. Makes one low call that we cannot hear. Three kilometres away, another elephant's foot suddenly lifts from the ground. It listens. Turns."}, {"f": "The star-nosed mole processes sensory information faster than any other mammal — its brain is mapped more to its nose than any other body part.", "a": "A star-nosed mole in a laboratory maze. It moves at normal speed — but every time it touches anything with its nose-star the brain scan next to it EXPLODES with activity. Red zones everywhere. The mole touches a wall — massive brain event. Touches food — the scan nearly overloads. It eats. The scan slowly calms down. The mole blinks. Was already full."}, {"f": "Cleaner wrasse fish can recognise themselves in a mirror — passing a test that most animals fail.", "a": "A cleaner wrasse is shown a mirror. It swims closer. Tilts. Tilts again. Moves a fin. The reflection moves a fin. It spots a mark on its own body that was placed there by scientists. It goes to the mirror. Checks the mark. Then — turns away from the mirror. And tries to scratch the mark off its own body. It understood. It knew. That's me."}, {"f": "The box jellyfish has 24 eyes — but no brain to process what they see. Scientists don't know how it uses them.", "a": "A box jellyfish floating through the ocean. 24 eyes, all pointing different directions, all seeing perfectly. A fish approaches — all 24 eyes rotate toward it. The jellyfish processes nothing. Has no brain. The fish swims past. All 24 eyes follow it. Then all 24 eyes look somewhere else. Then back. Then at something else entirely. Nobody home."}, {"f": "The secretary bird can kick with a force five times its own body weight — shattering a snake's skull in one blow.", "a": "A secretary bird spots a cobra in tall grass. Sets its briefcase down with care. Takes off its reading glasses. Folds them. Places them on the briefcase. Looks at the snake. One kick: CRACK. Puts the glasses back on. Picks up the briefcase. Continues its morning walk. It was barely a detour."}, {"f": "Dolphins can detect cancer and pregnancy in humans using echolocation — several reports of dolphins behaving differently around pregnant women.", "a": "A dolphin at an aquarium show. A visitor in the front row. The dolphin's echolocation sweeps over the crowd — click click click. It stops. Looks at one specific person. Swims over. Clicks again. Circles them. Stares. The handler checks her clipboard. No protocol for this. The dolphin is extremely certain about something. Everyone is confused. The dolphin is not."}, {"f": "The immortal jellyfish was released into international shipping lanes accidentally — and is now found in every ocean on Earth.", "a": "Port authority, 1980s. A jellyfish in ballast water: not noticed. Container ship departs. Arrives: new ocean. The jellyfish exits. Thrives. Reverses its age. Continues. Another ship. Another ocean. Then another. A map fills with red dots: every ocean, every major port. Pan back to the original jellyfish, now in a tiny armchair with a massive stamp collection. Retired. Everywhere."}, {"f": "The mantis shrimp has been documented punching the same spot in aquarium glass repeatedly — until the glass breaks.", "a": "A mantis shrimp in an aquarium. It eyes the glass. Punches it. Looks. Punches it again. Same spot. A hair-thin crack appears after day three. The aquarium keeper notices. Applies extra glass. The mantis shrimp: examines the new glass. Same spot. Same punch. It is patient. It has time. It always wins this eventually."}, {"f": "The opossum is completely immune to rattlesnake, cottonmouth, and most other venomous snake bites.", "a": "A rattlesnake strikes an opossum directly on the leg. The opossum looks at its leg. Looks at the snake. Looks at its leg again. Shrugs. Continues walking. The snake watches it go, feeling philosophically defeated. A second snake asks what happened. The first snake has no answer. The opossum rounds a corner. Still walking. Fine."}, {"f": "The pistol shrimp is so loud that submarines use the background snapping noise of shrimp colonies as acoustic cover.", "a": "A submarine control room. The captain orders silent running. The sonar officer puts on headphones. Eyes go wide. Holds them out: LISTEN. The captain listens: continuous, deafening crackling from all directions. Traces it. It is: a reef. Full of 2-centimetre shrimp. The captain stares at the sonar display. Nods slowly. Perfect cover. He did not expect this."}, {"f": "The glass frog's heart is not only visible through its transparent chest — it stops and restarts several times each night.", "a": "Scientists watching a glass frog sleep. Heart monitor: BEEP BEEP BEEP. Then: flatline. Everyone leans forward. Twelve seconds pass. BEEP BEEP BEEP — resumes. Everyone exhales. The frog sleeps on. Twenty minutes later: flatline again. Everyone leans forward again. They do this all night. The frog wakes up in the morning perfectly fine. The scientists do not look fine."}, {"f": "The leafcutter ant's fungus garden is so specialised that the fungus cannot survive outside the colony — it has co-evolved for 50 million years.", "a": "Scientists attempt to cultivate the ants' fungus in a laboratory. They provide the right temperature. The right humidity. The exact nutrients. The fungus wilts. They adjust everything. It wilts again. They bring in the world's top mycologist. The fungus wilts when he arrives. The scientist calls an ant colony. An ant arrives. The fungus immediately thrives. The mycologist packs up his bags."}, {"f": "The electric eel produces enough voltage to light 10 LED bulbs — it generates electricity using 6,000 specialised electrocyte cells.", "a": "An electric eel at a power station presentation. A scientist attaches wires to it — carefully, at arm's length. A string of ten LED bulbs. The eel discharges. All ten bulbs: on. Bright. The scientist looks at his power bill. Looks at the eel. The eel discharges again. Bulbs: on. The scientist picks up a phone and calls his energy provider."}, {"f": "Some ants will sacrifice themselves by blocking the entrance to their nest with their own body — perfectly sized to seal the hole.", "a": "An ant colony under attack. One soldier ant — a perfectly cylindrical species — approaches the entrance hole. Turns around. Backs in. Plugs it completely. Other ants on the outside: queuing politely. An attacker approaches. Finds: a wall of ant. Tries to squeeze past. Cannot. The soldier ant sealing the door gives a small salute. Holds position. Will hold all day."}, {"f": "Humpback whales create bubble-net feeding formations by exhaling in precise spiral patterns to trap fish.", "a": "Underwater. A group of humpback whales spread out. On cue: they begin exhaling in slow coordinated spirals, bubbles rising in perfect cylindrical walls. The fish inside the bubble cylinder look up. Look down. Look at each other. The walls tighten. From above: a humpback launches upward through the fish ball, mouth open. The other whales surface around it. Choreography."}, {"f": "The platypus was so bizarre when first described to European scientists that they thought it was a taxidermy hoax.", "a": "London, 1799. A scientist opens a crate from Australia. Inside: a platypus specimen. He stares. Picks it up. Examines the bill. Examines the beaver tail. Examines the fur. Finds the venomous ankle spur. He goes to his desk. Writes a letter to the sender. Dear Sir: we are aware of the joke. Please send the real animal. He mails it. He waits."}, {"f": "The coelacanth's fins move in a diagonal pattern identical to four-legged animal locomotion — suggesting they are a missing link.", "a": "A coelacanth swims. In slow motion, its fins move: front left, back right, front right, back left. Exactly like a dog walking. Scientists watch the footage. Rewind. Watch again. One scientist looks at a dog. Watches the dog walk. Looks at the screen. Looks at the dog. Looks at the screen. Sits down. Opens a very large notebook."}, {"f": "The vampire bat shares blood meals with starving roostmates — and remembers who shared with it, reciprocating later.", "a": "A bat returns to the roost from a successful hunt, visibly full. Spots a friend in the corner — thin, unsuccessful night. Sits next to it. A long pause. Then regurgitates a share. The thin bat accepts. Next week: the roles are reversed. The once-thin bat spots its friend hungry. Sits beside it. Same pause. Same gesture. The roost is quiet."}, {"f": "The deep sea bioluminescent dragonfish uses red light — a wavelength no other deep sea creature can see — as a private spotlight.", "a": "Total blackness, deep ocean. The dragonfish switches on its red headlamp. To every other creature: nothing happens. The darkness is unchanged. But through the dragonfish's eyes: the seafloor is lit up in perfect red clarity. Prey everywhere. It approaches a fish. The fish sees nothing coming. The dragonfish sees everything. Switch. Approach. Done."}, {"f": "Horseshoe crabs have been using the same basic body plan for 450 million years — older than the dinosaurs by 200 million years.", "a": "A timeline on screen. HORSESHOE CRAB APPEARS: 450 million years ago. DINOSAURS APPEAR: 230 million years ago. DINOSAURS GONE: 65 million years ago. HORSESHOE CRAB: still here. The horseshoe crab walks across the screen, ignoring the timeline. It walked across similar screens before the dinosaurs existed. It will walk across similar screens after we are gone."}, {"f": "The orca is not a whale — it is the largest member of the dolphin family.", "a": "An orca at a family reunion. All the dolphins are there: bottlenose, spinner, common. They are all very small. The orca walks in. Everyone stares upward. The orca finds its name on the seating chart. Sits down. The chair breaks. A tiny dolphin cousin hands it a name badge. It reads: DOLPHIN. The orca pins it on. Takes a vol-au-vent."}, {"f": "The peregrine falcon's nostrils have baffles that deflect high-speed airflow — so it can breathe while diving at 380 km/h.", "a": "A wind tunnel. An engineer holds up a tiny peregrine falcon diagram. Points to the nostril baffles. Points to the airspeed gauge: 380 km/h. Points back to the baffles. Other birds have gathered around the diagram. A pigeon squints at the nostril diagram. A sparrow takes a photo. The engineer taps the speed number: still breathing at this. The pigeon puts the photo away."}, {"f": "The mimic octopus has been filmed impersonating animals that do not live in its habitat — possibly having seen pictures or carcasses.", "a": "An octopus on a reef transforms into something no marine biologist can identify. They photograph it from every angle. Consult twelve books. Can't find it. Show the photos to other marine biologists. Nobody knows. They show it to the octopus. The octopus transforms back to normal. Shrugs eight arms. Went off-script. Improvised. Very pleased with itself."}, {"f": "The lyrebird's mimicry is so accurate it once reproduced the sound of a forest being chainsawed — alerting scientists to illegal logging.", "a": "A scientist in the field has a recording device. A lyrebird nearby opens its beak. From the bird: chainsaws, trucks, a reversing beeper. Full construction site audio. The scientist spins around. There is no construction. Just a bird. He calls the forestry department. They check the coordinates. There WAS construction. Illegal. Two kilometres away. Found because of a bird."}, {"f": "Spiders can fly hundreds of kilometres using silk 'sails' — a behaviour called ballooning, used to colonise new territories.", "a": "A spider at the edge of a tall grass stem. It points its abdomen up. Releases a thread of silk. Waits. The wind catches it. Then: the spider launches upward — carried by the silk — rising past treetops, past rooftops, past birds. It looks down at the shrinking landscape. Takes stock. This was not the original plan. But it works."}, {"f": "The blue-ringed octopus rings glow as a warning — when the rings are not glowing, the octopus is invisible against the seafloor.", "a": "A scientist at a rock pool cannot find the blue-ringed octopus everyone is looking for. It has been in the frame this whole time. She looks left. Looks right. RIGHT THERE. Then it glows: sudden electric blue rings blazing across its body. THERE it is. She screams and backs into the wall. The octopus stops glowing. Disappears again. Still there."}, {"f": "Gorillas build a brand-new sleeping nest every single night — a fresh one, high in a tree, from scratch.", "a": "A gorilla arrives at its nightly bed-making session. Selects branches. Bends them. Folds in leaves. Pats it down. Tests it with one hand. Adjusts one corner. Tests again. Satisfied. Lies down. Falls asleep immediately. In the morning it gets up, looks at the nest once, and walks away. Doesn't think about it again. Somewhere else tonight."}, {"f": "The wood turtle in North America has been shown to learn mazes as well as rats — its brain-to-body ratio rivals mammals.", "a": "A wood turtle and a rat at the starting line of a maze. GO. The rat sprints. The turtle begins. The rat finishes: 45 seconds. The turtle is still going. Ten minutes later: the turtle finishes. A scientist checks both routes. The rat took one wrong turn. The turtle: zero. The rat is embarrassed. The turtle does not notice."}, {"f": "The pistol shrimp snap lasts only 1 millisecond — but in that millisecond the pressure drop causes the water to briefly vaporise.", "a": "A slow-motion camera is trained on a pistol shrimp. Normal speed: nothing visible. Slow it down to 1000x: the claw moves, a jet fires, a bubble forms — and inside the bubble, for one frame, the water has turned to steam. Then it collapses. Back to normal. In 1 millisecond. The camera struggles to keep up with something that happens in a thousandth of a second."}, {"f": "The archerfish recognises human faces — and spits specifically at people it has been trained to associate with feeding.", "a": "An archerfish in a tank. Five human faces shown: A, B, C, D, E. Only face C is associated with food. Tests begin. Face A appears. The archerfish: nothing. Face B: nothing. Face C: SPLOOSH — precise jet of water directly at the face. Face D: nothing. The researcher holds up face C again. SPLOOSH. The archerfish is very certain. Face C. Every time."}, {"f": "Some species of ants farm aphids — they carry them to plants, protect them from predators, and 'milk' them for honeydew.", "a": "An ant in a tiny cowboy hat rounds up aphids with a miniature lasso. Drives them to a fresh plant. Posts guards at every angle. At milking time: taps each aphid gently on the abdomen. Tiny droplets of honeydew appear. Collected in even tinier buckets. The ant loads the buckets onto a cart. Pushes it underground. Checks on the aphids before leaving. All well."}, {"f": "The giant anteater eats up to 35,000 ants per day — and visits up to 200 different mounds to avoid depleting any single colony.", "a": "A giant anteater with a clipboard. Column A: today's mounds. Column B: portion consumed. Column C: next visit date. It approaches a mound. Eats for exactly 90 seconds. Marks the clipboard. Moves on. Another mound: 90 seconds. Marks it. It is managing 200 mounds on a sustainable rotation. It has been doing this longer than most empires have existed."}, {"f": "The migratory salmon returns to the exact river where it was born using the unique chemical signature of that specific water.", "a": "Open ocean. A salmon stops swimming. Something in the water. It turns. Follows a trace — imperceptibly faint to anything else. Over mountains, up waterfalls, against torrents. Two weeks of impossible swimming. Arrives at a specific shallow gravel bed. Stops. This is it. Has never been here as an adult. Knows it immediately. The water smells like birth."}, {"f": "The mantis shrimp repairs its own burrow every day — carrying specific materials from surrounding areas with precision.", "a": "A mantis shrimp emerges from its burrow at dawn with a tiny wheelbarrow. Collects pebbles — only the right size. Returns. Places them. Studies the result. Removes one. Tries a different pebble. Better. Makes a note on a tiny clipboard. Goes back for another load. The surrounding reef has been slowly, methodically dismantled over the course of several weeks."}, {"f": "Dolphins have a signature whistle that functions as a name — used specifically to address other dolphins, not themselves.", "a": "An underwater microphone captures a dolphin making one specific three-note whistle, then going quiet. The recording is played back to the pod. One specific dolphin's head snaps up: that was MY name. It replies immediately. They click back and forth for twenty seconds. Two other dolphins hear their names mentioned. They both look over at the same time."}, {"f": "The axolotl is permanently juvenile — it never undergoes metamorphosis, retaining its gills, fins, and larval features for life.", "a": "An axolotl sits in a waiting room at the transformation office. Takes a number. Waits. The salamander in front of it goes in. Comes out with legs, no gills, completely different. The axolotl's number is called. It goes in. Comes back out. Exactly the same. The clerk marks: DECLINED METAMORPHOSIS. The axolotl sits back down. Comfortable with who it is."}, {"f": "The platypus is one of the only mammals that lays eggs — and when the eggs hatch, the mother has no nipples, so milk seeps through her skin.", "a": "A platypus mother tends two tiny eggs. They hatch. Tiny puggles emerge. They look for something to feed from. Look left. Look right. The mother looks down. Shrugs. Milk appears through her skin like a gentle sweat. The puggles look at this. Look at each other. Lick the fur. Shrug. Works fine. Entirely unprecedented. Completely functional."}, {"f": "The slow loris is the only venomous mammal with an elbow lick — it applies toxin to its fur to protect its young when it leaves the nest.", "a": "A slow loris mother prepares to go hunting. Very slowly raises one arm. Very slowly licks the venom gland underneath. Very slowly covers its baby in the toxic fur-rub. The baby now glows gently with toxin. Extremely slowly, the mother departs. A predator approaches the baby. Licks it once. Immediately regrets everything. Leaves faster than the slow loris ever could."}, {"f": "The wandering albatross can travel 10,000 kilometres in a single foraging trip — sometimes circumnavigating the Southern Ocean.", "a": "An albatross spreads its wings and takes off from a cliff. A tracker shows its path: east, east, east, curving south, south, west — all the way around the bottom of the world. 10,000 kilometres. 14 days. It lands back on the same cliff. Its partner is there. Has been waiting. The albatross sets down its GPS. Notes the mileage. Sits down."}, {"f": "The blobfish lives at depths where the pressure is 120 times greater than at sea level — its flesh is slightly less dense than water.", "a": "A blobfish in its natural environment at 900 metres depth: an elegant, streamlined fish with normal proportions, gliding smoothly. Then a trawl net appears. The fish is hauled up 900 metres. We watch in real time as the face slowly, tragically sags — eyes widening, nose drooping, skin loosening. It surfaces. Scientists react. The fish stares into the camera. It used to look great."}, {"f": "Elephants purr — producing infrasonic rumbles when content that travel through the ground and can be felt rather than heard.", "a": "A researcher places both hands flat on the ground near a purring elephant herd. A low vibration moves through the soil and up her arms. She closes her eyes. Around her, silently, all the elephants are rumbling — inaudible to us, a frequency below hearing. She opens her eyes. The herd stands quietly. She lifts her hands. The vibration fades. She puts them back down."}, {"f": "The pistol shrimp colony on a single coral reef can number in the millions — each one snapping continuously.", "a": "A hydrophone is lowered into a coral reef. The scientist puts on headphones. We watch her face: confusion, then disbelief, then a kind of awe. She slowly removes the headphones and holds them out. We hear what she hears: a continuous, overwhelming crackling that sounds like the ocean itself is applauding. She mouths: shrimp. Just: shrimp."}, {"f": "The deep sea comb jelly produces the most complex bioluminescent light show of any animal — shifting colours across its entire body.", "a": "Total darkness, deep ocean. Then: a comb jelly, lit from within, rows of cilia beating in slow waves — each wave refracting into a different colour. Blue. Green. Red. Gold. All at once. All shifting. It is not trying to attract anything. It is not trying to warn anything. It simply moves through the dark, producing one of the most beautiful things on Earth, for no audience."}, {"f": "The ocean sunfish — the heaviest bony fish alive — starts life as a 2.5mm larva and grows 60 million times its birth weight.", "a": "A SCALE COMPARISON chart. Left side: a 2.5mm dot, barely visible. Right side: an ocean sunfish, 2,300 kilograms, enormous. An arrow labelled 60 MILLION TIMES. A scientist measures the dot. Measures the fish. Looks at the arrow. Shows it to a colleague. The colleague stares at the arrow for a long time. The sunfish floats past, unbothered."}, {"f": "The Venus flytrap can count electrical signals — it only closes on the second touch within 20 seconds to avoid wasting energy on raindrops.", "a": "A raindrop lands on a Venus flytrap trigger. The plant counts: ONE. Waits 20 seconds. Nothing. Resets. Another raindrop: ONE. Waits. Resets. A fly lands: ONE. Moves. TWO — SNAP. Inside the closed trap: darkness, digestion. The raindrop was not a fly. The plant has been doing this for millions of years. It has never made a mistake about rain."}, {"f": "The blue whale's heart beats as slowly as 2 beats per minute during a deep dive — one of the slowest heartbeats of any mammal.", "a": "A heart monitor tracking a blue whale. Surface: BEEP BEEP BEEP BEEP. Fast. Normal. It begins to dive. BEEP... BEEP... At 200 metres: BEEP............BEEP. At depth: BEEP.....................................BEEP. One scientist counts the seconds between beats. Counts to 30. Then another beat. He puts down his pencil. Looks at the ocean. Somewhere down there: one beat. Then waiting. Then one more."}, {"f": "The crow family has been shown to use causal reasoning — understanding that an action leads to a consequence, not just associating them.", "a": "A crow is shown a box with a visible mechanism: drop a stone, the door opens, food appears. A rook is shown a different box with the same principle but different appearance. Without practice, the rook solves it immediately — applies the principle, not the specific memory. A scientist underlines something in a textbook. Then underlines it again. Then circles it."}, {"f": "The pistol shrimp has been measured producing a sound louder than a jet engine — at close range, it is 218 decibels.", "a": "An underwater decibel meter placed next to a pistol shrimp. The shrimp snaps. The meter reads 218. The meter falls off its stand. The scientist picks it up. Checks it. Places it back. The shrimp snaps again. 218. The meter falls off again. The scientist looks at the meter. Looks at the shrimp. The shrimp is 2 centimetres. The scientist writes: confirmed. Sits down."}, {"f": "The immortal jellyfish has no predators that can eliminate it — it simply keeps cycling through life stages indefinitely.", "a": "A documentary voiceover: 'The immortal jellyfish has no natural predators capable of ending its cycle.' A shark swims toward one. It reverses age before being bitten. A seabird dives at one. It has already cycled back to a polyp. Something else tries. It is already young again. The documentary ends. The jellyfish is still going. The credits roll over it, still going."}, {"f": "The mantis shrimp has been observed attacking divers — striking with enough force to draw blood through a wetsuit.", "a": "A diver descends to a reef. Spots a beautiful mantis shrimp. Reaches toward it for a photo. The mantis shrimp looks at the hand. Looks at the diver. Looks at the hand. The diver continues reaching. The shrimp's club twitches. One strike: the wetsuit dents. The diver ascends rapidly. Breaks the surface. Looks at the dent in the glove. Looks down at the reef. The mantis shrimp has returned to its burrow."}, {"f": "The peregrine falcon's eyes can resolve detail at twice the distance of human eyes — it can spot a pigeon from over a kilometre away.", "a": "A peregrine falcon on a clifftop. A researcher holds up a tiny flag one kilometre away. Waves it. The falcon blinks once. Tilts its head. It has seen the flag. It has seen which hand the researcher is holding it in. It has seen the researcher's expression. The researcher is 1,000 metres away. Appears as a dot to us. The falcon is already making plans."}, {"f": "The cuttlefish can change colour even though it is completely colblind — it matches colour by reading polarised light.", "a": "Scientists confront a cuttlefish with a colour-matching test. It passes perfectly. They show it a red object. It turns red. A blue object. It turns blue. They reveal: the cuttlefish is colourblind. Complete silence. They look at each other. They look at the cuttlefish. The cuttlefish turns whatever colour the scientists are. Then turns back to normal. Swims away."}, {"f": "Some species of ants go to war — massive coordinated battles between colonies that can involve millions of individuals and last for days.", "a": "Two ant colonies face each other across a line of bare earth. Generals on both sides consult tiny maps. A signal goes out. The lines advance. A slow-motion shot: thousands of tiny armoured bodies clashing at the centre. Three days later: the battlefield is quiet. Scattered. Both colonies: diminished. Two generals on opposite sides file reports. Mark territory. Begin rebuilding."}, {"f": "The deep sea anglerfish female absorbs the male permanently — he fuses to her body and provides sperm for life in exchange for nutrients.", "a": "A tiny male anglerfish approaches an enormous female. He reaches out and bites her side. Begins to fuse. Over weeks he loses his eyes. His fins. His organs. Eventually there is just a small lump on her side, supplied by her blood, sending sperm when needed. The female swims on. She has several lumps. She does not think about them. She has places to be."}, {"f": "The wolverine has been documented driving bears and mountain lions away from their kills — despite being 30 times smaller.", "a": "A grizzly bear finishes a kill and lies down next to it. Footsteps in the snow. A wolverine appears. The bear looks at it. The wolverine does not slow down. Keeps coming. The bear is enormous. The wolverine is the size of a medium dog. They look at each other. Thirty seconds pass. The bear gets up and leaves. The wolverine sits on the carcass. Normal Tuesday."}, {"f": "The axolotl can receive a transplanted eye and integrate it — the eye will function and wire to the axolotl's brain.", "a": "A surgical team of tiny axolotl doctors. A careful transplant. The axolotl opens its new eye. Blinks it. Looks around. Looks at something. Looks at the doctors. They hold up a sign with letters on it. The axolotl reads the top row. Reads the second row. Looks at them. The doctors make notes. The new eye works. It works perfectly. It has been awake for six minutes."}, {"f": "Dolphins sleep with half their brain while using the other half to continue surfacing for air — they are never fully unconscious.", "a": "A dolphin sleep study. Sensors on both brain hemispheres. Night one: left hemisphere asleep, right hemisphere: alert. Night two: right hemisphere asleep, left hemisphere: alert. A scientist reviews the data. Draws a diagram. Looks at the dolphin. The dolphin surfaces for air, eyes half-closed. It is technically asleep and awake at the same time. The scientist stares at the diagram for a very long time."}, {"f": "The secretary bird can deliver a kick at 195 Newtons — in under 15 milliseconds — faster than the eye can follow.", "a": "A high-speed camera trained on a secretary bird's leg. Normal speed: the leg moves. That's it. 1000x slow motion: the leg swings back, the foot rotates, the talons concentrate, the IMPACT — and everything compresses: snake skull, ground impact, full transfer — in 15 milliseconds. Normal speed: the leg moved. That's all we saw. The snake is motionless. The bird walks on."}, {"f": "The hagfish can produce enough slime to fill a bucket in seconds — and the slime is 10,000 times softer than Jell-O.", "a": "A chef in an underwater kitchen attempts to work with hagfish slime. Picks up a bucket. It is full in 4 seconds — he hadn't even asked. He tries to pour it. It doesn't pour. It doesn't stay. It doesn't do anything normal. He holds up a spoon. The slime climbs the spoon. He puts the spoon down. The slime is still climbing. He leaves the kitchen."}, {"f": "The fiddler crab waves one enormous claw at females — but the wave is so species-specific that females only respond to their own species' rhythm.", "a": "A fiddler crab waving its enormous claw. WAVE WAVE WAVE. A female of a different species walks past. Nothing. WAVE WAVE WAVE. Another wrong species. Nothing. The right female walks by. She stops. He waves faster. She turns. He waves at maximum speed. She approaches. He was waving for three hours. Completely worth it."}, {"f": "The pistol shrimp's snap creates a shockwave that travels through the water — it is the snap, not the claw hitting anything, that stuns prey.", "a": "Slow motion: the pistol shrimp's claw snaps. The claw touches nothing. But a shockwave expands outward from the snap like a sonic boom in water. The fish next to the shrimp — not touched, not bitten — is simply knocked sideways by air the shrimp never touched it. The shrimp examines the fish. Nods. Purely physics."}, {"f": "The jumping spider has four pairs of eyes arranged around its head — giving it nearly 360-degree vision with no blind spot.", "a": "A jumping spider in a room. Eight tiny tourists try to sneak up on it from different directions. One from the left. One from behind. One from above. The spider tracks all of them simultaneously without moving its head. The tourists realise this. Stop. The spider looks at all eight of them at the same time. They leave."}, {"f": "The platypus can electrolocate prey in complete darkness — sweeping its bill like a metal detector through the riverbed.", "a": "A platypus in pitch black water, bill sweeping left to right like a slow scan. In its mind: every buried shrimp glows bright. It ignores rocks, mud, sticks — only organisms register. It collects five shrimp in sequence. Surfaces. Sets them down. Does a quiet bill-check maintenance check. Dives again. The bill has never been wrong."}, {"f": "Cuttlefish have been observed flashing one pattern on the side facing a rival male and a completely different pattern on the side facing a female — simultaneously.", "a": "A cuttlefish between a rival male and a female. Left side: aggressive dark pulsing patterns — BACK OFF. Right side: gentle rippling patterns — HELLO. It is doing both at once. The rival male watches the aggressive pattern. The female watches the calm display. Neither can see the other side. The cuttlefish is running two completely separate conversations. With its own body."}, {"f": "The bombardier beetle can precisely aim its spray behind it — rotating the tip of its abdomen to target any direction within 270 degrees.", "a": "A bombardier beetle on a range. Targets placed at 0 degrees, 45 degrees, 90 degrees, 180 degrees, 270 degrees. The beetle doesn't move its body. Only its abdomen tip rotates — LOCK — POC. Bullseye. Rotates again — LOCK — POC. Bullseye. Full rotation test: seven targets, seven hits. The range instructor puts down her clipboard. Slow clap."}, {"f": "Some Antarctic fish have antifreeze proteins in their blood — proteins that bind to ice crystals and prevent them from growing.", "a": "An Antarctic fish swimming in water that is -1.9°C — below the freezing point of normal blood. Scientists watch through glass as it moves perfectly normally. They take a blood sample. Hold it up. It should be frozen solid. It is not. They lower the temperature further. Still liquid. They look at each other. The fish swims past the glass again. Looks fine."}, {"f": "The migratory swift spends up to 10 months continuously airborne — eating, drinking, and sleeping on the wing without landing.", "a": "A swift fills out a housing form. Permanent address: the sky. Previous address: the sky. Emergency contact location: the sky. The housing officer looks at the form. Looks at the swift. Looks at the form. The swift has already taken off. The officer writes SKY in the address field. Stamps it. Files it."}, {"f": "The sea cucumber can liquefy parts of its body — changing the density of its tissue — to squeeze through impossibly small gaps.", "a": "A sea cucumber faces a gap the size of a coin. A researcher shakes their head: impossible. The sea cucumber begins. Its left side goes first — liquid. Then the middle — liquid. It pours itself through the gap millimetre by millimetre. Reassembles on the other side. The researcher measures the gap. Measures the sea cucumber. Stares at both measurements. They don't agree."}, {"f": "The mantis shrimp's vision is so powerful that it can detect cancer cells using the same polarisation sensing it uses for navigation.", "a": "A mantis shrimp in a hospital. It is given a tissue sample. Sweeps its eyes over it. Points one claw at a specific cluster. The oncologist checks the sample under a microscope. She checks again. The mantis shrimp is correct. She shows this to a colleague. They both look at the shrimp. The shrimp checks its schedule. Has other appointments."}, {"f": "Tardigrades have been revived after spending 24 years frozen in Antarctic moss — emerging, feeding, and reproducing normally.", "a": "A lab in Japan. A cryogenic container from 1983. A scientist opens it. Finds Antarctic moss. Under a microscope: tardigrades. Frozen solid. She adds water. Waits 24 hours. One moves. Then another. She writes in her notebook: Day 1 — they are alive. Day 14 — they have laid eggs. Day 21 — the eggs have hatched. She stares at the hatched eggs. Then at the 1983 label. Then at the eggs again."}, {"f": "The ocean quahog clam has been documented living for over 500 years — one individual named Ming was 507 years old when found.", "a": "Scientists count growth rings on a clam shell. 100. They keep going. 200. They get coffee. Come back. 300. They call in colleagues. 400. Someone fetches the department head. 500. 507. They look at the clam. The clam is no longer alive — they opened it to count the rings. Someone puts down their counting tool. The room is quiet for a moment."}, {"f": "The wolverine produces a scent so foul it has been called 'skunk bear' — it marks its entire territory and food caches with it.", "a": "A wolverine approaches a cached food pile. Marks it. A wolf approaches. Gets within 5 metres. Stops. Backs up three metres. Tries again. Stops at 5 metres again. Walks away. A bear approaches. Same result. A mountain lion: same. The wolverine sits on the pile. Eats at its leisure. Nobody is coming. The wolverine knows nobody is coming."}, {"f": "The African wild dog has the highest hunt success rate of any large predator in Africa — up to 85%, compared to 30% for lions.", "a": "HUNT STATISTICS on screen. LION: 30%. LEOPARD: 38%. CHEETAH: 58%. AFRICAN WILD DOG: 85%. A lion reads the board. Looks at the wild dog. Looks at its own percentage. Looks back. The wild dog is already running. Doesn't look at the board. Already hunting. Will succeed."}, {"f": "The bald eagle's talons close with a grip force of 400 pounds per square inch — 10 times stronger than a human handshake.", "a": "A scientist with a grip-testing device. Handshake with a human: 60 psi. Handshake with a very strong human: 100 psi. Then: a bald eagle grips the device. The reading: 400 psi. The device cracks slightly. The eagle looks at the device. Releases it. The scientist looks at the device. Then at his own hand. Then at the eagle. Puts his hands in his pockets."}, {"f": "The crow's brain-to-body ratio is equal to that of a chimpanzee — and greater than most great apes.", "a": "A brain-to-body chart on screen. Humans: high. Chimpanzees: high. CROWS: same line as chimpanzees. Great apes below the crow. A crow in the corner of the room is looking at this chart. It looks at the great apes section. Then at itself. Adjusts its posture slightly. Goes back to watching."}, {"f": "The opossum is immune to rattlesnake venom — scientists have extracted a peptide from its blood that could treat snakebite in humans.", "a": "A laboratory. A vial labelled OPOSSUM BLOOD PEPTIDE. A vial of rattlesnake venom. They are mixed. The venom: neutralised. The scientist films it. Shows the opossum. The opossum looks at the video. Looks at its own arm. Looks at the video. Receives a plaque that says SAVED BY AN OPOSSUM. The opossum receives nothing. It is fine with this."}, {"f": "The pelican's throat pouch can hold three times more water than its stomach — it uses it as a net, not a storage vessel.", "a": "A pelican at a fishing competition. A heron fishes with a spear-strike: one fish. A kingfisher dives: one fish. The pelican opens its pouch. Scoops. Closes it. Tilts its head back. Drains the water. Reveals: fifteen fish. The heron and the kingfisher look at each other. The pelican opens its pouch again. For round two."}, {"f": "The vampire bat's heat-sensing pit organs are so precise they can detect a blood vessel 1 millimetre beneath skin.", "a": "A vampire bat approaches a sleeping animal in the dark. Complete darkness. It scans the neck with its heat sensors. The vessel map appears in its mind like a thermal image — 1mm below the surface. It selects the shallowest point. Makes its cut exactly there. The animal sleeps on. The bat begins feeding with total surgical precision. A millimetre is the difference. It always finds the millimetre."}, {"f": "The pistol shrimp colony can cover a single hectare of reef — at densities of up to 600,000 individuals per hectare.", "a": "A marine biologist is given the task of counting pistol shrimp per hectare. She starts: 1, 2, 3... One hour later: 847. She calls her supervisor. He tells her the estimate is 600,000 per hectare. She looks at her count. Looks at the reef. Looks at the count. Puts down her pencil. Looks at the reef one more time. Takes up the pencil. 848."}, {"f": "The deep sea isopod Bathynomus giganteus is a giant woodlouse the size of a rugby ball that scavenges the seafloor.", "a": "A fisherman hauls up his trawl net. It is very heavy. He opens it. Inside: an isopod the size of a rugby ball, antennae slowly waving. He looks at it for a long time. It looks at him. He puts it back in the water. It sinks slowly. He closes the net. Stares at the ocean. Does not mention this to anyone for several years."}, {"f": "The star-nosed mole processes one touch from its nose-star in under 8 milliseconds — faster than the brain can consciously register.", "a": "A mole is given a bowl of food with 200 different items mixed in. It begins eating the edible ones. The speed is so fast a slow-motion camera struggles to track it. At normal speed: the bowl simply empties at an unsettling pace. The scientists watch. One checks the timer. She shows it to another. The mole has eaten 200 items in 11 seconds."}, {"f": "The aye-aye's middle finger is so thin it can detect hollow chambers in wood by tapping — like a built-in sonar system.", "a": "An aye-aye taps a tree branch with one skeletal finger. Tap. Tap. Tap. Hollow sound — detected. It maps the cavity mentally. Inserts the finger into a small hole. Extracts a grub with zero wasted movement. Moves one step forward. Taps. Solid. Taps again. Moves. Taps. Hollow again — another extraction. This entire branch has been inventoried."}, {"f": "The bombardier beetle's explosion is so fast it creates a supersonic shockwave inside its own body — which should destroy it, but doesn't.", "a": "An engineer draws a diagram of what happens inside the bombardier beetle's explosion chamber. The temperature: 100°C. The speed: supersonic. The pressure: extreme. She draws the beetle next to the diagram. Labels it: SHOULD EXPLODE. Then draws an arrow and writes: DOESN'T. She shows it to a colleague. He stares at the diagram. She stares at the diagram. They both look at a beetle on the desk. It walks away."}, {"f": "The electric eel can remotely control the muscles of prey by sending electrical pulses — forcing the prey to twitch and reveal itself.", "a": "An electric eel at a muddy riverbank. Sends a pulse: LOW. A buried fish twitches once — involuntarily — and goes still. The eel sends another: LOW. The fish twitches again. The eel's eye slowly rotates toward the exact spot. The fish freezes. The eel sends one more: LOW. The fish twitches. The eel is already moving toward it. Twitching gave away the location. Every time."}, {"f": "The migratory Arctic tern flies from pole to pole — up to 90,000 kilometres per year — seeing more daylight than any other creature.", "a": "An Arctic tern with a tiny passport. Entry stamp: Arctic. Exit stamp: Antarctic. Entry: Arctic. Exit: Antarctic. The pages fill up. Both poles, twice a year, every year. The tern has seen more sunlight than any other animal alive. It is currently somewhere over the South Atlantic, heading north again. It doesn't consider this unusual. It is just the route."}, {"f": "The bowerbird collects blue objects to decorate its bower — it will steal from other bowerbirds, arrange objects by size, and correct asymmetry.", "a": "A bowerbird places a blue bottlecap. Steps back. Studies the arrangement. Moves it one centimetre left. Studies again. Moves it one centimetre right. Better. Adds a blue feather. Studies. Removes the feather. Studies. Puts the feather back at a different angle. Better. A female approaches. The male watches from a distance. She enters the bower. He is not breathing."}, {"f": "Dolphins have been documented surfing waves — not for food, not for transportation, just for the experience of surfing.", "a": "A pod of dolphins spots a large incoming wave. One dolphin peels off from the group and positions itself precisely at the break point. The wave catches it. It rides, adjusting its position with tiny fin movements. The wave ends. The dolphin circles back. Waits for the next wave. The rest of the pod watches. One joins in. Then another. Nobody is going anywhere. This is just what's happening now."}, {"f": "The komodo dragon's saliva is not venomous bacteria — it has actual venom glands that prevent blood clotting in its prey.", "a": "A whiteboard in a biology department. Written in big letters: BACTERIA. A scientist crosses it out. Writes: VENOM. Below it writes: we were wrong since 1969. Another scientist enters. Reads the board. Sits down. A third enters. Reads. Sits down. The komodo dragon outside the window watches them through the glass. It knew."}, {"f": "The axolotl's regeneration ability has been linked to specific genes that humans also have — but in us, they're switched off.", "a": "An axolotl sits across from a scientist. The scientist puts two gene charts side by side: axolotl, human. Points to a row: SAME GENE. Points to axolotl's column: ON. Points to human's column: OFF. Points to axolotl's arm that regrew last week. Points to a human arm that didn't. The axolotl looks at the chart. Looks at its arm. Looks at the scientist. The scientist looks at the OFF switch."}, {"f": "The humpback whale song evolves over time — males learn new phrases from neighbouring whales, and the song changes year by year.", "a": "A recording of humpback whale song from 1970. Then 1975. Then 1980. Each one sounds related but different — phrases shifting, new motifs appearing, old ones fading. A whale from 1970 would recognise the melody but not the current version. A scientist overlays the recordings. The evolution is clear. The song is alive. It has been changing for as long as anyone has been listening."}, {"f": "The pistol shrimp snap is so brief that it happens in the same duration as a nerve impulse — essentially a single frame of biology.", "a": "A neurologist and a marine biologist compare timings on a chart. NERVE IMPULSE: 1 millisecond. PISTOL SHRIMP SNAP: 1 millisecond. They look at the chart. The neurologist taps the shrimp entry. The marine biologist taps the nerve entry. They are the same line. They stare at the chart. The pistol shrimp in the tank snaps once. Both scientists look at the tank. Back at the chart."}, {"f": "The glass frog male stays on the leaf with his eggs every night — keeping them moist — for the entire 30-day incubation period.", "a": "Night one: a glass frog sits on a leaf of eggs. Attentive. Night ten: same position. Night twenty: same. Thirty nights pass. The eggs begin to hatch. Tiny tadpoles rain down into the stream below the leaf. The glass frog watches each one fall. When the last one drops, he sits on the empty leaf for a moment. Then hops away. Thirty nights. Done."}, {"f": "The elephant shark — a deep sea fish — has the slowest evolving genome of any vertebrate known, barely changing in 450 million years.", "a": "A geneticist compares the elephant shark's genome to its fossil from 450 million years ago. They are essentially identical. She checks her instruments. Rechecks. Identical. She looks at the shark. The shark looks at her. She looks at the fossil. The shark looks at the fossil. It is looking at itself from 450 million years ago. Neither of them say anything."}, {"f": "Some species of ants keep fungus gardens that have been growing continuously for tens of millions of years without interruption.", "a": "A colony opens their fungus garden for inspection. A scientist examines the growth. It is ancient — the exact same strain of fungus, maintained continuously, for 50 million years. He looks at a tiny ant tending it. The ant adjusts a leaf piece. Checks the moisture. Makes a small adjustment. Has no concept that 50 million years of unbroken care have led to this exact moment. Just another day."}, {"f": "The cuttlebone — the white oval found on beaches — is the internal shell of a cuttlefish, filled with gas chambers for buoyancy control.", "a": "A cuttlefish at a buoyancy dial — a tiny gauge on its internal shell. It turns the dial: MORE GAS. It rises gently. Turns it back: LESS GAS. Sinks gently. Hovers. Adjusts by the smallest increment. Perfectly neutral. A diver nearby struggles with a buoyancy compensator. Inflates too much: shoots up. Deflates: drops. The cuttlefish watches. Says nothing."}, {"f": "The wandering albatross locks its wings open using a tendon — allowing it to soar for hours with no muscle effort at all.", "a": "A wing engineer examines the albatross's wing tendon mechanism. He clicks it open: LOCK. The wing stays extended with zero muscle input. He clicks it closed: UNLOCK. The wing folds. He opens it again: LOCK. Leaves the room. Comes back an hour later. Wing still extended. No muscles were used. He sits down and re-examines his entire understanding of wing design."}, {"f": "Dolphins can solve problems by reasoning about what they know — they will signal uncertainty when they are unsure, not just guess.", "a": "A dolphin is given an impossible identification task. It presses a button labelled UNCERTAIN instead of guessing. Trainer: correct, it is uncertain. The dolphin presses UNCERTAIN for two more impossible tasks. Correct both times. Then given an easy task: presses the answer immediately. Trainer makes a note. The dolphin just demonstrated it knows what it doesn't know. The trainer stares at this note for a while."}, {"f": "The coelacanth has barely changed in 65 million years — but it was considered extinct for that entire time, until 1938.", "a": "A coelacanth at a museum exhibit labelled EXTINCT. It stands next to its own fossil. Reads the label. Looks at the fossil. Looks at its fins. Back at the fossil. The fins are the same. It taps the glass of the display case. A security guard approaches. The coelacanth gestures at the EXTINCT label. The security guard reads it. Looks at the fish. Calls his supervisor."}, {"f": "The mimic octopus has been documented imitating a snake by hiding 6 of its arms and waving the other 2 in a serpentine pattern.", "a": "An octopus tucks six arms neatly out of sight. Holds up two. Begins waving them in slow, precise serpentine curves — convincing snake motion. A damselfish predator approaches. Sees two waving snake-shapes. Freezes. Backs away. The octopus holds the position until the damselfish is gone. Then unfolds all eight arms. Stretches. Rolls its eyes. That works every time."}, {"f": "The mantis shrimp has been observed learning the predictable schedule of aquarium staff — hiding during cleaning and emerging when food arrives.", "a": "An aquarium researcher documents the mantis shrimp's behaviour. Monday 9am — cleaning staff arrive. The mantis shrimp retreats to the back of its tank. Monday 10am — feeding time. The shrimp emerges at 9:58, two minutes early. The researcher checks the time. Checks the shrimp. Checks the schedule. The shrimp knows the schedule. It has always known the schedule."}, {"f": "The opossum performs death convincingly enough to fool predators — slowing its heart rate, releasing a smell of decay, and entering catatonia.", "a": "A fox is extremely certain an opossum is dead. Sniffs it. Pokes it. Walks around it. Sniffs again. The opossum does not move. Does not breathe visibly. The fox sits down and stares at it. The opossum continues not moving. The fox leaves. Twenty-three minutes later: the opossum's eyes open. It gets up. Shakes itself off. Leaves in the other direction. Did not choose any of that. Body did it automatically."}, {"f": "The bombardier beetle's explosion mechanism has inspired engineers designing detonation-free spray systems for medical inhalers.", "a": "An engineer holds a tiny inhaler. Points at it. Points at a beetle. Points at it. Points at the beetle. Opens a diagram showing the exact same chamber-mixing mechanism in both. The beetle is not interested. It fires its spray once — the same mechanism — as a demonstration. The engineer writes: NATURE ALREADY SOLVED THIS. IN 1970. WAITING FOR US TO NOTICE. Underlines it twice."}, {"f": "The deep-sea giant squid has eyes the size of a volleyball — the largest eyes of any living animal.", "a": "Submersible descending into total darkness. Lights on. Nothing. Then: a reflection. The submersible inches closer. It is an eye. One eye. The size of a volleyball. The eye blinks — slowly — and rotates to look directly at the camera. For a moment, both sides are looking at each other in the dark. The eye blinks again. Moves away into the black."}, {"f": "The polar bear's fur is not white — each hair is transparent and hollow. The fur looks white because it scatters visible light.", "a": "A scientist holds up a single polar bear hair under a microscope. It is clear. Perfectly transparent. He holds it up to light: still clear. He looks at the polar bear outside the window. It is very white. He holds up the hair again. Clear. Looks at the bear. White. He writes in his notebook: CLEAR. Underlines it. Looks at the bear again. Still white."}, {"f": "The mantis shrimp uses its clubs to settle territorial disputes ritually — each opponent takes turns striking the other's tail, and the one who tolerates more wins.", "a": "Two mantis shrimp face off. They turn around. Ritually, one strikes the other's armoured tail with its club: THWACK. The second shrimp nods slightly. Its turn: THWACK. They alternate. Each blow is measured, formal, almost ceremonial. A crowd of smaller shrimp watch from a distance. After twelve rounds, one shrimp lowers its clubs. Retreats. The other stays. No one was seriously hurt. The ritual worked."}, {"f": "The crows of Japan have developed a precise technique — placing nuts on crosswalks at red lights — independently in multiple cities.", "a": "TOKYO: a crow places a nut. Waits. Car. Cracked. Retrieved. OSAKA: a different crow. Same technique. Same timing. FUKUOKA: another crow. Same. A researcher in Tokyo looking at a map puts pins in each city. Draws lines between them. Did they teach each other? Or did they each figure it out separately? He stares at the map. The crows are not sharing information. They all just had the same idea."}, {"f": "The deep sea dragonfish has a hinged skull — it can open its mouth wide enough to swallow prey larger than its own head.", "a": "A deep sea dragonfish faces a fish considerably larger than its own head. The surrounding fish watch with polite scepticism. The dragonfish opens its mouth. The jaw unhinges downward. The skull separates upward. The head effectively ceases to be a closed structure and becomes a frame around an open space. The large fish disappears into it. The head closes. The dragonfish is the same size. The fish is not elsewhere."}, {"f": "The immortal jellyfish doesn't age — it simply reaches adulthood, then reverts to a juvenile polyp when stressed, repeating indefinitely.", "a": "A chart labelled THE LIFE CYCLE OF TURRITOPSIS DOHRNII. It is a circle. An arrow goes from POLYP to ADULT. Then another arrow goes from ADULT back to POLYP. There is no arrow going anywhere else. A death symbol has been drawn in pencil and crossed out. The word INDEFINITELY is written next to the cycle with a question mark. The question mark has also been crossed out. The word INDEFINITELY stands alone."}, {"f": "The velvet worm shoots sticky slime from its head to immobilise prey — and it can aim two jets simultaneously at different targets.", "a": "A velvet worm approaches two insects simultaneously. It fires two slime jets — one from each nozzle — hitting both insects at once. Both are immobilised. The velvet worm looks left. Looks right. Both secured. It walks slowly toward one, then the other. The insects are not going anywhere. The velvet worm has all the time it needs."}, {"f": "Some sharks can enter a trance-like state called 'tonic immobility' when turned upside down — becoming completely still and unresponsive.", "a": "A shark is gently flipped upside down by a researcher. It immediately goes completely still — fins stop, jaw relaxes, eyes glaze. The researcher holds it upside down for 15 minutes. The shark is fully present but entirely unresponsive. The researcher slowly turns it right-side up. The shark blinks. Swims away. Has no memory of the last 15 minutes. Happens every time."}, {"f": "The secretary bird stamps on snakes with 5 times its body weight in force — and it does this even with non-venomous snakes, just in case.", "a": "A secretary bird in the grass. Spots a small harmless snake. Stares at it for a moment. Stamps on it anyway. Picks it up. It is fine — it was a stick. The secretary bird drops it. Walks on. Spots another thing on the ground. STAMP. Also a stick. STAMP. Leaf. The secretary bird has a policy. The policy is: stamp first. It has served well."}, {"f": "The pistol shrimp pair with a nearly-blind goby fish — the shrimp builds the burrow, the goby keeps watch, and the shrimp maintains antenna contact at all times.", "a": "A pistol shrimp and a goby fish approach their shared burrow. The shrimp begins digging. The goby stands at the entrance scanning for threats. The shrimp's antenna rests on the goby's tail. The goby sees a predator. Twitches its tail. The shrimp feels the vibration: DANGER. Both disappear underground in the same instant. The predator finds an empty burrow. They are already safe."}, {"f": "The Antarctic notothenioid fish survives in water below the normal freezing point of blood — because it makes its own antifreeze.", "a": "A fish swimming in water at -1.9°C. Its blood should be frozen solid. A scientist watches it through glass, takes a blood sample, and holds the vial over the aquarium water: water freezes. Vial: stays liquid. He warms the vial: stays liquid. He cools it further: still liquid. He looks at the fish. The fish swims a circle. It has been doing this for millions of years. It is not impressed by the experiment."}, {"f": "The frigate bird cannot land on water — its feathers aren't waterproof — so it steals food in mid-air from other birds.", "a": "A frigate bird spots a booby returning from fishing. The booby has a fish. The frigatebird begins the chase. The booby zigzags. The frigatebird matches every move. They spiral upward. The booby drops the fish. The frigatebird catches it before it hits the water. The booby watches it go. The frigatebird cannot land on the water below. It never had the option of eating wet food anyway."}, {"f": "The bombardier beetle has two storage chambers — mixing the chemicals only at the moment of firing to prevent exploding itself.", "a": "Two tiny storage tanks inside a beetle, separated by a valve. CHAMBER A: calm. CHAMBER B: calm. SEPARATE: safe. The valve opens: A meets B. INSTANT REACTION — boiling explosion — channelled OUT and AWAY. The valve closes. Chambers refill. The beetle checks itself: intact. Checks target: gone. The valve is the entire reason the beetle is still alive. The valve is extremely important."}, {"f": "The elephant's trunk has more muscles than the entire human body — over 40,000 individual muscle fascicles.", "a": "A human bodybuilder and an elephant stand side by side. The bodybuilder flexes: impressive. The elephant raises its trunk: 40,000 muscles move in coordinated waves. The trunk lifts a log. Sets it down. Picks up a single pea. Sets it down. Sprays water. Uses it as a snorkel. The bodybuilder watches all of this. Slowly puts his arms down."}, {"f": "The coelacanth swims using a lobe-fin movement identical to the walking gait of four-legged land animals — front left, back right, front right, back left.", "a": "A coelacanth swims in slow motion. The fins move: FRONT LEFT. BACK RIGHT. FRONT RIGHT. BACK LEFT. A land animal walks: FRONT LEFT. BACK RIGHT. FRONT RIGHT. BACK LEFT. A researcher plays both videos side by side. The timing is identical. He looks at the coelacanth. Looks at the dog walking past outside. Looks at the split screen. Back at the dog. Back at the screen. He reaches for the phone."}, {"f": "The mimic octopus has never been seen making the same impersonation twice in a row during a single encounter.", "a": "A predator approaches an octopus. The octopus: flatfish. Predator pauses. Tries again. The octopus: sea snake. Predator retreats, circles, approaches from the other side. The octopus: lionfish. Predator confused. Tries a fourth angle. The octopus: something the predator has never seen before. The predator sits in the water for a moment. Leaves. The octopus returns to normal. Still has fourteen more."}, {"f": "The sperm whale dives to 3 km depth — collapsing its lungs completely to avoid the bends, then reinflates them when it surfaces.", "a": "A sperm whale begins its dive. 200 metres: lung compression begins. 500 metres: noticeably smaller. 1000 metres: significantly compressed. 2000 metres: the lung capacity appears to be almost nothing. 3000 metres: functioning whale with compressed lungs, hunting normally. Then it rises. 500 metres: reinflation begins. Surface: full lungs, exhale, SPOUT. Routine. Happens 100 times per day."}, {"f": "The pistol shrimp burrow can have multiple chambers — a food storage room, an egg chamber, and a main living area.", "a": "A tour of a pistol shrimp burrow. The shrimp gestures: ENTRANCE CORRIDOR. FOOD STORAGE — points to stacked items. EGG CHAMBER — shows the eggs. MAIN LIVING AREA — sits down in it briefly. Indicates the structural quality of the walls. Points to the drainage. Taps the ceiling: solid. The burrow is better engineered than several human buildings. The goby is waiting outside. Still on watch."}, {"f": "The lyrebird has a vocal range that covers almost all known bird calls — it can produce sounds from below 100Hz to above 12kHz.", "a": "A lyrebird on a branch. A sound engineer places a frequency analyser in front of it. The lyrebird opens its beak. The analyser's display covers every frequency from deep bass to high treble simultaneously. The engineer stares at the display. Nothing should be able to do this. He checks his equipment. The lyrebird closes its beak. Frequency: normal. Opens it again. Full spectrum. He puts down his clipboard."}, {"f": "The axolotl is native to a single lake near Mexico City — a lake that is now almost completely gone.", "a": "A map of Mexico City's Lake Xochimilco — 1950: large and blue. 1970: smaller. 1990: smaller. 2010: mostly drained. An axolotl sits in what remains — a network of canals. It looks at the map. Looks at the canals. Looks at the map. It was here before the city. The city was built around it. The city then forgot it was here. The axolotl is still here."}, {"f": "The mantis shrimp's dactyl club has been studied by aerospace engineers — its layered structure absorbs more energy per gram than any human-made material.", "a": "An aerospace engineer in a lab puts a mantis shrimp club sample in a materials testing machine. Maximum force: the machine breaks. She orders a stronger machine. Maximum force on the new machine: the machine breaks. She writes a paper. The title is: THE MANTIS SHRIMP ALREADY SOLVED THIS IN THE CRETACEOUS. The paper is published. The mantis shrimp does not receive any royalties."}, {"f": "The narwhal's tusk has been found to flex 30 cm in any direction — the tooth is not rigid at all, but flexible like a coil spring.", "a": "A scientist holds a narwhal tusk. Tries to bend it. It bends. He bends it further. It bends further. He bends it all the way to 30cm deflection. It springs back perfectly. He looks at his textbook entry: RIGID TUSK. Crosses it out. Writes: FLEXIBLE SPRING. The narwhal looks through the glass at him. Still has the tusk. Still feels 10 million nerve signals through it every minute."}];

var VOICEOVER = [
  function(f) { return 'a deadpan narrator states the fact with zero emotion, like reading a news headline: "' + f + '."'; },
  function(f) { return 'a warm, genuinely astonished narrator: "' + f + '."'; },
  function(f) { return 'a hushed, urgent narrator who delivers this like a classified secret: "' + f + '."'; },
  function(f) { return 'a slow, deep nature documentary narrator with absolute authority: "' + f + '."'; },
  function(f) { return 'a fast, punchy narrator who drops this like a punchline: "' + f + '!"'; },
  function(f) { return 'a breathless narrator in genuine disbelief: "' + f + '?!"'; },
  function(f) { return 'a calm BBC narrator, quiet and precise: "' + f + '."'; },
  function(f) { return 'a high-energy sports commentator at peak intensity: "' + f + '!!"'; }
];

var CAMERAS = [
  'OPENING SHOT: Extreme macro close-up — so close the subject is unrecognisable — then a sudden pull-back reveals it fully mid-action.',
  'OPENING SHOT: The scene is already happening at full intensity — cut straight into the peak moment.',
  'OPENING SHOT: Ultra-low angle looking up at the subject, making it fill the entire frame.',
  'OPENING SHOT: A violent whip-pan swings into the subject from the side at full speed.',
  'OPENING SHOT: Crash-zoom punch directly into the animal face or key detail.',
  'OPENING SHOT: The animal POV — we see what it sees — then instant cut to reveal the animal itself.',
  'OPENING SHOT: Extreme slow-motion close-up, then a snap to full normal speed.',
  "OPENING SHOT: Bird's-eye directly overhead, then a dramatic tilt down to face-level."
];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

var used = [];
try { used = JSON.parse(sessionStorage.getItem('fg_used') || '[]'); } catch(e) {}
var history = [];

function updateCounter() {
  document.getElementById('usedCount').textContent = used.length;
  document.getElementById('totalCount').textContent = FACTS.length;
}

function getRandomFact() {
  var available = [];
  for (var i = 0; i < FACTS.length; i++) {
    if (used.indexOf(i) === -1) available.push(i);
  }
  if (available.length === 0) {
    used = [];
    try { sessionStorage.setItem('fg_used', '[]'); } catch(e) {}
    for (var i = 0; i < FACTS.length; i++) available.push(i);
  }
  var idx = available[Math.floor(Math.random() * available.length)];
  used.push(idx);
  try { sessionStorage.setItem('fg_used', JSON.stringify(used)); } catch(e) {}
  updateCounter();
  return FACTS[idx];
}

function buildPrompt(f, a) {
  return 'An 8-second Pixar-style 3D animated YouTube Short. 9:16 vertical format. Hyper-detailed, vibrant colours, expressive rubbery character animation, cinematic lighting. Comedy short.\n\nVOICE: Alnilam only. No other voice.\n\nAUDIO: Upbeat energetic background music from frame 1. Over this: ' + pick(VOICEOVER)(f) + '\nThe voiceover speaks the fact ONCE then goes completely silent.\n\nOUTRO PAD: After the last word, animation continues 1.5-2 seconds with music fading smoothly to silence.\n\nVISUAL PACING: Every new scene starts 0.1-0.2 seconds BEFORE the matching word in the voiceover.\n\n' + pick(CAMERAS) + '\n\nANIMATION (0-8 seconds):\n' + a + '\n\nANIMATION RULES:\n- Habitat must match the animal exactly\n- Animal NEVER speaks or mouths words\n- Every second must have visible movement\n- Opening half-second must grab attention immediately\n\nPixar animation quality. No real-world footage. No presenter.';
}

function renderCard(item, n) {
  var prompt = buildPrompt(item.f, item.a);
  var label = n > 1 ? ' ' + n : '';
  return '<div class="card"><div class="card-label">📌 Feitje' + label + '</div><div class="fact-text">' + item.f + '</div></div>' +
    '<div class="card"><div class="card-label">🎨 Animatie' + label + '</div><div class="anim-text">' + item.a + '</div></div>' +
    '<div class="card"><div class="card-label">📋 Google Flow Prompt' + label + '</div><div class="prompt-box" id="pb' + n + '">' + prompt + '</div><button class="copy-btn" data-copy="' + n + '">Kopieer prompt' + label + '</button></div>';
}

function generate(count) {
  if (FACTS.length === 0) {
    document.getElementById('results').innerHTML = '<div class="empty">Geen feitjes beschikbaar</div>';
    return;
  }
  var html = '';
  for (var i = 1; i <= count; i++) {
    var item = getRandomFact();
    history.unshift({ f: item.f, a: item.a, t: new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) });
    if (history.length > 12) history.pop();
    html += renderCard(item, i);
  }
  document.getElementById('results').innerHTML = html;
  renderHistory();
}

function renderHistory() {
  if (!history.length) return;
  document.getElementById('historySection').style.display = 'block';
  var html = '';
  for (var i = 0; i < history.length; i++) {
    html += '<div class="history-item" data-history="' + i + '"><div class="history-fact">' + history[i].f + '</div><div class="history-meta">' + history[i].t + ' · klik om te laden</div></div>';
  }
  document.getElementById('historyList').innerHTML = html;
}

function switchTab(tab) {
  document.getElementById('panel-auto').className = 'panel' + (tab === 'auto' ? ' active' : '');
  document.getElementById('panel-custom').className = 'panel' + (tab === 'custom' ? ' active' : '');
  document.getElementById('tab-auto').className = 'tab' + (tab === 'auto' ? ' active' : '');
  document.getElementById('tab-custom').className = 'tab' + (tab === 'custom' ? ' active' : '');
  if (tab === 'custom' && document.getElementById('customFact').textContent.indexOf('Klik') !== -1) {
    shuffleCustomFact();
  }
}

var customFactIndex = -1;
function shuffleCustomFact() {
  var idx;
  do { idx = Math.floor(Math.random() * FACTS.length); } while (idx === customFactIndex && FACTS.length > 1);
  customFactIndex = idx;
  document.getElementById('customFact').textContent = FACTS[idx].f;
  document.getElementById('customAnim').value = '';
  document.getElementById('customResult').innerHTML = '';
}

async function buildCustomPrompt() {
  var fact = document.getElementById('customFact').textContent.trim();
  var anim = document.getElementById('customAnim').value.trim();
  if (!anim || fact.indexOf('Klik') !== -1) {
    document.getElementById('customResult').innerHTML = '<div style="color:#ff4444;font-size:0.85rem;padding:10px">Vul eerst een animatie in.</div>';
    return;
  }
  var btn = document.getElementById('btn-build');
  btn.textContent = '⏳ Vertalen...';
  btn.disabled = true;
  document.getElementById('customResult').innerHTML = '<div style="color:#555;font-size:0.85rem;padding:10px;text-align:center">Animatie wordt vertaald...</div>';
  try {
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: 'Translate this Dutch animation description to English. Keep the tone, humor, timing, capitalized sound effects (POC, SNAP, BOOM) and slapstick. Return only the translation.\n\n' + anim }]
      })
    });
    var data = await res.json();
    var translated = data.content[0].text.trim();
    var prompt = buildPrompt(fact, translated);
    document.getElementById('customResult').innerHTML =
      '<div class="card"><div class="card-label">🌐 Vertaalde animatie</div><div class="anim-text">' + translated + '</div></div>' +
      '<div class="card"><div class="card-label">📋 Google Flow Prompt</div><div class="prompt-box" id="pb-custom">' + prompt + '</div><button class="copy-btn" data-copy="custom">Kopieer prompt</button></div>';
  } catch(e) {
    var prompt = buildPrompt(fact, anim);
    document.getElementById('customResult').innerHTML =
      '<div style="color:#888;font-size:0.8rem;padding:8px 0 12px">⚠️ Vertaling niet beschikbaar — animatie in het Nederlands gebruikt.</div>' +
      '<div class="card"><div class="card-label">📋 Google Flow Prompt</div><div class="prompt-box" id="pb-custom">' + prompt + '</div><button class="copy-btn" data-copy="custom">Kopieer prompt</button></div>';
  } finally {
    btn.textContent = '🎬 Genereer Flow-prompt';
    btn.disabled = false;
  }
}

function copyText(id, btn) {
  var pb = document.getElementById(id);
  if (!pb) return;
  try {
    navigator.clipboard.writeText(pb.textContent).then(function() {
      btn.textContent = 'Gekopieerd! ✓';
      btn.classList.add('copied');
      setTimeout(function() { btn.textContent = 'Kopieer prompt'; btn.classList.remove('copied'); }, 2500);
    });
  } catch(e) {
    var range = document.createRange();
    range.selectNodeContents(pb);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand('copy');
    btn.textContent = 'Gekopieerd! ✓';
    setTimeout(function() { btn.textContent = 'Kopieer prompt'; }, 2500);
  }
}

// Event listeners
document.getElementById('btn-gen1').addEventListener('click', function() { generate(1); });
document.getElementById('btn-gen2').addEventListener('click', function() { generate(2); });
document.getElementById('tab-auto').addEventListener('click', function() { switchTab('auto'); });
document.getElementById('tab-custom').addEventListener('click', function() { switchTab('custom'); });
document.getElementById('btn-shuffle').addEventListener('click', function() { shuffleCustomFact(); });
document.getElementById('btn-build').addEventListener('click', function() { buildCustomPrompt(); });

document.body.addEventListener('click', function(e) {
  var copyBtn = e.target;
  if (copyBtn.tagName !== 'BUTTON' || !copyBtn.dataset.copy) {
    copyBtn = e.target.closest ? e.target.closest('[data-copy]') : null;
  }
  if (copyBtn && copyBtn.dataset.copy) {
    var n = copyBtn.dataset.copy;
    var pbId = n === 'custom' ? 'pb-custom' : 'pb' + n;
    copyText(pbId, copyBtn);
  }
  var histItem = e.target.closest ? e.target.closest('[data-history]') : null;
  if (histItem && histItem.dataset.history !== undefined) {
    var i = parseInt(histItem.dataset.history);
    document.getElementById('results').innerHTML = renderCard({ f: history[i].f, a: history[i].a }, 1);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

updateCounter();
</script>
</body>
</html>
