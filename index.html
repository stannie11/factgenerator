petition, other contestants look confident, alpaca's results come back, everyone else packs up."}, {"f": "Guanacos are the wild ancestors of the domestic llama.", "a": "Guanaco and llama at family reunion, llama looks very domesticated, guanaco looks at llama's lead, raises an eyebrow."}, {"f": "Vicuña wool is the finest and most expensive natural fibre in the world.", "a": "Vicuña at weaving competition, produces single strand, judge weighs it, values it, other competitors go home."}, {"f": "Red deer shed their antlers every winter and immediately begin growing new ones.", "a": "Red deer sheds antlers in December, looks at them on ground, shrugs, new ones already growing by January."}, {"f": "Roe deer can pause embryo development for months after mating before pregnancy resumes.", "a": "Roe deer embryo receives notification: growth paused, settings being optimised, please wait, continues in spring."}, {"f": "Moose have a large dewlap of hanging skin under their throat called a bell.", "a": "Moose at formal dinner, flap swings rhythmically with each step, other guests cannot stop watching, moose oblivious."}, {"f": "Reindeer are the only mammals that can see ultraviolet light to find food hidden beneath snow.", "a": "Reindeer scans snowfield, lichen appears highlighted below like a UV menu, selects dinner, other animals confused."}, {"f": "Fallow deer perform a stotting display called pronking, leaping into the air on all four legs at once.", "a": "Fallow deer spots predator, activates pronk mode, bounces away on all fours simultaneously, predator baffled."}, {"f": "Giraffes sleep as little as twenty minutes to two hours per day broken into very brief naps.", "a": "Giraffe sets twenty-minute alarm, sleeps deeply, wakes immediately alert, fully rested, other animals jealous."}, {"f": "Okapis can clean their own eyes and ears with their extremely long prehensile tongue.", "a": "Okapi gets dust in eye, extends tongue upward, wipes it clean, closes mouth, other animals speechless."}, {"f": "A cow's stomach has four chambers for progressively breaking down the tough grass it eats.", "a": "Cow finishes dinner, contents take the four-chamber tour, come back up for review, cow chews thoughtfully."}, {"f": "African buffalo have a fused horn boss on their forehead that forms an impenetrable bony shield.", "a": "Lion aims for buffalo's head, bounces off the boss, inspects paw, inspects buffalo, reassesses entire strategy."}, {"f": "Yak milk is extremely high in fat to protect calves from the intense cold of high-altitude living.", "a": "Yak calf takes first sip of milk, thermometer rises visibly, calf immediately looks warmer, gives satisfied nod."}, {"f": "Bison have a large muscle-packed hump that powers their head through deep snow when grazing in winter.", "a": "Bison approaches snowdrift, engages hump, lowers head, snowdrift parts, bison walks through like a snowplough."}, {"f": "Chamois have hooves with a hard outer rim and a soft rubbery inner pad for gripping steep mountain rock.", "a": "Chamois at climbing wall, examines holds, hooves grip perfectly, reaches top, leaves other climbers far below."}, {"f": "Alpine ibex climb almost vertical dam walls to lick minerals and salts from the stone surface.", "a": "Ibex at base of dam, looks up, shrugs, starts climbing vertically, other animals watching from the ground."}, {"f": "Musk oxen form a defensive circle with horns pointing outward when threatened, protecting calves inside.", "a": "Wolves approach musk ox herd, herd locks into perfect circle formation instantly, calves inside, wolves recalculate."}, {"f": "Goats can stand on incredibly thin branches or rock ledges due to their extraordinary sense of balance.", "a": "Goat on branch the width of a pencil in high wind, eating calmly, other animals watching through fingers."}, {"f": "Mouflon are the wild ancestors of all modern domestic sheep breeds.", "a": "Mouflon at sheep heritage exhibition, points to every breed and says that is one of mine, guide very impressed."}, {"f": "Kangaroos cannot jump without their tail touching the ground as it acts as a powerful third leg.", "a": "Kangaroo tries to jump with tail raised, goes nowhere, lowers tail, immediate enormous bounce, much better."}, {"f": "Red kangaroos can cover up to nine metres in a single jump at full speed.", "a": "Red kangaroo measured at standing jump competition, tape runs out at nine metres, officials need another tape."}, {"f": "Wallabies have shorter hind legs that make them more agile in dense scrubby bush habitat.", "a": "Kangaroo and wallaby enter thick scrub, kangaroo stuck at entrance, wallaby already on the other side waving."}, {"f": "Tree kangaroos can leap nine metres straight down from a tree without sustaining any injury.", "a": "Tree kangaroo at top of very tall tree, counts to three, leaps, lands perfectly, bounces once, carries on."}, {"f": "Koalas have two thumbs on each front paw giving them an exceptionally powerful grip on branches.", "a": "Koala grips branch with four thumbs in total, hurricane-force winds, koala completely unmoved, very secure."}, {"f": "Wombat droppings are so dry and compact that the cube-shaped pellets can be stacked on top of each other.", "a": "Wombat produces cube, second cube lands on first, third on second, wombat inspects small tower, satisfied."}, {"f": "Sugar gliders get their name from their preference for sweet foods like nectar and eucalyptus sap.", "a": "Sugar glider at dessert table, ignores everything savoury, finds the honey section, sits down, very happy."}, {"f": "Tasmanian devils open their jaws terrifyingly wide when stressed, not when tired or sleepy.", "a": "Tasmanian devil yawns in waiting room, entire waiting room shuffles chairs backward, devil looks apologetic."}, {"f": "Platypuses hunt with eyes, ears, and nostrils closed detecting prey purely through electrical signals in their bill.", "a": "Platypus blindfolds itself, earplugs in, nostrils closed, dives, finds every single shrimp, surfaces and shrugs."}, {"f": "Echidnas have a single body opening called a cloaca shared for reproduction and waste, like birds and reptiles.", "a": "Echidna at mammal biology class, teacher asks what makes a mammal, echidna raises hand, class takes longer."}, {"f": "Giant anteaters have claws sharp enough to defend themselves against a jaguar attack.", "a": "Jaguar approaches giant anteater looking confident, anteater raises one claw slowly, jaguar stops, reroutes."}, {"f": "Two-toed sloths have more neck vertebrae than most mammals, allowing them to rotate their head unusually far.", "a": "Two-toed sloth spots a fly, slowly rotates head 270 degrees to track it, fly long gone, sloth still rotating."}, {"f": "Armadillos almost always give birth to genetically identical quadruplets from a single fertilised egg.", "a": "Armadillo at baby shower, four identical invitations made in advance, host very organised, already knew."}, {"f": "Pangolins curl into a ball when threatened and the edges of their scales are razor sharp.", "a": "Predator tries to uncurl pangolin, immediately cuts paw, bandages it, tries other side, same result, gives up."}, {"f": "African elephants fan their large ears to cool blood flowing through them before it circulates back.", "a": "Elephant on scorching day, fans ears rapidly, blood cools, temperature drops, nearby animals crowd around gratefully."}, {"f": "An elephant's trunk contains over one hundred thousand individual muscles and not a single bone.", "a": "Anatomy teacher presents elephant trunk cross section, starts counting muscles, class ends before getting to half."}, {"f": "Asian elephants often only have tusks in the males while African elephants of both sexes grow them.", "a": "Asian female elephant and African female elephant meet, one has tusks, one doesn't, both shrug, different families."}, {"f": "Manatees must surface every few minutes to breathe through their nostrils despite living entirely in water.", "a": "Manatee in deep meeting, surfaces every four minutes for air, everyone else adjusts agenda around this."}, {"f": "Dugongs have a forked tail like a dolphin while manatees have a rounded paddle-shaped tail.", "a": "Dugong and manatee at tail identification booth, officer compares forks vs paddles, stamps passports differently."}, {"f": "Hyraxes have a special eye lens that lets them look directly at the sun to watch for eagles above.", "a": "Hyrax stares straight into midday sun monitoring eagle, eagle cannot approach unnoticed, gives up."}, {"f": "Aardvarks have spade-shaped claws that let them dig through termite mound walls faster than workers with shovels.", "a": "Aardvark and digging crew at starting line, whistle blows, aardvark done before crew gets shovels out."}, {"f": "Elephant shrews maintain clear pathways through leaf litter and keep them meticulously free of obstacles.", "a": "Elephant shrew patrols path with tiny broom, flicks away every leaf, inspects work, nods, continues."}, {"f": "Ring-tailed lemurs hold stink fights by rubbing wrist gland scent onto their tails and waving them at rivals.", "a": "Two lemurs prepare wrist scent, apply to tails, wave dramatically at each other, third lemur passes out nearby."}, {"f": "Sifakas move on the ground by hopping sideways with arms raised because their legs are built for leaping.", "a": "Sifaka crosses open ground with sideways bouncing hops, arms raised, looks ridiculous, arrives quickly."}, {"f": "Aye-ayes tap their long middle finger on bark to detect hollow chambers where grubs are hiding.", "a": "Aye-aye taps tree like sonar, detects hollow space, marks X on trunk, extracts grub precisely, very satisfied."}, {"f": "Slow lorises are the only venomous primate, licking a gland under their arm to make their bite toxic.", "a": "Slow loris casually licks armpit before a bite, other animals give it significant personal space."}, {"f": "Galagos can jump five metres from a standing start to catch insects directly from the air.", "a": "Galago crouches, insect buzzes overhead, galago launches upward five metres, catches it, lands, carries on."}, {"f": "Tarsiers can rotate their head almost 180 degrees like an owl because their eyeballs cannot move.", "a": "Tarsier tries to look sideways, head rotates nearly all the way around, other tarsiers take a cautious step back."}, {"f": "Howler monkeys have an enlarged throat structure that acts as a natural amplifier for their calls.", "a": "Howler monkey opens mouth, call echoes across three mountain ranges, neighbouring birds immediately relocate."}, {"f": "Spider monkeys have no thumbs on their hands and use them purely as hooks for swinging through trees.", "a": "Spider monkey arrives at door, tries handle, looks at hands, no thumbs, swings away to find another entry point."}, {"f": "Squirrel monkeys rub their own urine on their hands and tail to improve grip and mark territory.", "a": "Squirrel monkey at grip training, applies urine, grabs branch, holds perfectly, trainer makes note, it works."}, {"f": "Capuchin monkeys crush insects and rub them into their fur as a natural insect repellent.", "a": "Capuchin catches beetle, grinds it methodically, rubs into fur, mosquitoes approach and immediately retreat."}, {"f": "Uakari monkeys have a distinctively bright red bald face that signals good health to potential mates.", "a": "Uakari at health check, doctor looks at face colour, says you are clearly in excellent shape, uakari nods."}, {"f": "Baboons live in complex hierarchical groups that are constantly challenged through dominance displays.", "a": "Baboon group at team meeting, dominance display breaks out within minutes, hierarchy reconfirmed, meeting resumes."}, {"f": "Male mandrills develop more intense red and blue facial colours as their testosterone and dominance increase.", "a": "Mandrill checks ranking board, face brightens slightly in response, rival checks theirs, same thing happens."}, {"f": "Rhesus macaques can survive in environments ranging from hot desert to snow-covered mountain range.", "a": "Rhesus macaque packs single bag for both desert and mountain trip, arrives at both extremes perfectly prepared."}, {"f": "Barbary macaque males are highly involved fathers and carry infants to bond with other males socially.", "a": "Barbary macaque dad carries baby through crowd, instant conversation starter with every other male, very effective."}, {"f": "Japanese macaques soak in natural hot springs during winter purely for warmth and enjoyment.", "a": "Japanese macaque eases into hot spring, sighs contentedly, other macaques queue politely, steam rising."}, {"f": "Male proboscis monkeys may use their enormous drooping nose to amplify their calls through the forest.", "a": "Proboscis monkey calls across swamp, nose acting as megaphone, sound volume doubles, other side answers."}, {"f": "Langur monkeys have specialised stomach bacteria that neutralise the toxins found in the leaves they eat.", "a": "Langur eats toxic leaf, stomach bacteria immediately get to work, leaf neutralised, langur eats another."}, {"f": "Gibbons form lifelong monogamous pairs and sing loud duets every morning to reinforce their territory.", "a": "Gibbons set 5am territory duet alarm, sing full morning performance, neighbouring gibbons hear message clearly."}, {"f": "Orang-utans build a brand new sleeping nest from branches and leaves high in the trees every single evening.", "a": "Orang-utan surveys tree at dusk, selects branches, assembles nest with great care, sleeps, abandons it at dawn."}, {"f": "Chimpanzees make and use simple tools like twig probes to fish termites from mounds.", "a": "Chimpanzee selects twig carefully, strips it to size, inserts into mound, extracts covered in termites, licks."}, {"f": "Bonobos resolve almost all group conflicts through social and affectionate behaviour rather than aggression.", "a": "Bonobo group argument breaks out, resolution meeting called, everyone emerges calm and friendly, very efficient."}, {"f": "Western lowland gorillas live in harems led by a dominant silverback male.", "a": "Silverback at morning briefing, chest beat confirms authority, group nods, day begins, silverback approves agenda."}, {"f": "Flying foxes locate ripe fruit using large eyes and a keen sense of smell rather than echolocation.", "a": "Flying fox at fruit market, sniffs methodically, selects ripest item, pays with no echolocation required."}, {"f": "The pygmy bat can catch hundreds of mosquitoes and small insects in the air in just one hour.", "a": "Pygmy bat sets one-hour timer, starts hunting, timer goes off, count of two hundred and forty, very efficient."}, {"f": "Vampire bats make a tiny cut in sleeping prey's skin and lap the blood without waking the animal.", "a": "Vampire bat approaches sleeping cow, makes micro-incision, laps carefully, cow dreams pleasantly throughout."}, {"f": "Long-eared bats fold their enormous ears backwards under their wings to protect them during hibernation.", "a": "Long-eared bat prepares for hibernation, folds ears carefully under wings, pats them flat, settles in for winter."}, {"f": "Daubenton's bats hunt insects skimming just above the water surface using their tail membrane as a net.", "a": "Daubenton's bat skims surface, tail deploys as scoop, insect collected cleanly, bat pulls up, mission done."}, {"f": "The porcupine fish inflates itself with water or air when threatened making itself impossible to swallow.", "a": "Predator approaches porcupine fish confidently, fish inflates to three times its size, predator recalculates."}, {"f": "Coffin fish have a hard box-like shell of fused bone plates protecting their entire body.", "a": "Coffin fish at boxing match, opponent's punch bounces off bone plates, coffin fish shrugs, opponent retires."}, {"f": "A trumpetfish camouflages itself by hanging vertically among seagrass or coral to ambush passing prey.", "a": "Trumpetfish hangs perfectly vertically among coral, fish swim past, one bumps into trumpetfish, both surprised."}, {"f": "Stonefish are the most venomous fish in the world and disguise themselves as rocks on the seafloor.", "a": "Swimmer sees rock, moves rock with foot, stonefish appears, swimmer exits water immediately."}, {"f": "Scorpionfish have venomous spines on their dorsal fin that can cause serious pain if touched.", "a": "Curious diver reaches for colourful scorpionfish, other diver waves arms frantically, first diver reconsiders."}, {"f": "Mudskippers leave the water at low tide and breathe through their skin and cheeks on land.", "a": "Mudskipper steps onto beach at low tide, has a look around, has lunch on rocks, returns at exactly high tide."}, {"f": "Blennies have no scales but are protected by a thick mucus layer that prevents drying out on wet rocks.", "a": "Blennie on exposed rock at low tide, other fish worried, blennie's mucus working perfectly, completely relaxed."}, {"f": "Gobies often share a burrow with an almost blind shrimp that excavates and maintains the home for both.", "a": "Goby and shrimp sign tiny lease agreement, shrimp digs, goby keeps watch, very satisfying partnership."}, {"f": "Cleaner wrasse run cleaning stations on the reef where larger fish queue to have parasites removed.", "a": "Enormous grouper takes ticket and waits in queue at cleaner wrasse station, reads magazine, wait time ten minutes."}, {"f": "A trigger fish can lock its dorsal spine into a crack in rock so tightly that predators cannot pull it out.", "a": "Trigger fish spotted by predator, dives into rock crack, locks spine, predator pulls, pulls harder, gives up."}, {"f": "Surgeonfish have blade-sharp spines at the base of their tail that can slash attackers like a scalpel.", "a": "Surgeon fish at hospital, other fish ask why it's called that, it raises its tail slowly, everyone backs up."}, {"f": "Squirrelfish have enormous eyes for nocturnal hunting on the reef after dark.", "a": "Squirrelfish at nighttime reef shift, giant eyes scanning everything, other fish cannot see at all, squirrelfish fine."}, {"f": "Cardinal fish are mouthbrooders, with the male holding the fertilised eggs in his mouth until they hatch.", "a": "Cardinal fish dad at dinner table, cannot eat, mouth completely full of eggs, partner serves food, he sighs."}, {"f": "Giant manta rays have fins shaped like wings and can leap impressive distances clear of the water.", "a": "Manta ray at flight demonstration, unfolds fin-wings, launches from water, crowd of fish below gasps."}, {"f": "Stingrays have a venomous barb on their tail used purely for defence and not for hunting.", "a": "Stingray at self-defence class, instructor asks about weapons, stingray slowly raises tail, class pays attention."}, {"f": "Guitar sharks have a body that is intermediate between a shark and a ray.", "a": "Guitar shark at species identification, officer flips through handbook, finds no exact match, writes other."}, {"f": "Sawfish have a long flat rostrum lined with sharp teeth on both sides used to stun schooling fish.", "a": "Sawfish enters school of fish, swings rostrum, fish scattered and stunned, sawfish collects them calmly."}, {"f": "The whale shark is the largest fish in the world and can reach over twelve metres in length.", "a": "Whale shark at measuring station, tape runs out at twelve metres, official needs extension cord, whale shark waits."}, {"f": "Basking sharks are the second-largest fish and feed exclusively on plankton like whale sharks.", "a": "Basking shark and whale shark at plankton buffet, both enormous, both eating the smallest possible food."}, {"f": "White sharks can detect a single drop of blood dissolved in millions of litres of seawater.", "a": "White shark at scent detection competition, single drop added to enormous tank, shark identifies it immediately."}, {"f": "Hammerhead sharks use their wide flat head to scan a larger area for the electrical signals of buried prey.", "a": "Hammerhead shark sweeps head side to side like a metal detector, locates stingray under sand, very precise."}, {"f": "Tiger sharks eat almost anything and have been found with tyres, number plates, and clothing in their stomachs.", "a": "Tiger shark at lost property, officer opens stomach, finds licence plate, returns it to confused owner."}, {"f": "Bull sharks can survive in freshwater and have been found hundreds of kilometres upriver.", "a": "Bull shark at river toll booth, officer looks confused, bull shark pays freshwater rate, continues upstream."}, {"f": "The thresher shark uses its extremely long tail fin like a whip to stun shoals of fish.", "a": "Thresher shark approaches fish shoal, whips tail overhead, fish all stunned simultaneously, shark very satisfied."}, {"f": "Nurse sharks lie motionless on the seafloor in groups during the day and hunt at night.", "a": "Nurse shark group lying on seafloor at noon, diver approaches, nudges one, opens one eye, diver backs away."}, {"f": "Lionfish have spectacular fan-like venomous fins that they use to corner prey against rocks.", "a": "Lionfish spreads fins dramatically, prey cornered against rock, prey looks left, looks right, nowhere to go."}, {"f": "Sea horses are closely related to pipefish and have the same tube-like snout design.", "a": "Seahorse and pipefish at family gathering, hold up snouts side by side, identical design, nod to each other."}, {"f": "Hagfish have existed in almost unchanged form for hundreds of millions of years.", "a": "Hagfish at natural history museum, points at its own fossil, then at itself, then at fossil again, nothing changed."}, {"f": "A tarantula can become bald on its abdomen from flicking all its irritating defensive hairs away.", "a": "Tarantula checks abdomen in mirror, significantly bald patch, it used a lot of hairs this season, needs a rest."}, {"f": "The black widow spider gets its name because the female sometimes eats the male after mating.", "a": "Male black widow approaches female very cautiously, female holds up pre-nuptial agreement, male reads it carefully."}, {"f": "Garden spiders eat and rebuild their web almost every morning to recycle the proteins.", "a": "Garden spider finishes night shift, eats entire web methodically, rebuilds identical one by dawn, very efficient."}, {"f": "Water spiders build an underwater air bell from silk and must refill it with surface air bubbles regularly.", "a": "Water spider descends to home, checks air level, surfaces, collects bubbles, returns, fills bell, back to business."}, {"f": "Scorpions glow bright blue-green under ultraviolet light for reasons scientists still cannot fully explain.", "a": "Scorpion at UV party, walks in, everyone turns to look, scorpion glowing magnificently, did not choose this."}, {"f": "Centipedes never have exactly one thousand legs and the count varies between 30 and 350.", "a": "Scientist counting centipede legs, reaches 178, centipede impatient, scientist notes never one thousand."}, {"f": "Millipedes are vegetarian while centipedes are fast predatory hunters despite their similar appearance.", "a": "Millipede and centipede at dinner, millipede orders salad, centipede orders everything that moves, waiter notes."}, {"f": "A praying mantis can rotate its head 180 degrees to look behind itself without moving its body.", "a": "Praying mantis hears noise behind it, head rotates 180 degrees, body completely still, threat assessed, head returns."}, {"f": "Stick insects can lay eggs that look like plant seeds to fool would-be predators.", "a": "Stick insect deposits eggs among seeds, bird pecks at seeds, sticks, spits, moves to different seeds."}, {"f": "Leaf insects have brown edges on their bodies that precisely mimic insect bite damage on real leaves.", "a": "Scientist tries to pick up leaf insect, it blinks, scientist drops it, looks at hand, back at leaf, sits down."}, {"f": "Grasshoppers produce sound by rubbing their hind legs against the edge of their wings.", "a": "Grasshopper at music lesson, teacher points to instrument, grasshopper raises leg, teacher says use that then."}, {"f": "Crickets chirp faster as temperature rises and can be used to estimate the outside temperature.", "a": "Crickets at weather station, thermometer broken, scientist counts chirps per minute, converts, correct to one degree."}, {"f": "A firefly produces light through a chemical reaction in its abdomen that generates no heat whatsoever.", "a": "Firefly at efficiency awards ceremony, produces light, judge measures heat output, reads zero, wins the prize."}, {"f": "Ladybirds secrete a bitter yellow fluid from their leg joints when threatened to deter predators.", "a": "Ladybird grabbed by curious bird, yellow fluid appears on legs, bird tastes it, makes face, releases immediately."}, {"f": "The dung beetle can navigate by the Milky Way while rolling its ball making it the only known insect to do so.", "a": "Dung beetle on moonless night, rolls ball in perfect straight line, other beetles following, stops to look up briefly."}, {"f": "Dragonflies can move each of their four wings independently allowing them to hover and fly backwards.", "a": "Dragonfly at air show, hovers motionless, reverses, spins, crowd of insects watches in absolute silence."}, {"f": "Mayflies have no functioning mouth as adults because they do not eat during their brief above-water life.", "a": "Mayfly arrives at restaurant, checks menu excitedly, remembers it cannot eat, sits for the company, very sad."}, {"f": "Caddisfly larvae build protective cases from pebbles, sand, and bits of wood around themselves.", "a": "Caddisfly larva at building materials shop, carefully selects pebbles, tests weight, assembles perfect case."}, {"f": "Cicadas can spend years underground as nymphs before all emerging at the same time as adults.", "a": "Cicadas underground for seventeen years, synchronized alarm goes off, all emerge simultaneously, absolute chaos above."}, {"f": "Aphids can reproduce without males during summer, producing live young through parthenogenesis.", "a": "Aphid receives summer schedule, notes no males required, produces offspring continuously, very time-efficient."}, {"f": "Ants protect herds of aphids from predators like ladybirds in exchange for their sweet honeydew secretions.", "a": "Ant in cowboy hat herds aphids, ladybird approaches, ant blocks it, aphids tap out honeydew, payment confirmed."}, {"f": "Termite queens can lay up to thirty thousand eggs per day throughout their long lives.", "a": "Termite queen signs thirty thousand birth certificates in a day, hand cramps, assistant takes over, queen naps."}, {"f": "Wasps can sting multiple times because their stinger has no barb, unlike the honeybee's barbed sting.", "a": "Wasp and bee at stinging competition, bee stings once and cannot continue, wasp keeps going, judge notes this."}, {"f": "Honeybees communicate the exact location of flowers to the hive by performing a waggle dance.", "a": "Bee returns to hive, launches into precise waggle dance, other bees watch carefully, all fly out in perfect direction."}, {"f": "Bumblebees can fly at much lower temperatures than honeybees thanks to their dense furry body covering.", "a": "Cold autumn morning, honeybees grounded, bumblebees buzzing around confidently, wearing their natural fur coat."}, {"f": "Hoverflies mimic the colouring of wasps and bees to deter predators despite being completely harmless.", "a": "Hoverfly approaches flower, predator backs away, hoverfly looks at own markings, nods, very pleased with them."}, {"f": "Only female mosquitoes drink blood as they need protein to develop their eggs, males drink only nectar.", "a": "Male mosquito at blood bank, receptionist explains he needs the nectar counter, both go to correct stations."}, {"f": "Crane flies lose their long legs extremely easily when caught and often escape by leaving a leg behind.", "a": "Crane fly grabbed by curious child, one leg stays behind, crane fly now on five legs, keeps flying."}, {"f": "Gnat bites can trigger a serious allergic skin condition in horses called summer eczema.", "a": "Horse arrives at gnat zone, puts on full protective suit, gnats very confused, horse walks through unbothered."}, {"f": "Fleas can jump two hundred times their own height thanks to an elastic protein stored in their hind legs.", "a": "Flea at Olympic high jump, competitors walk under bar, flea launches from ground, clears it by enormous margin."}, {"f": "Bed bugs can survive for months without a single blood meal by entering a dormant metabolic state.", "a": "Bed bug sets record for longest time between meals, calendar on wall shows eight months, bed bug perfectly fine."}, {"f": "Silverfish have a metallic sheen because they are covered in tiny overlapping scales like a fish.", "a": "Silverfish at fish ID parade, fish officer squints, looks at scales, looks at legs, writes not a fish, very confusing."}, {"f": "Woodlice are not insects but land-dwelling crustaceans that breathe through gill-like structures.", "a": "Woodlice at crustacean family reunion, crab looks surprised, woodlouse explains, crab looks at tiny gills, nods."}, {"f": "A millipede has four legs per body segment while a centipede has only two per segment.", "a": "Millipede and centipede at leg counting competition, millipede wins by enormous margin, centipede very grumpy."}, {"f": "Banana spiders sometimes hitch rides inside fruit shipments to completely new continents.", "a": "Customs officer opens banana crate, banana spider waves, officer closes crate, calls specialist, spider very calm."}, {"f": "Wolf spiders do not build webs but hunt actively by chasing prey across the ground using their speed.", "a": "Wolf spider ignores web-building class, goes jogging instead, catches more prey, teacher admits the results."}, {"f": "Jumping spiders can estimate depth and distance using their largest front pair of eyes with remarkable accuracy.", "a": "Jumping spider eyes up gap, calculates distance, leaps, perfect landing, measures gap afterwards, was correct."}, {"f": "Harvestmen have a fused body where the head and abdomen are joined into one, unlike true spiders.", "a": "Harvestmen at spider ID check, officer counts body sections, finds one instead of two, stamps different passport."}, {"f": "Giant snails can rasp holes in leaves using thousands of microscopic teeth on their ribbon-like tongue.", "a": "Giant snail at leaf, tongue deploys like a tiny industrial grater, hole appears methodically, snail moves on."}, {"f": "Vineyard snails are hermaphrodites with both male and female reproductive organs simultaneously.", "a": "Vineyard snail fills out registration form, pauses at gender field, ticks both boxes, moves on efficiently."}, {"f": "Slugs leave a glistening mucus trail that helps them move smoothly over rough surfaces without damage.", "a": "Slug approaches gravel path, applies own mucus, glides over it effortlessly, gravel completely unbothered."}, {"f": "Freshwater rams-horn snails can breathe air through a simple lung as well as absorb oxygen through their skin.", "a": "Rams-horn snail at breathing options meeting, has both covered, nods at both sides, very flexible approach."}, {"f": "Mussels filter tens of litres of water per day extracting the tiny particles they need as food.", "a": "Mussel at water quality inspection, inspects output, it is cleaner than the input, inspector very impressed."}, {"f": "Oysters grow in dense reef-like beds on shallow seafloors and filter huge volumes of water daily.", "a": "Oyster bed at water filter competition, processes enormous volume with no moving parts, wins every category."}, {"f": "Squid can squirt ink to create a dark cloud that confuses attackers while the squid escapes.", "a": "Squid spotted by predator, releases ink cloud, predator swims into it, squid long gone, predator sees nothing."}, {"f": "Cuttlebones, found washed up on beaches, are the internal shells of cuttlefish used for buoyancy.", "a": "Cuttlefish at buoyancy check, adjusts internal bone gas levels, rises, descends, rises, nods, working perfectly."}, {"f": "The nautilus regulates its buoyancy by adjusting the ratio of gas and fluid in its shell's chambers.", "a": "Nautilus at depth check, adjusts gas ratios, rises, descends, fine-tunes, rises again, perfect neutral buoyancy."}, {"f": "Argonaut octopuses build an extremely thin calcite shell in which the female protects her eggs.", "a": "Argonaut female at shell construction, builds it wafer-thin, tests strength, places eggs inside, very protective."}, {"f": "Emperor penguins incubate their single egg balanced on their feet under a warm skin flap during the polar winter.", "a": "Emperor penguin in blizzard, egg balanced on feet, zero degrees outside, warm skin flap deployed, egg perfectly cosy."}, {"f": "Puffins can hold dozens of small fish crosswise in their beak simultaneously thanks to special tongue spines.", "a": "Puffin at fish counter, fills beak with twenty fish, staff look at each other, puffin pays and flies off."}, {"f": "Gannets fold their wings and plunge like arrows into the sea from height to catch fish.", "a": "Gannet at cliff edge, spots fish below, folds wings, drops vertically, enters water perfectly, resurfaces with fish."}, {"f": "Cormorants have no waterproofing oils in their feathers so must spread their wings to dry after diving.", "a": "Cormorant emerges from water, finds post, spreads wings in classic pose, waits, other birds keep swimming."}, {"f": "Grey herons can stand completely motionless at the water's edge for many minutes waiting for fish to pass.", "a": "Heron at riverside, completely still, fish swims past, heron unmoving, fish returns, heron still waiting, then strikes."}, {"f": "White storks communicate by clattering their beaks together rapidly rather than by vocalising.", "a": "Two storks meet, both start beak-clattering simultaneously, conversation in full swing, neighbours look confused."}, {"f": "Spoonbills feed by sweeping their distinctive flat-tipped bill from side to side through shallow water.", "a": "Spoonbill at feeding time, bill goes left, right, left, right, fish confused, spoonbill full in minutes."}, {"f": "Bitterns camouflage themselves in reeds by pointing their beak straight up and swaying with the stems.", "a": "Bittern freezes among reeds, stretches neck upward, sways gently, person walks past with binoculars, sees nothing."}, {"f": "Male mallards have a bright green head while females are mottled brown for camouflage on the nest.", "a": "Male and female mallard walking together, male highly visible, female invisible against background, very different strategy."}, {"f": "Mute swans are the heaviest flying birds in Europe and form lifelong pair bonds.", "a": "Mute swan couple at anniversary, have been together longer than every other pair at the celebration."}, {"f": "Geese fly in a V-formation to reduce air resistance and take turns leading at the point.", "a": "Goose formation in sky, front goose exhausted, rotates to back, fresh goose takes point, very organised."}, {"f": "Coots do not have webbed feet but have wide lobes on each toe for swimming.", "a": "Coot at swim registration, officer asks about webbing, coot shows lobes, officer checks rulebook, allowed."}, {"f": "Kingfishers build their nesting tunnel by repeatedly striking the soft earth bank with their bill.", "a": "Kingfisher at nesting site, starts pecking bank methodically, tunnel appears over days, very purposeful work."}, {"f": "Great spotted woodpeckers drum on dry branches in spring to claim territory, not to find food.", "a": "Woodpecker finds resonant dead branch, drums loudly, listens to echo, drums again, very satisfied with the sound."}, {"f": "Cuckoo chicks push all the other eggs and nestlings out of the nest immediately after hatching.", "a": "Cuckoo chick hatches, looks around at nest contents, immediately starts clearing it out, hosts very confused."}, {"f": "Nightingales can produce over two hundred distinct song phrases in sequences that vary every time.", "a": "Nightingale at music theory exam, asked to repeat a phrase exactly, produces different but equally complex one."}, {"f": "Blackbirds begin singing before dawn in early spring to establish territory at first light.", "a": "Blackbird sets 4am alarm, climbs to rooftop, starts full performance before sun rises, neighbours note the schedule."}, {"f": "Starlings form enormous murmuration flocks in autumn that move in perfectly synchronised flowing patterns.", "a": "Starling murmuration sweeps across sky, shapes forming and dissolving, groundhog watchers below very philosophical."}, {"f": "Jackdaws pick parasites from the backs of sheep and deer in open fields.", "a": "Jackdaw lands on deer's back, gets to work systematically, deer looks around, shrugs, free health service."}, {"f": "Magpies build large domed nests of thorny branches with a roof to protect eggs from aerial predators.", "a": "Magpie building nest, installs roof last, steps back, inspects, waterproof and predator-resistant, nods."}, {"f": "Jay birds hide thousands of acorns in autumn and are the most important seed dispersers for oak trees.", "a": "Jay hides acorn 847, marks location mentally, collects it in February precisely, oak forest owes this bird everything."}, {"f": "Blue tits are highly active insect hunters that consume thousands of caterpillars per day in summer.", "a": "Blue tit at caterpillar count, tally reaches one thousand by noon, still going, trees looking relieved."}, {"f": "House sparrows prefer nesting close to human habitation and often nest under old roof tiles.", "a": "House sparrow surveys street, rejects woodland, rejects cliff, finds loose roof tile, moves family in immediately."}, {"f": "Swifts spend almost their entire lives airborne eating, drinking, and even sleeping on the wing.", "a": "Swift fills out address form, writes the sky in the address field, postal service very confused."}, {"f": "Barn swallows have deeply forked tails and a distinctive reddish-brown throat patch.", "a": "Barn swallow at swallow identification, officer checks tail fork depth, checks throat colour, stamps certificate."}, {"f": "House martins build their cup-shaped mud nests under eaves and return to exactly the same site each year.", "a": "House martin returns from Africa, flies directly to last year's nest, checks it over, needs minor repairs, begins."}, {"f": "Short-eared owls hunt low over open ground with a buoyant butterfly-like flight unlike most owls.", "a": "Short-eared owl at owl flying convention, other owls watching from trees, short-eared one skimming field below."}, {"f": "Barn owls have a heart-shaped facial disc that acts like a satellite dish funnelling sound to their ears.", "a": "Barn owl hears mouse under thirty centimetres of snow, pins location exactly, dives, perfect strike."}, {"f": "Eagle owls are the largest owls in the world and can take prey as large as young deer or foxes.", "a": "Eagle owl at prey weight record attempt, arrives with fox, officials measure, new record set, fox was not consulted."}, {"f": "Little owls are frequently seen perching on fence posts and making bobbing head movements when curious.", "a": "Little owl on post, sees something unfamiliar, head bobs rapidly up and down, assesses it, bobs again, satisfied."}, {"f": "Buzzards often perch on roadside posts waiting for road casualties and scan for voles in field margins.", "a": "Buzzard on motorway post, watching traffic, notes arrival of vole crossing road, times intervention perfectly."}, {"f": "Kestrels hover motionless in the air by flying into the wind at exactly the wind speed.", "a": "Kestrel hangs stationary above motorway, precisely matching wind speed, watching below, cars below very confused."}, {"f": "Goshawks are highly agile forest hunters that can manoeuvre through dense trees at high speed.", "a": "Goshawk enters dense woodland at full speed, weaves between every trunk and branch, exits on other side, perfect."}, {"f": "Sparrowhawks hunt mainly small songbirds making rapid surprise attacks through garden vegetation.", "a": "Sparrowhawk approaches garden at full speed through hedge gap, bluetits scatter, sparrowhawk evaluates options."}, {"f": "White-tailed eagles have a wingspan of up to two and a half metres and are the largest bird of prey in Europe.", "a": "White-tailed eagle at wingspan competition, spreads wings, other eagles back up, staff need longer measuring tape."}, {"f": "Red kites have a deeply forked tail they use as a precise rudder for tight aerial manoeuvring.", "a": "Red kite at aerial display, tail makes micro-adjustments continuously, moves like nothing else in the sky."}, {"f": "Vultures can soar for hours on thermal updrafts without flapping their wings at all.", "a": "Vulture sets wings at ten that morning, soars until four in the afternoon, not one flap, wings folded at dusk."}, {"f": "Condors lay only one egg every two years and chicks remain dependent on parents for an extended period.", "a": "Condor pair at family planning meeting, circle every other year on calendar, chick present at meeting, still dependent."}, {"f": "Flamingos filter feed upside down by drawing water backward through their angled bill.", "a": "Flamingo bends head to water, bill inverted, pumps water backward, filters food efficiently, straightens up, satisfied."}, {"f": "Pelicans drain water from their pouch by pressing it against their chest before swallowing the fish inside.", "a": "Pelican scoops fish in pouch, presses pouch to chest, water streams out, fish remaining, pelican swallows."}, {"f": "Albatrosses have a tendon lock system in their wings that holds them extended without using any muscle effort.", "a": "Albatross spreads wings, tendons click into locked position, glides for hours, zero wing muscle used at all."}, {"f": "Penguins moult all their feathers at once and cannot enter the water to feed during this period.", "a": "Penguin at moulting station, all feathers gone simultaneously, looks at sea, cannot enter, waits three weeks."}, {"f": "Ostriches can kick with a single forward-facing talon powerful enough to kill a lion.", "a": "Lion approaches ostrich, ostrich kicks forward, lion reconsidering very quickly, ostrich did not break a sweat."}, {"f": "Emus have three toes on each foot while ostriches have only two making them unusually reduced.", "a": "Emu and ostrich at toe count, officer counts three on emu, two on ostrich, stamps both, files them separately."}, {"f": "Cassowaries are highly territorial and have razor-sharp claws that can cause serious injury.", "a": "Researcher approaches cassowary with measuring equipment, cassowary raises claw slowly, researcher retreats."}, {"f": "Kiwis have their nostrils at the tip of their beak for sniffing out worms underground.", "a": "Kiwi walking through forest, nostrils sniffing at tip of bill, stops, marks spot, digs, worm confirmed."}, {"f": "Male peacocks shed their entire ornamental train after breeding season and regrow it the following year.", "a": "Peacock posing in full display in September, October arrives, tail gone, peacock looks back, shrugs, starts again."}, {"f": "Pheasants were introduced to Europe from Asia by the Romans and have been here ever since.", "a": "Pheasant at history museum, points to Roman exhibit, points at self, been here since then, guide makes note."}, {"f": "Partridges flush at the very last second when approached, making them almost impossible to spot before takeoff.", "a": "Walker approaches partridge in field, nothing visible, final step, fifteen birds explode upward simultaneously."}, {"f": "Quails are perfectly camouflaged in long grass and virtually impossible to spot when motionless.", "a": "Birdwatcher stares at meadow for twenty minutes, sees nothing, quail was one metre away the whole time."}, {"f": "Hummingbirds can move their wings in a figure-of-eight pattern allowing them to hover perfectly in place.", "a": "Hummingbird at physics demonstration, figure-of-eight wings shown in slow motion, audience completely silent."}, {"f": "Kingfishers catch fish by diving straight down with folded wings from a perch and snatching it precisely.", "a": "Kingfisher spots fish, locks on, dives, disappears into water, resurfaces with fish in bill, back on perch."}, {"f": "Bee-eaters catch insects mid-air then beat them against a branch to remove the sting before eating.", "a": "Bee-eater catches wasp, three precise taps on branch, sting neutralised, eaten, back in the air immediately."}, {"f": "Hoopoes raise their fan-like crest when alarmed and lower it when relaxed.", "a": "Hoopoe walking calmly, something surprising happens, crest fans open instantly, everything fine, crest closes."}, {"f": "Toucans use their large hollow beak to regulate body temperature by adjusting blood flow through it.", "a": "Toucan on hot day, directs blood to beak, heat radiates out, temperature drops, efficient built-in radiator."}, {"f": "Hornbills seal the female into the nest cavity during brooding leaving only a small slit for food delivery.", "a": "Hornbill couple seal entrance with mud, male brings food delivery daily through slit, female nods, system works."}, {"f": "Cockatoos can raise or flatten their crest feathers to signal different emotional states.", "a": "Cockatoo enters room, crest raises indicating excitement, eats seed, crest flattens, very contented, clear signals."}, {"f": "Macaws have beaks powerful enough to crack open coconuts and can exert considerable force.", "a": "Macaw at coconut cracking competition, human competitors struggling, macaw cracks one open, very casual."}, {"f": "Lyrebirds can even mimic mechanical sounds like chainsaws, car alarms, and camera motor drives.", "a": "Lyrebird performs entire construction site soundscape for bush audience, no instruments visible, all coming from one bird."}, {"f": "Mockingbirds can perfectly imitate the songs of dozens of other species in a single continuous performance.", "a": "Mockingbird performs medley of thirty species, actual birds of each species look around confused by their own call."}, {"f": "Nightingales sing most intensely just before dawn to claim territory at the start of the day.", "a": "Nightingale sets 3am alarm, climbs to singing post, launches into most complex performance of the night, territory claimed."}, {"f": "Grasshopper warblers produce a monotonous reeling song that sounds almost exactly like a cricket.", "a": "Birdwatcher hears cricket sound, ignores it, then birdwatcher hears it from a different tree, looks up."}, {"f": "Reed warblers sing a chaotic varied song that includes impressions of other bird species.", "a": "Reed warbler sings through night incorporating calls of five other species, all five species very confused."}, {"f": "Robin redbreasts sing throughout the year including winter and both males and females defend territories.", "a": "Robin in December belting out full territorial song in snowstorm, other birds hibernating, robin very dedicated."}, {"f": "Wrens hold their short tail almost permanently cocked straight upward and produce an extraordinarily loud song.", "a": "Wren on branch, tiny body, tail straight up, opens beak, volume that surprises every nearby animal."}, {"f": "Dunnocks have a complex mating system where both males and females can have multiple simultaneous partners.", "a": "Dunnock at family tree drawing exercise, grabs many sheets of paper, still not enough, teacher notes this."}, {"f": "Treecreepers spiral upward around tree trunks probing bark for insects with their curved bill.", "a": "Treecreeper starts at base of oak, spirals upward methodically, reaches top, flies to base of next tree."}, {"f": "Nuthatches are the only birds that can walk headfirst straight down a tree trunk.", "a": "Nuthatch demonstration: head down, walks straight down trunk, other birds stare, several attempt it, cannot."}, {"f": "Goldcrests are the smallest birds in Europe weighing only five grams.", "a": "Goldcrest at weigh-in, scale reads five grams, official checks scale is working, weighs again, confirmed."}, {"f": "Long-tailed tits travel through winter in family groups that look like fluffy pink balls moving through hedges.", "a": "Long-tailed tit family moves through hedge, each one a pink-white puffball, entire bush appears to be moving."}, {"f": "Great grey shrikes impale prey like mice and large insects on thorns to form a larder for later.", "a": "Great grey shrike surveys thorn bush larder, eight mice and twelve beetles sorted by size, very organised."}, {"f": "Golden orioles are bright yellow but almost invisible because they live very high in the forest canopy.", "a": "Birdwatcher hears unmistakable oriole call, looks up, sees only leaves, oriole is definitely there somewhere."}, {"f": "Ravens sometimes cooperate with wolves, leading them to carcasses and eating alongside them once opened.", "a": "Raven and wolf arrive at carcass together, wolf opens it, raven eats alongside, both nod, long arrangement."}, {"f": "Rooks are distinguished from carrion crows by their pale greyish beak base and colonial nesting habits.", "a": "Rook at crow ID parade, officer checks beak base colour, confirms pale, stamps rook on passport."}, {"f": "Jackdaws are intensely loyal to a single partner and the pair stays together throughout their lives.", "a": "Jackdaw couple at commitment ceremony, other birds note they already committed decades ago, very old arrangement."}, {"f": "Brown rats are excellent swimmers and can enter houses through the sewage system.", "a": "Plumber opens drain inspection, brown rat surfaces, nods professionally, checks pipe condition, continues route."}, {"f": "Black rats are superior climbers and are typically found near ports and in the upper levels of buildings.", "a": "Black rat at building access, ignores ground floor, climbs drainpipe, enters sixth floor, sets up at the top."}, {"f": "Red squirrels have several drey nests and use different ones depending on the season and weather.", "a": "Red squirrel checks property portfolio, three dreys available, selects most sheltered one for November, moves in."}, {"f": "Grey squirrels carry a virus that is lethal to red squirrels but they themselves are immune to it.", "a": "Grey squirrel at immunity demonstration, red squirrels watching from safe distance, grey shrugs, very healthy."}, {"f": "Grey squirrels damage oak trees by stripping bark from the upper sections in spring.", "a": "Forester discovers stripped oak, finds grey squirrel at the top finishing the last section, stern conversation follows."}, {"f": "Dormice spend seven months of the year in hibernation which is longer than any other UK mammal.", "a": "Dormouse sets hibernation start date, other mammals set theirs, dormouse's is earliest by two months."}, {"f": "Yellow-necked mice have a distinctive band of yellow fur across their chest and are larger than wood mice.", "a": "Yellow-necked mouse at mouse ID, officer measures the yellow chest band, confirms, stamps yellow-necked."}, {"f": "Hazel dormice are strictly arboreal and almost never descend voluntarily to ground level.", "a": "Hazel dormouse asked to come down from tree for identification, refuses, researcher brings clipboard up instead."}, {"f": "Water voles dig burrows with entrances just below the water line to deter most predators.", "a": "Mink approaches water vole burrow, entrance is underwater, mink looks at it, mink was not prepared for this."}, {"f": "Field voles create obvious runways through long grass that lead directly to their burrow entrances.", "a": "Fieldworker follows vole runway through grass, arrives at burrow, vole inside closes tiny door, very clear signage."}, {"f": "Wood mice have unusually large black eyes for night vision and powerful hind legs for leaping.", "a": "Wood mouse spotted by cat, cat lunges, wood mouse leaps three body lengths sideways, cat very surprised."}, {"f": "Harvest mice weave perfectly round nests among grass stems using blades of grass split with their teeth.", "a": "Harvest mouse weaves nest among rye stems at chest height, structural engineer would approve."}, {"f": "Guinea pigs produce a loud wheek sound when they hear food being prepared or a fridge opening.", "a": "Fridge opens three rooms away, guinea pig in hutch outside already wheek-ing, waiting at cage door."}, {"f": "Chinchillas must never be bathed in water and clean their coats using volcanic pumice dust instead.", "a": "Chinchilla politely declines bath, requests dust bath, rolls in pumice, emerges immaculate, very clean."}, {"f": "Degus cannot metabolise sugar and will develop diabetes if given standard hamster or rabbit food.", "a": "Degu at pet shop reading ingredient lists, puts down three products, asks for unsweetened option."}, {"f": "Beavers can fell trees up to thirty centimetres in diameter in a single night of gnawing.", "a": "Beaver clocks in at dusk, gnaws methodically, tree falls at midnight, beaver takes break, inspects work."}, {"f": "Coypu have orange-coloured front teeth due to iron compounds deposited in the enamel.", "a": "Coypu at dentist, dentist examines orange teeth, asks about diet, coypu shows blood iron results, dentist impressed."}, {"f": "Muskrats build lodges of aquatic vegetation with underwater entrances similar to beavers.", "a": "Muskrat at property showcase, shows lodge, highlights underwater entrance feature, very secure, very damp."}, {"f": "Porcupines cannot shoot their quills but lose them very easily on contact with an attacker.", "a": "Dog investigates porcupine, porcupine does nothing, dog touches it, dog has twenty quills, very surprised."}, {"f": "Rabbits eat their soft night droppings directly to extract nutrients processed in the first pass.", "a": "Rabbit finishes meal, checks watch, waits, collects soft droppings, eats them again, system confirmed working."}, {"f": "Hares can reach speeds of 70 kilometres per hour and cut corners with sharp sudden direction changes.", "a": "Fox chasing hare at 50km/h, hare cuts right at full speed, fox slides past, hare long gone."}, {"f": "Wild rabbits warn the colony of danger by thumping their powerful hind legs on the ground.", "a": "Rabbit spots sparrowhawk, thumps ground twice, all rabbits underground within four seconds, field empty."}, {"f": "Flemish Giant rabbits are the largest rabbit breed and can weigh up to ten kilograms.", "a": "Flemish Giant at rabbit show weigh-in, scale reads ten kilograms, judge checks scale, checks rabbit, confirms."}, {"f": "Hedgehogs have poor eyesight but an excellent sense of smell and hearing to locate invertebrate prey.", "a": "Hedgehog at prey location test, eyes covered, follows smell and sound, finds every worm, perfect score."}, {"f": "Moles have an extra thumb-like bone on their forepaw that gives them even more digging leverage.", "a": "Mole shows extra thumb structure to anatomy class, class very surprised, mole says it helps enormously."}, {"f": "Shrews produce musk from flank glands that makes them unpalatable to most predators.", "a": "Cat catches shrew, tastes it, immediate grimace, releases shrew, shrew straightens itself, walks off."}, {"f": "Water shrews have stiff hairs on their feet that trap air bubbles allowing them to walk briefly on water.", "a": "Water shrew steps onto pond surface, air bubbles on feet, runs across, reaches other side, hops off."}, {"f": "Pygmy shrews must eat every two hours or risk dying of starvation due to their extreme metabolic rate.", "a": "Pygmy shrew sets two-hour food alarm, eats, resets alarm, eats again, twelve times before midnight."}, {"f": "Domestic cats use their whiskers as precise width gauges to check if their body can fit through gaps.", "a": "Cat approaches narrow gap, whiskers touch both sides simultaneously, cat backs up, finds wider gap, passes through."}, {"f": "Cats have a flexible collarbone that allows them to fit through any space their head can pass through.", "a": "Cat approaches impossibly narrow gap, head goes through, body compresses, follows, pops out other side perfectly."}, {"f": "Cheetahs use their long muscular tail as a counterbalance and rudder during high-speed directional changes.", "a": "Cheetah at 100km/h makes sharp left turn, tail swings right for balance, stays upright, prey very surprised."}, {"f": "Lion manes are indicators of health and dominance with darker fuller manes being preferred by females.", "a": "Two male lions side by side, one with full dark mane, one with sparse pale mane, females make very clear choice."}, {"f": "Tigers are powerful swimmers and often soak in rivers and lakes during hot weather to keep cool.", "a": "Tiger approaches river on hot day, other animals expecting it to stop, tiger walks straight in, sighs contentedly."}, {"f": "Jaguars kill prey by biting directly through the skull with their exceptionally powerful jaw muscles.", "a": "Jaguar approaches armadillo, other cats aim for throat, jaguar aims for head, armadillo armour irrelevant."}, {"f": "Leopards drag their kills high into trees to keep them away from lions and hyenas.", "a": "Leopard arrives at tree with kill, checks for lions, checks for hyenas, hauls kill twelve metres up, satisfied."}, {"f": "Snow leopards wrap their long thick tail around their face like a scarf while sleeping in the cold.", "a": "Snow leopard finding sleeping spot, locates own tail, wraps it around face, closes eyes, very cosy."}, {"f": "Pumas cannot roar but communicate using whistles, chirps, and screams that can sound eerily human.", "a": "Campers hear screaming from forest, very frightened, puma steps out looking very innocent, just communicating."}, {"f": "Lynx have very large padded paws that act like snowshoes preventing them from sinking in deep snow.", "a": "Lynx and wolf walking in deep snow, wolf sinking with every step, lynx walking on top, very relaxed."}, {"f": "Servals have the largest ears relative to body size of any wild cat for detecting prey in tall grass.", "a": "Serval stands in long grass, enormous ears rotate independently, mouse rustling detected, precise pounce."}, {"f": "Caracals have tufted black-tipped ears and the word caracal means black ear in Turkish.", "a": "Caracal at etymology class, teacher explains the name, caracal raises tufted ear, points at it, knew already."}, {"f": "Ocelots are highly skilled nocturnal hunters that are equally comfortable climbing trees and swimming.", "a": "Ocelot at field assessment, climbs tree first, swims river second, hunts at night third, perfect marks."}, {"f": "Wildcats are very similar in appearance to domestic tabby cats but have a thick blunt-ended tail.", "a": "Wildcat spotted near farm, farmer approaches thinking it is a stray, tail shape wrong, very different animal."}, {"f": "All domestic dogs descended from a now-extinct wolf population that was first tamed thousands of years ago.", "a": "Dog at wolf heritage museum, points to exhibit, that is my ancestor, wolf descendant next to it nods."}, {"f": "Bloodhounds can follow a scent trail that is several days old thanks to their enormous olfactory capacity.", "a": "Bloodhound given scent, puts nose down, follows trail made four days ago, arrives at destination, very sure."}, {"f": "Border collies use a technique called eye, crouching and fixing their gaze to control livestock movements.", "a": "Border collie approaches sheep, drops low, fixes gaze, sheep freezes, border collie adjusts position, sheep moves."}, {"f": "Basenjis clean themselves like cats and produce no characteristic dog odour.", "a": "Basenji at dog show, other dogs have dog smell, basenji does not, judge sniffs twice, writes unusual."}, {"f": "Greyhounds have a deep chest and narrow waist giving them an ideal aerodynamic frame for maximum speed.", "a": "Greyhound at wind tunnel test, drag readings very low, designers ask for measurements, greyhound declines."}, {"f": "Saint Bernards never actually carried brandy barrels around their necks, this detail was invented by an artist.", "a": "Saint Bernard at history correction class, shows painting with barrel, shakes head, class very surprised."}, {"f": "Newfoundlands have webbed feet and a water-resistant double coat making them natural lifeguards.", "a": "Newfoundland at swimming test, dives in, retrieves dummy in record time, examiner wipes eye, very proud."}, {"f": "Chihuahuas have a soft spot called a molera on their skull that sometimes persists throughout life.", "a": "Chihuahua at head exam, vet locates molera gently, marks chart, chihuahua looks unimpressed by all the fuss."}, {"f": "German Shepherds are used as police dogs worldwide due to their work drive, intelligence, and trainability.", "a": "German Shepherd at police selection, completes every test at top speed, sits, waits for next instruction."}, {"f": "Poodles were originally bred as water retrievers and are highly athletic working dogs despite their styling.", "a": "Show poodle at hunting trial, other dogs look sceptical, poodle retrieves from river perfectly, everyone quiet."}, {"f": "Wolves communicate across vast distances using howling which also reinforces pack bonds and identity.", "a": "Wolf pack howling at midnight, other wolf pack three valleys away hears it clearly, responds, message received."}, {"f": "Coyotes can hybridise with wolves and domestic dogs producing fertile offspring called coywolves.", "a": "Coywolf at species identification, officer checks three boxes simultaneously, stamps unusual but valid."}, {"f": "Jackals form lifelong pair bonds and cooperate closely to hunt prey larger than either could take alone.", "a": "Jackal pair at prey too large for one, exchange a glance, split left and right, coordinate, successful hunt."}, {"f": "Dingoes play a crucial role in Australian ecosystems by controlling feral cat and fox populations.", "a": "Dingo at ecosystem management briefing, fox and cat numbers on chart declining since dingo reintroduction, all nod."}, {"f": "African wild dogs have a unique coat pattern as individual as a human fingerprint.", "a": "African wild dog at identity parade, officer compares coat patterns, no two match, stamps unique."}, {"f": "Arctic foxes can withstand temperatures down to minus 70 degrees Celsius before they begin to shiver.", "a": "Arctic fox at temperature record attempt, thermometer hits minus 70, fox yawns, not shivering yet."}, {"f": "Raccoon dogs belong to the dog family but are one of the very few canids that can climb trees.", "a": "Raccoon dog at dog reunion, other dogs admiring its tree-climbing certificate, dogs cannot do this."}, {"f": "Polar bear paws work like snow shoes thanks to small bumps on the soles that prevent slipping on ice.", "a": "Polar bear walks confidently on glassy ice, other arctic animals sliding everywhere, bear very unbothered."}, {"f": "Brown bears can go up to six months during hibernation without defecating or urinating.", "a": "Brown bear emerges from six-month hibernation, checks calendar, heads directly to bathroom, very determined."}, {"f": "Asian black bears have extremely large ears compared to other bear species.", "a": "Asian black bear at hearing test, audiologist moves sound source further and further back, bear still hears it."}, {"f": "Spectacled bears are expert platform builders bending branches high in trees to make sturdy resting spots.", "a": "Spectacled bear in tree bending branches methodically, tests platform, nods, settles in, excellent construction."}, {"f": "Sun bears have a flexible snout they use to extract insects from narrow tree cavities with ease.", "a": "Sun bear approaches hollow tree, snout extends, navigates the cavity, extracts grub, snout retracts, done."}, {"f": "Sloth bears seal their nostrils completely shut while sucking up termites so none crawl into their nose.", "a": "Sloth bear approaches termite mound, nostrils seal with cartoon pop, inhales enormously, done, nostrils reopen."}, {"f": "Giant pandas defecate up to forty times a day because they digest barely any of the tough bamboo fibre.", "a": "Giant panda checks daily schedule, forty bathroom breaks marked, sighs, starts eating bamboo again."}, {"f": "The red panda has a false thumb just like the giant panda formed from an enlarged wrist bone.", "a": "Red panda and giant panda compare false thumbs side by side, both nod, very useful for holding bamboo."}, {"f": "Raccoons can rotate their hind feet 180 degrees to climb down trees headfirst.", "a": "Raccoon at top of tree, rotates back feet with cartoon click, descends headfirst, other animals very impressed."}, {"f": "White-nosed coatis use their long flexible snout to root deep into the forest floor searching for worms.", "a": "Coati snout disappears completely into leaf litter, reappears with worm, snout covered in soil, very satisfied."}, {"f": "Kinkajous have a prehensile tail they use as an extra hand and to hang upside down from branches.", "a": "Kinkajou reaches for fruit too far away, tail hooks branch, swings upside down, grabs fruit, perfect."}, {"f": "Badgers sometimes share their underground setts with foxes or rabbits as long as everyone keeps to themselves.", "a": "Badger opens sett door, fox and rabbit already inside, badger sighs, points to separate rooms, ground rules set."}, {"f": "Honey badgers have skin so thick and loose they can turn inside it to bite an attacker grabbing them.", "a": "Predator grabs honey badger by scruff, honey badger rotates inside own skin to face attacker, predator releases."}, {"f": "Pine martens prefer old dense forests and actively avoid open areas and clearings.", "a": "Pine marten approaches forest edge, looks at open field, shakes head, retreats back into dense trees."}, {"f": "Stone martens are attracted to the warmth of car engines and gnaw on cables and hoses under the bonnet.", "a": "Mechanic opens bonnet, stone marten inside, chewing cable, looks up, mechanic closes bonnet slowly."}, {"f": "Stoats hunt with a hypnotic dance, leaping and spinning wildly to confuse prey before striking.", "a": "Stoat faces rabbit, begins spinning and leaping dramatically, rabbit watches confused, stoat strikes, success."}, {"f": "Weasels have such a fast metabolism they must eat at least a third of their body weight every single day.", "a": "Weasel weighs itself, does maths, sets enormous daily food target, starts immediately, never stops."}, {"f": "Polecats sometimes create a winter larder of paralysed frogs to keep the meat fresh for later.", "a": "Polecat arranges paralysed frogs neatly in pantry, labels them by date, closes pantry door, very organised."}, {"f": "Ferrets sleep so deeply that owners sometimes fear they have died, a phenomenon called the ferret dead sleep.", "a": "Ferret completely motionless on sofa, owner panics, pokes it, ferret cracks one eye open, go away."}, {"f": "European otters seal their ears and nostrils completely shut the moment they dive underwater.", "a": "Otter at poolside, takes breath, ears and nostrils close simultaneously, dives, resurfaces, both reopen."}, {"f": "Sea otters have no blubber and rely entirely on their incredibly dense fur to stay warm in freezing water.", "a": "Sea otter and seal compare cold-water strategies, seal shows blubber, otter combs fur, both equally warm."}, {"f": "Skunks aim their spray glands with great precision directly at an attacker's eyes to cause temporary blindness.", "a": "Skunk faces threat, lines up spray carefully like a marksman, fires, direct hit, threat stumbles away blinded."}, {"f": "Seal whiskers are so sensitive they can detect the ripple made by a swimming fish a hundred metres away.", "a": "Seal at vibration detection test, fish swims at one hundred metres, seal whiskers twitch, seal nods, felt it."}, {"f": "Common seal pups shed their white fluffy birth coat while still inside the womb before they are born.", "a": "Common seal pup born already streamlined, grey and ready, no white coat, straight into water, very efficient."}, {"f": "Grey seal pups are born with a thick white coat and must stay ashore for weeks until they moult.", "a": "Grey seal pup on beach in white coat, looks at sea longingly, mother shakes head, not yet, three more weeks."}, {"f": "Hooded seal milk contains up to 60 percent fat which is why pups grow at an extraordinary rate in four days.", "a": "Hooded seal pup at day one small, day four enormous, nutritionist examines milk, writes sixty percent fat, sits down."}, {"f": "Leopard seals are the second-largest predators in Antarctic waters after orcas.", "a": "Leopard seal and orca at Antarctic predator rankings, orca first, leopard seal second, penguin third from bottom."}, {"f": "Walruses can use their tusks to hack breathing holes through thick sea ice.", "a": "Walrus at solid ice sheet, raises tusks, hammers rhythmically, hole appears, surfaces through it, satisfied."}, {"f": "California sea lions can fold their rear flippers forward allowing them to run surprisingly fast on land.", "a": "California sea lion folds flippers forward, gallops across beach at speed, tourists scramble out of the way."}, {"f": "Northern fur seals have such dense fur that water never actually reaches their skin while swimming.", "a": "Northern fur seal underwater, scientist measures skin humidity, reads completely dry, fur doing all the work."}, {"f": "Elephant seals can dive to depths of two kilometres to hunt deep-sea fish and squid.", "a": "Elephant seal at depth gauge, sets record dial to two kilometres, dives, pressure gauge in background spinning."}, {"f": "Male elephant seals use their trunk-like nose as an amplifier to project their rumbling roar for kilometres.", "a": "Male elephant seal inflates nose, opens mouth, roar echoes across three bays, rival on distant beach hears it."}, {"f": "Dolphins only use their teeth to grab prey and always swallow fish whole without chewing.", "a": "Dolphin at fish dinner, grabs fish with teeth, tips head back, swallows entire fish whole, ready for next."}, {"f": "Bottlenose dolphins can tune their sonar so precisely they can feel the difference between a ping pong ball and a golf ball.", "a": "Dolphin at sonar accuracy test, two balls presented underwater, dolphin identifies both immediately, judge impressed."}, {"f": "Orcas sometimes sand-rub, swimming against gravel beaches in specific bays to clean and stimulate their skin.", "a": "Orca herd arrives at favourite gravel beach, lines up, takes turns rubbing against shore, very specific ritual."}, {"f": "Sperm whales use almost no oxygen during their deep dives as they store it in their massive muscle mass.", "a": "Sperm whale at dive record attempt, oxygen monitor barely moves for ninety minutes, scientists checking equipment."}, {"f": "Narwhal groups are strictly segregated by sex and age with males and females living separately.", "a": "Narwhal at group meeting, males on left, females on right, young on far side, very orderly arrangement."}, {"f": "Common dolphins can leap so high and rotate so fast they sometimes complete three somersaults in one jump.", "a": "Common dolphin launches from water, spins three times, lands cleanly, judges hold up scores, all tens."}, {"f": "Harbour porpoises communicate with sounds so high-pitched they are completely inaudible to humans.", "a": "Harbour porpoise chatting to other porpoise, scientist holds up hydrophone, converts frequency, eyes go wide."}, {"f": "River dolphins have small rudimentary eyes because there is nothing to see in the murky water anyway.", "a": "River dolphin at eye test, optometrist holds up chart, dolphin shrugs, sonar works much better here."}, {"f": "Blue whales have an oesophagus so narrow they cannot swallow anything larger than a beach ball.", "a": "Blue whale at throat measurement, doctor measures opening, blue whale nods, krill get through, everything else no."}, {"f": "Humpback whales use their long pectoral fins to regulate body temperature in warmer waters.", "a": "Humpback in tropical water, extends enormous fins outward like radiators, temperature drops, much more comfortable."}, {"f": "Bowhead whales have no dorsal fin which is convenient as they swim constantly just below the ice surface.", "a": "Bowhead whale navigating under ice sheet, no dorsal fin to snag on anything, glides through effortlessly."}, {"f": "Grey whales are the only baleen whales that feed primarily by sucking food from the seafloor.", "a": "Grey whale at seafloor, rolls sideways, presses mouth down, suction engaged, creatures and sediment rise up."}, {"f": "Horses can rotate their ears 180 degrees to pick up sounds from all directions without moving their head.", "a": "Horse facing forward, single ear rotates 180 degrees backward to catch sound behind, face completely still."}, {"f": "Przewalski's horses have never been successfully domesticated and always retain their wild instincts.", "a": "Trainer approaches Przewalski's horse with saddle, horse looks at saddle, looks at trainer, definitely not."}, {"f": "Donkeys protect sheep and goat flocks from wolves and foxes because they are naturally highly territorial.", "a": "Donkey patrolling sheep field, fox approaches fence, donkey charges fence, fox reconsiders, leaves immediately."}, {"f": "Zebras communicate frequently and recognise each other by their unique stripe patterns and vocalisations.", "a": "Zebra at herd reunion, spots old friend by stripe pattern across field, calls out, friend recognises call back."}, {"f": "Tapirs have thick skin on the back of their neck that protects them from jaguar and puma bites.", "a": "Jaguar bites tapir's neck, teeth cannot penetrate, jaguar inspects teeth, tapir walks away unbothered."}, {"f": "Indian rhinos love water and can spend hours bathing and wallowing in pools to cool down.", "a": "Indian rhino finds muddy pool, steps in, sighs contentedly, still there two hours later, completely relaxed."}, {"f": "White rhinos sometimes live in small sociable groups unlike most other rhino species which are solitary.", "a": "White rhino group having evening chat, black rhino watches alone from distance, considering joining, probably won't."}, {"f": "Black rhinos use their prehensile lip to strip entire thorny branches from shrubs in one swift motion.", "a": "Black rhino at thorny acacia, grabs branch with lip, strips it clean in one pull, thorns irrelevant."}, {"f": "A hippo can hold its breath underwater for up to five minutes.", "a": "Hippo at underwater breath contest, timer starts, five minutes pass, hippo surfaces calmly, other animals exhausted."}, {"f": "Pygmy hippos are nocturnal and sleep during the day in hidden muddy pools deep in the forest.", "a": "Researcher searching for pygmy hippo all day, finds nothing, sets night camera, footage shows hippo immediately."}, {"f": "Wild boars have an extraordinarily powerful sense of smell and are sometimes trained to hunt underground truffles.", "a": "Wild boar at truffle farm, trainer demonstrates technique, boar ignores instructions, finds twelve truffles immediately."}, {"f": "Warthogs always run with their tail held straight up like an antenna so the rest of the group can follow.", "a": "Warthog family running from predator, all tails vertical, perfect visual tracking system, no one gets lost."}, {"f": "Babirusa pigs can lose their tusks if they do not regularly grind them against hard surfaces to wear them down.", "a": "Babirusa wakes up, checks tusk growth chart, locates grinding stone, grinds methodically, checks again, good."}, {"f": "Camel red blood cells can swell enormously after drinking so they can absorb litres of water without diluting their blood.", "a": "Camel drinks at desert well, blood cells expand visibly, stores water at cellular level, walks off refreshed."}, {"f": "Dromedary camels have callus pads on their chest and knees so they can lie comfortably on scorching desert sand.", "a": "Dromedary lowers itself onto blazing sand, pads contact surface, comfortable immediately, other animals standing."}, {"f": "Llamas flap their ears as a first warning before spitting a foul-smelling stomach acid at an annoyance.", "a": "Llama ears start flapping, visitor continues annoying it, ears flap faster, visitor ignores warning, gets spat on."}, {"f": "Alpacas have very soft feet that do not damage grassland or tear up plant roots when they walk.", "a": "Alpaca and horse walk same paddock, horse leaves muddy trenches, alpaca leaves perfect grass behind, groundskeeper notes."}, {"f": "Guanacos are strong swimmers and cross wide Patagonian rivers without difficulty.", "a": "Guanaco arrives at wide river, other animals looking for a bridge, guanaco just walks in and swims across."}, {"f": "Vicuñas have teeth that grow continuously like rodents because they scrape very short grass from rocky surfaces.", "a": "Vicuña at dentist, dentist checks teeth growth rate, matches rodent chart, writes this is unusual for a camelid."}, {"f": "Male red deer eat almost nothing during the intense rutting season and lose a significant amount of body weight.", "a": "Male red deer at rut weigh-in, staff note he has lost fifteen kilograms this week, deer barely notices."}, {"f": "Roe deer make a sharp barking sound almost identical to a large dog when sounding the alarm.", "a": "Walker hears large dog barking in forest, looks around, roe deer in bushes, both equally surprised."}, {"f": "Moose can dive underwater to feed on nutritious aquatic plants growing on the bottom of lakes.", "a": "Moose wades into lake, keeps going, entire animal disappears, bubbles surface, moose reappears eating waterweeds."}, {"f": "Female reindeer keep their antlers all winter to defend food patches while males shed theirs in autumn.", "a": "Reindeer at winter grazing site, female with antlers guards patch, antlerless males queue politely at a distance."}, {"f": "Fallow deer have a distinctive white rump with a black-edged tail that bobs continuously while walking.", "a": "Fallow deer walking through forest, tail bobbing hypnotically, predator tracking it gets dizzy, gives up."}, {"f": "Giraffes must splay their front legs awkwardly or kneel just to reach the water surface to drink.", "a": "Giraffe at waterhole, performs awkward leg-splay, reaches water, drinks, reassembles itself, other animals watching."}, {"f": "Okapis have scent glands between their hooves that leave an oily trail on the forest floor as they walk.", "a": "Okapi walks through forest, oily footprints left behind, other okapis read the trail like a navigation map."}, {"f": "Cattle produce hundreds of litres of gas per day through constant fermentation in their rumen.", "a": "Cow at environmental impact meeting, scientist presents gas production chart, cow looks embarrassed, chart very tall."}, {"f": "Buffalo have a phenomenal memory and deliberately target hunters who injured them years earlier.", "a": "Buffalo spots hunter from across field, studies face, checks memory, this is the one, hunter retreating rapidly."}, {"f": "Yaks have larger hearts and lungs than regular cattle to function in the thin high-altitude mountain air.", "a": "Yak at high-altitude medical check, doctor compares lung scan to regular cow, double the volume, makes note."}, {"f": "Bison can reach speeds of fifty kilometres per hour despite their massive bulk and can jump over fences.", "a": "Farmer builds fence to contain bison, bison approaches at speed, clears it cleanly, farmer calls for higher fence."}, {"f": "Wisent take dust baths in dry earth to shake parasites from their thick winter coats.", "a": "Wisent finds dry patch of earth, drops into it, rolls repeatedly, cloud of dust, stands up, parasite-free."}, {"f": "Chamois can leap across gaps of over six metres between mountain rocks.", "a": "Chamois at six-metre gap, measures with eye, takes three steps back, launches, clears it, carries on e
