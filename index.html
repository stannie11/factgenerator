sseroles, everyone has a cry."}, {"f": "The jumping spider can see detail in four different spectral ranges simultaneously while stalking prey.", "a": "Jumping spider approaches fly in full tactical analysis mode, thermal, UV, regular, and polarized views all active simultaneously."}, {"f": "Some species of fish use tools to open shellfish, carrying rocks long distances to use as anvils.", "a": "Tusk fish picks up rock, swims 200 metres with it to specific coral, uses it to crack clam, returns rock for next time."}, {"f": "The mantis shrimp can swing its club as fast as a 22-caliber bullet, generating forces 2500 times its own weight.", "a": "Mantis shrimp at physics lecture explains its own mechanics, equation fills entire board, professor sits down looking pale."}, {"f": "Some species of ant create living chain saws with their mandibles to cut plants, coordinating in organized shifts.", "a": "Leafcutter ants working in organized shifts with tiny time cards, union rules respected, leaves cut at regulation speed."}, {"f": "The lyrebird can even reproduce mechanical sounds like camera motor drives and car engines with perfect fidelity.", "a": "Lyrebird impersonates entire car starting up, driving away, and stalling, other birds very confused where the car went."}, {"f": "Some species of dolphin use sea sponges to protect their rostrums and teach this to their offspring.", "a": "Dolphin mom fits tiny sponge helmet on baby dolphin, baby dolphin looks at camera, both dive for seafloor foraging."}, {"f": "The electric shock of a torpedo ray was used by ancient Romans to treat headaches and gout.", "a": "Ancient Roman with headache approaches torpedo ray nervously, touches it, zap, headache gone, sits up surprised, ray sends a bill."}, {"f": "Some species of crow will steal food from other birds then eat it while watching where the other bird hid their food.", "a": "Crow eats stolen food while memorizing other crow's hiding spot, takes mental notes, crow operating a full ernal clock to compensate for the sun's movement.", "a": "Ant checking internal sundial, adjusting heading slightly, other ants following confidently, navigator ant very focussed."}, {"f": "The sea horse swims using its dorsal fin which beats up to 70 times per second.", "a": "Sea horse hovering in place, nothing visible moving, other fish amazed at the stillness, sea horse casually exhausted."}, {"f": "Some species of deep-sea shrimp eject bioluminescent fluid as a decoy when threatened.", "a": "Deep sea shrimp releases glowing cloud when attacked, glowing cloud distracts predator, shrimp escapes in the dark, predator very confused."}, {"f": "The pistol shrimp is so efficient at stunning prey it barely needs to chase anything.", "a": "Pistol shrimp sitting in burrow entrance, prey swims by, snap, prey floats to it, shrimp retrieves without moving, very efficient."}, {"f": "Some species of birds cache thousands of seeds and can remember each location for months.", "a": "Clark's nutcracker bird draws no map, stores 30000 seeds across mountain, retrieves them all in winter, google maps shaken."}, {"f": "The mantis shrimp club is made of a material so tough it absorbs strikes that would shatter any known human-made structure at that scale.", "a": "Engineer breaks every testing machine attempting to replicate mantis shrimp material, mantis shrimp watches calmly, sipping coffee."}, {"f": "Some species of octopus jet propel themselves backward so fast they can leap completely out of the water.", "a": "Octopus accelerates suddenly, shoots out of water, flies through air, lands back in splash, looks around, did anyone see that."}, {"f": "The horned lizard can increase its blood pressure dramatically when squirting blood from its eyes.", "a": "Horned lizard visits cardiologist, doctor shows blood pressure readings during defense display, doctor recommends relaxation, lizard explains the situation."}, {"f": "Some species of whale communicate using songs that travel thousands ietly rips up doctoral thesis, starts over."}, {"f": "Some species of fish communicate at frequencies too low for humans to hear, using infrasound to coordinate large groups.", "a": "School of fish moving in perfect synchrony, scientist checks audio equipment, detects nothing, fish politely buzzing instructions below human range."}, {"f": "The migratory godwit bird flies non-stop from Alaska to New Zealand, 12000 kilometres without eating or drinking.", "a": "Godwit buckles up for takeoff in Alaska, flight attendant announces 12000km non-stop, no meal service, bird nods, expected."}, {"f": "Some species of octopus build elaborate dens by collecting and arranging shells, rocks, and other objects.", "a": "Octopus on property website, finds den, starts renovating, collects shells for exterior, rocks for garden, very house-proud."}, {"f": "The pistol shrimp can sense water movement through specialized hairs and react faster than its own nervous system normally allows.", "a": "Pistol shrimp reacts to attack before registering it consciously, asks self what just happened, watches replay in slow motion."}, {"f": "Some species of bee can communicate the exact location of food to other bees through the waggle dance.", "a": "Bee returns to hive, does extremely specific waggle dance, other bees watch, all fly out and arrive at exact flower, very efficient."}, {"f": "The deep sea viperfish has teeth so large relative to its mouth it cannot close its jaws.", "a": "Viperfish tries to look menacing for selfie, cannot close mouth at all, keeps trying, gives up, opens wider instead."}, {"f": "Some species of crab stack up on each other in mating season forming towers of males competing for position.", "a": "Crabs stacking up, each trying to be at top, top crab very smug, bottom crab doing all the work, very stressful."}, {"f": "The pistol shrimp lives in monogamous pairs sharing a burrow with a nearly blind goby fish in a mutually beneficial arrangement.", "a": "Pistol shrimp and go rees around it nervously back away."}, {"f": "The hagfish can tie itself into a literal overhand knot and slide it down its body to escape predators.", "a": "Slimy hagfish calmly knots itself while confused shark watches, slides knot off tail and swims free."}, {"f": "The blobfish looks dignified and elegant underwater but collapses into a sad face when brought to the surface.", "a": "Dignified blobfish poses elegantly on seafloor, net hauls it up, face droops into puddle, it sighs deeply."}, {"f": "Wombats produce perfectly cube-shaped droppings as the only known animal to do this.", "a": "Wombat strolls through forest dropping perfect cubes, bewildered forest animals stack them into a tiny wall."}, {"f": "The Greenland shark reaches sexual maturity at around 150 years old and can live for 500 years.", "a": "Ancient shark with wizard beard floats past young sharks who part reverently, shark nods very very slowly."}, {"f": "Crows recognize individual human faces and pass this information to their offspring for generations.", "a": "Crow in detective hat pins human photo to corkboard, circles face, turns to camera, caws ominously."}, {"f": "The star-nosed mole has 22 pink tentacles on its nose and can identify and eat food in 25 milliseconds.", "a": "Star-nosed mole bursts through dirt, tentacles at turbo speed, inhales worm in blink, other moles applaud nervously."}, {"f": "The blue whale tongue is so enormous that 50 adult humans could stand on it comfortably.", "a": "Blue whale opens mouth at party, spots empty tongue space, sets up dance floor, 50 fish arrive immediately."}, {"f": "Butterflies taste everything they land on using chemical sensors located on their feet.", "a": "Butterfly lands on cake, does delighted tap dance, lands on lemon, recoils in horror and falls off dramatically."}, {"f": "Sloths can hold their breath longer than dolphins for up to 40 minutes by slowing their heart rate.", "a": "Sloth and dolphin at underwater breath contest, dolphin surfaces gasping, sloth still down there slowly chewing leaf."}, {"f": "Sea otters hold hands while sleeping so they cannot drift apart from their partners in currents.", "a": "Two sea otters reach sleepily for hands in the waves, one misses and drifts away screaming in slow motion."}, {"f": "Pigs cannot physically look upward at the sky due to the anatomy of their neck vertebrae.", "a": "Confident pig attempts to look at bird overhead, twists, strains dramatically, falls over sideways, bird laughs from above."}, {"f": "Vultures deliberately urinate on their own legs to kill bacteria and regulate their body temperature.", "a": "Vulture in sunglasses casually pees on own feet, other birds recoil dramatically, vulture adjusts shades, unbothered."}, {"f": "A chameleon tongue is longer than its entire body and strikes faster than any fighter jet.", "a": "Chameleon spots fly, pauses for drama, tongue ROCKETS out creating sonic boom, returns with fly still confused."}, {"f": "Narwhals use their spiral tusk to stun fish by tapping them rather than for fighting or display.", "a": "Dignified narwhal approaches fish, gently taps it on head with horn, fish slumps, narwhal nods politely and eats it."}, {"f": "Moose are naturally buoyant enough to swim for hours and have been spotted miles offshore in open ocean.", "a": "Moose strides confidently into ocean, surfers scatter, moose keeps walking with antlers above water looking perfectly calm."}, {"f": "The thorny devil lizard absorbs water through channels in its skin that carry moisture directly to its mouth.", "a": "Tiny lizard steps into puddle, looks bored, then skin starts audibly gulping, water visibly travels up body to mouth."}, {"f": "Koalas have fingerprints so similar to humans that crime scene investigators have been fooled by them.", "a": "Koala at crime scene pushes detective aside, presses finger to scanner, alarms go off, security tackles it by mistake."}, {"f": "Electric eels can leap partially out of water to electro tually a giant rodent that mates for life.", "a": "Two maras at romantic restaurant, one whispers I'm a rodent, other nods me too, they clink glasses happily."}, {"f": "Naked mole rats feel no pain from acid, never develop cancer, and survive 18 minutes with no oxygen.", "a": "Naked mole rat reads book calmly while acid drips on it, doctor gives cancer all-clear, holds breath through tunnel."}, {"f": "The vampire squid drifts in the deep ocean eating marine snow which is particles of dead organic matter.", "a": "Vampire squid in tiny tuxedo floats in darkness, marine snow flake drifts by, catches it on tiny fork, chef's kiss."}, {"f": "The geoduck clam lives over 160 years and has a neck that can extend more than a metre in length.", "a": "Ancient clam slowly extends absurdly long neck from sand, knocks over passing crab, crab picks itself up, walks on."}, {"f": "Polar bears have black skin under their white fur and the hollow transparent hairs channel sunlight for warmth.", "a": "Polar bear lifts tiny flap of white fur to reveal pitch-black skin, other polar bears gasp, bear winks at camera."}, {"f": "Elephants are the only animals known to be physically incapable of jumping even as young calves.", "a": "Baby elephant spots puddle, takes enormous run-up, attempts heroic leap, just waddles over it, checks if anyone saw."}, {"f": "Octopuses have three separate hearts and two of them shut down whenever the octopus tries to swim.", "a": "Octopus starts swimming confidently, two tiny hearts flatline on ECG monitor, octopus sits back down immediately."}, {"f": "Some species of ants keep herds of aphids like livestock, protecting them in exchange for honeydew.", "a": "Ant in cowboy hat herds aphids with tiny lasso, other ants milk them with microscopic buckets, very business-like."}, {"f": "The mudskipper is a fish that can climb trees and spends most of its time walking on land.", "a": "Mudskipper in hiking boots reaches top of palm tree, plants tiny flag, takes selfie, other fish below baffled."}, {"f": "Roosters have an anatomical mechanism that temporarily blocks their own hearing when they crow to protect them.", "a": "Rooster takes deep breath, tiny earplugs auto-deploy, COCK-A-DOODLE-DOO, earplugs retract, rooster looks satisfied."}, {"f": "The bowhead whale can live for over 200 years making it the longest-lived mammal known to science.", "a": "Ancient bowhead whale at birthday party gets asked for ID, slowly produces birth certificate from 1823, bouncer waves it through."}, {"f": "Octopuses can squeeze through any opening larger than their beak which is their only rigid body part.", "a": "Octopus approaches tiny crack, arms go through first, then body, then just beak pops out other side, then everything else."}, {"f": "Some dolphin populations teach their young to use sponges as protective tools while foraging.", "a": "Dolphin mom fits tiny sponge helmet on baby dolphin, baby looks at camera, both dive for seafloor confidently."}, {"f": "Some species of wasp can recognize and remember the individual faces of other wasps for months.", "a": "Wasp at conference checking badges, spots one in disguise, stares closely, removes badge, gotcha Reginald, security arrives."}, {"f": "Some crow populations use cars as tools to crack hard-shelled nuts by placing them on roads at crosswalks.", "a": "Crow in tiny construction vest places nuts at crosswalk scientifically, monitors impact results, takes notes, very efficient."}, {"f": "Some damselfish cultivate algae gardens by weeding out undesirable species and aggressively defending the plot.", "a": "Tiny damselfish in gardening gloves tends algae plot, waves enormous parrotfish away, parrotfish very confused by the nerve."}, {"f": "The leafy sea dragon is such a convincing leaf mimic that it went unrecognized as an animal for many years.", "a": "Marine biologist cataloguing leaves picks up leafy sea dragon, puts it down, keeps cataloguing, sea dragon winks."}, {"f": "Some deep sea squid can voluntarily detach their own arm as a decoy to escape from predators.", "a": "Deep sea squid spots predator, calmly unscrews one arm, hands it over politely, tips invisible hat, glides away."}, {"f": "Wombat burrows are so well engineered that other animals shelter in them during wildfires.", "a": "Wombat presents burrow blueprints, builds it expertly, puts up no pets sign, other animals move in immediately."}, {"f": "The seahorse is the only animal species in which males become pregnant and give birth to offspring.", "a": "Male seahorse waddles around extremely pregnant, female seahorse sits nearby reading magazine looking completely relaxed."}, {"f": "Some species of sea slug steal the stinging cells from jellyfish they eat and use them for their own defense.", "a": "Sea slug eats jellyfish, immediately sprouts stinging cells, flexes them experimentally, looks directly at nearby predator."}, {"f": "The leafcutter ant does not eat the leaves it carries but uses them to cultivate underground fungus gardens.", "a": "Leafcutter ant in chef's hat harvests leaves carefully, arranges them in underground greenhouse, tends mushrooms with watering can."}, {"f": "The coelacanth fish was thought extinct for 65 million years until a live specimen appeared in a South African fish market.", "a": "Fisherman pulls up net, coelacanth emerges looking confused, scientist running from harbour, coelacanth baffled by the fuss."}, {"f": "Some octopus species practice play behaviour by repeatedly releasing objects into water currents and retrieving them.", "a": "Octopus drops rubber ball into current, catches it, grins, does it again, does it again, very pleased."}, {"f": "The jumping spider can see in four spectral ranges simultaneously including ultraviolet while hunting.", "a": "Jumping spider approaches fly in full tactical mode, thermal UV regular and polarized all active, fly has no chance."}, {"f": "The arctic tern completes a 70000 kilometre annual migration from the Arctic to ro to 150 degrees Celsius.", "a": "Tardigrade on thermometer commercial, shown at absolute zero, shown in boiling water, waves cheerfully from both."}, {"f": "Some species of fish breathe air using a modified swim bladder when water oxygen levels drop too low.", "a": "Fish notices low oxygen warning, pops up to surface, takes a breath, goes back down, very casual about it."}, {"f": "Some species of octopus have been filmed bringing coconut halves from one location and using them later as shelter.", "a": "Octopus finds coconut half at shop, pays, carries it 50 metres home, assembles it into house, puts kettle on."}, {"f": "Some species of cleaner shrimp set up cleaning stations and advertise their services with a dance to attract clients.", "a": "Cleaner shrimp puts up neon sign, does advertising dance, enormous grouper joins queue, receptionist hands out towels."}, {"f": "Some species of parrot can count objects accurately up to six and may understand basic quantity concepts.", "a": "Parrot at maths test counts objects on table, marks answer sheet, gets perfect score, requests harder test."}, {"f": "Some species of gecko run across the surface of water for short distances using hydrophobic feet and rapid motion.", "a": "Gecko approaches pond, builds up speed on bank, runs across water surface legs blurring, reaches other side, collapses."}, {"f": "Some species of crow solve multi-step problems requiring them to use one tool to obtain another tool to get food.", "a": "Crow presented with box requiring two tools, gets first tool, uses it to get second, uses second to get food, bows."}, {"f": "The tardigrade can remain viable in a cryptobiotic state for decades and then fully revive when conditions improve.", "a": "Tardigrade from 1990s gets rehydrated in lab, stretches, looks around, asks what it missed, gets a summary."}, {"f": "Some species of sand dollar burrow rapidly into sand when threatened leaving no trace on the surface.", "a": "Sand dollar spots predator, tilts sideways, drills into sand in two seconds, surface completely smooth, predator baffled."}, {"f": "Some species of crab wave their claws in species-specific patterns to communicate with potential mates.", "a": "Fiddler crab waves enormous claw in specific rhythm, neighbouring crab evaluates performance, gives score out of ten."}, {"f": "Some species of bird remember the individual faces of humans who have disturbed or helped them for years.", "a": "Sparrow spots person who moved its nest last spring, follows them through park, narrows eyes, this one."}, {"f": "Some species of bees make their nests inside snail shells, using pieces of leaf to cap each section.", "a": "Bee measures snail shell for fit, approves dimensions, begins converting interior, posts tiny estate agent sign outside."}, {"f": "The star-nosed mole is blind but touches the world faster than any other known animal through its star appendage.", "a": "Star-nosed mole enters touch speed competition, judges wave start flag, mole's nose a blur, result instantaneous, winner."}, {"f": "Some species of gorilla have been observed using sticks as tools to test the depth of water before crossing.", "a": "Gorilla approaches stream, finds stick, measures depth at several points, marks shallowest crossing, leads family across."}, {"f": "Some species of hummingbird can enter a state so close to death during torpor that they have been mistaken for corpses.", "a": "Hummingbird found motionless, put in shoebox, given small ceremony, morning comes, hummingbird zooms out of box."}, {"f": "Some species of wrasse fish change sex from female to male when the dominant male in their group disappears.", "a": "Male wrasse disappears, all females look at each other, a pause, largest one takes a deep breath, transformation begins."}, {"f": "Some species of salamander can learn to navigate a maze and remember the solution for six months.", "a": "Salamander walks maze first time, pauses at each junction, six months later walks back in, solves it perfectly."}, {"f": "Some species of crow recognize and respond appropriately to the calls of over 30 different species of other birds.", "a": "Crow overhears bird song from thicket, identifies species immediately, looks up their reputation in mental database, adjusts accordingly."}, {"f": "Some species of sea slug hunt by stinging jellyfish and then storing their unfired stinging cells for later use.", "a": "Sea slug attacks jellyfish, carefully removes stinging cells with tiny tongs, files them in labelled organizer for later."}, {"f": "Some species of fish recognize themselves in a mirror, a sign of self-awareness previously thought unique to primates.", "a": "Cleaner wrasse looks in mirror, inspects mark on body, attempts to remove it, realizes it is on its own body, pauses."}, {"f": "Some species of octopus engage in what appears to be play fighting with each other when no food is involved.", "a": "Two octopuses grappling in slow motion, no food nearby, both smiling, referee octopus watches from a rock."}, {"f": "Some species of firefly communicate species identity and availability through highly specific flash patterns.", "a": "Firefly practicing flash pattern in mirror, checking species guide, nails it, flies out into field, immediately answered."}, {"f": "Some species of corvid understand what other birds know and do not know and exploit this in food caching.", "a": "Crow hides food only from corvids who are smart enough to steal it, gives simpler birds a pass, complex social calculations."}, {"f": "Some species of heron use bait, deliberately placing objects on water to lure fish within striking range.", "a": "Heron places bread crust on water, steps back, waits, fish approaches bread, heron strikes, collects fish, collects bread."}, {"f": "Some species of deep sea fish use counterillumination to match the light from above and become invisible from below.", "a": "Deep sea fish checks upward light level, adjusts belly bioluminescence to match exactly, disappears from below, nods."}, {"f": "Some species of spider build decoys of themselves in their webs from debris to confuse predators.", "a": "Spider builds convincing spider-shaped dummy from leaf debris, places it in web, moves to edge, predator attacks dummy."}, {"f": "Some species of reef squid flash coordinated synchronized displays across groups of dozens of individuals.", "a": "School of reef squid on talent show stage, director counts in, perfectly synchronized light display, judges very impressed."}, {"f": "Some species of termite cultivate fungus gardens that are so well managed the fungus cannot survive outside the colony.", "a": "Termite fungus farmer presents crop, notes it is entirely dependent on colony management, fungi nod in agreement."}, {"f": "Some species of whale can learn songs from other groups of whales through social transmission across ocean basins.", "a": "Humpback whale hears distant song, takes notes, practices for weeks, sings it back at next gathering, everyone nods."}, {"f": "Some species of octopus have been observed selecting rocks specifically shaped to cover their den entrance.", "a": "Octopus auditioning rocks for den entrance, rejects oval, rejects too big, rejects too small, accepts perfect circular one."}, {"f": "Starfish have no brain and no blood — they pump seawater through their bodies instead.", "a": "Starfish at brain doctor, doctor points at X-ray showing empty head, starfish shrugs, perfectly fine."}, {"f": "A blue whale's heart is the size of a small car and beats just twice per minute.", "a": "Tiny car-sized heart lowered into whale by crane, whale starts up, boom boom, sails off."}, {"f": "Octopuses have three hearts and blue blood that runs through all of them.", "a": "Octopus at blood donation, holds out arm, nurse looks at blue blood, looks at form, looks back, proceeds."}, {"f": "Male seahorses carry the pregnancy and give birth to the young.", "a": "Heavily pregnant male seahorse waddles past relaxed female reading a magazine, male side-eyes her."}, {"f": "Jellyfish are 95 percent water and have no bones, no brain, and no heart.", "a": "Jellyfish fills out job application, lists qualifications: 95% water, no brain, no heart, gets hired immediately."}, {"f": "The pistol shrimp can create a pressure wave with its claw hotter than the surface of the sun.", "a": "Pistol shrimp lights birthday candle with one snap, candle, cake, and table vaporize, shrimp gets new cake."}, {"f": "Hummingbirds are the only birds that can fly backwards.", "a": "Hummingbird at air show flies loop, then reverses direction, crowd gasps, other birds look at their feet."}, {"f": "Crows can recognize individual human faces and remember for years which ones are dangerous.", "a": "Crow in detective hat adds photo to wall, draws red circle, turns to camera, caws ominously."}, {"f": "Albatrosses can fly above the ocean for years at a time without ever landing.", "a": "Albatross sets autopilot, pulls out sleep mask, snores, wakes up three years later, still perfectly on course."}, {"f": "Owls have tube-shaped eyes they cannot move, so they must rotate their entire head to look around.", "a": "Owl tries to look sideways, head spins 270 degrees dramatically, other birds very uncomfortable."}, {"f": "Peregrine falcons reach speeds of over 380 kilometres per hour during a hunting dive.", "a": "Peregrine falcon at speed radar, officer clocks it, radar gun explodes, falcon long gone."}, {"f": "Wombats produce cube-shaped droppings so they do not roll away from their marking spots.", "a": "Wombat drops perfect cube, other animals stare, wombat shrugs, stacks another on top."}, {"f": "Elephants are the only mammals physically incapable of jumping even as babies.", "a": "Baby elephant takes enormous run-up, attempts heroic leap, just waddles over puddle, looks around embarrassed."}, {"f": "A koala's fingerprints are nearly identical to a human's and have confused crime scene investigators.", "a": "Koala at crime scene pushes detective aside, touches scanner, alarms go off, gets tackled by security."}, {"f": "Snails can sleep continuously for up to three years during extreme drought conditions.", "a": "Snail checks forecast, sees drought, sets three-year alarm, tucks into shell, calendar pages fly past."}, {"f": "A grizzly bear has enough bite force to crush a bowling ball with its jaws.", "a": "Grizzly at bowling alley ignores the lane, picks up ball, bites it, hands fragments to confused staff."}, {"f": "Chameleons can move their eyes independently giving them a full 360-degree field of view.", "a": "Chameleon at tennis match, one eye watches left, one eye watches right, head perfectly still, very efficient."}, {"f": "Ants do not sleep properly but take hundreds of short power naps throughout the day.", "a": "Ant collapses mid-stride for 0.8 seconds, pops back up, keeps walking, does this 200 more times."}, {"f": "Houseflies taste their food with their feet the moment they land on any surface.", "a": "Fly lands on cake, legs go wide, disgusted face, tries birthday candle, even worse, tries salad, finally happy."}, {"f": "The combined weight of all termites on Earth exceeds the combined weight of all humans.", "a": "Termite and human on giant scales, termites keep coming, human side slowly rises, termites look smug."}, {"f": "Mosquitoes are more attracted to people who have recently eaten bananas.", "a": "Person eats banana, mosquitoes in nearby bush nudge each other, adjust tiny binoculars, nod in agreement."}, {"f": "Otters hold hands while sleeping so they do not drift apart from each other in the current.", "a": "Two otters reach for each other sleepily in the waves, one misses, drifts away screaming in slow motion."}, {"f": "Dolphins sleep with only half their brain at a time and keep one eye open to watch for danger.", "a": "Dolphin at slumber party, one eye closed, one eye scanning room, other dolphins completely out cold."}, {"f": "Cows have best friends within their herd and become visibly stressed when separated from them.", "a": "Cow separated from best friend, immediately starts stress-eating, best friend visible in next field looking equally upset."}, {"f": "Flamingos are born grey and only turn pink from the pigments in the algae and shrimp they eat.", "a": "Grey baby flamingo takes one bite of shrimp, one feather turns pink, takes another, going full flamingo."}, {"f": "Goldfish have no stomach and food passes directly into their intestines without digestion.", "a": "Goldfish drops food in mouth, lifts chin to show food sliding straight through with cartoon whoosh."}, {"f": "Butterflies taste with their feet to check whether a leaf is suitable for laying their eggs on.", "a": "Butterfly lands on leaf, legs go wide, nods approvingly, stamps leaf with tiny approved sticker."}, {"f": "A cockroach can survive for up to a week without its head before eventually dying of thirst.", "a": "Cockroach loses head in accident, checks calendar, runs 7 errands headlessly, collapses on day 8."}, {"f": "Frogs do not drink water through their mouth but absorb it directly through their skin.", "a": "Frog in desert ignores water bottle, steps into puddle, sits down, immediately rehydrated, very efficient."}, {"f": "Sharks are the only fish that can blink with both eyes at the same time.", "a": "Shark at underwater talent show blinks both eyes simultaneously, fish audience gasps, shark takes bow."}, {"f": "A shrimp's heart is located inside its head.", "a": "Shrimp doctor examines patient, points at chest, patient shakes head and points at own face, doctor consults textbook."}, {"f": "Cats can produce over one hundred distinct vocal sounds while dogs can only manage around ten.", "a": "Cat warming up at vocal coach, runs through 100 sounds, dog next in line practising its ten, looks nervous."}, {"f": "The tongue of a blue whale weighs as much as an entire adult elephant.", "a": "Blue whale opens mouth at party, enormous tongue flops out, lands on elephant standing nearby, whale looks embarrassed."}, {"f": "Vultures have stomach acid so powerful they can digest anthrax and cholera without any ill effects.", "a": "Vulture at hazmat site reading menu of dangerous bacteria, orders the lot, other birds watching in disbelief."}, {"f": "Bats almost always turn left when exiting a cave, regardless of where they were roosting.", "a": "Bat at cave exit, pauses, turns left, scientist with clipboard makes tick, happens again, and again, every time."}, {"f": "Giant oysters can change their biological sex multiple times throughout their lives.", "a": "Oyster fills out form, crosses one box, ticks another, clerk stamps it without looking up, happens again next year."}, {"f": "Lions sleep for up to twenty hours a day to conserve the energy needed for hunting.", "a": "Lion alarm goes off, lion opens one eye, turns it off, sleeps four more hours, does this six times."}, {"f": "A tarantula can survive for up to two full years with absolutely no food at all.", "a": "Tarantula at restaurant, declines menu, waiter confused, tarantula checks calendar, has not eaten since last year, perfectly fine."}, {"f": "A beaver's teeth never stop growing so they must constantly gnaw wood to wear them down.", "a": "Beaver at dentist, dentist measures teeth, measures again, asks if beaver has been skipping wood-chewing, beaver looks guilty."}, {"f": "Dogs only sweat through the small pads on the underside of their paws.", "a": "Dog on hot day, feet leaving tiny sweaty footprints, tongue out, paws going damp, very confused about the situation."}, {"f": "Rabbits can see almost completely behind themselves without turning their head at all.", "a": "Rabbit sitting perfectly still, sneaky fox approaches from behind, rabbit says hello fox without turning around, fox panics."}, {"f": "The ocean quahog clam can live for over five hundred years making it one of the longest-lived animals known.", "a": "Ancient clam asked its age, slowly opens, takes deep breath, begins listing the centuries, scientist sits down."}, {"f": "Zebra stripes are completely unique to each individual like human fingerprints.", "a": "Zebra at police station getting stripes scanned, officer confirms no match in database, zebra very pleased."}, {"f": "The narwhal's spiral tusk is actually an overgrown left canine tooth that can reach three metres.", "a": "Narwhal at dentist, dentist measures tusk with tape measure, runs out of tape, gets extension."}, {"f": "Polar bears have black skin under their white fur to absorb heat more effectively from the sun.", "a": "Polar bear lifts tiny flap of white fur to reveal pitch-black skin, other polar bears gasp, bear winks."}, {"f": "Kangaroos cannot walk backwards because of the way their powerful hind legs and tail are structured.", "a": "Kangaroo tries to reverse into parking space, impossible, takes 27-point turn forward instead, cars beeping."}, {"f": "Goats have rectangular pupils giving them an extremely wide field of vision to spot predators.", "a": "Goat in sunglasses stands still while absolute chaos erupts around it, sees everything, chews calmly."}, {"f": "Leeches have 32 separate brain centres distributed throughout their body.", "a": "Leech at neuroscience conference presenting self as case study, scientists taking rapid notes, leech very pleased."}, {"f": "The blue-ringed octopus carries enough venom to kill 26 adult humans and there is no antidote.", "a": "Blue-ringed octopus holds up warning sign reading extremely dangerous, adds please be careful, looks genuinely concerned."}, {"f": "An ostrich's eye is larger than its entire brain.", "a": "Ostrich takes eye exam and IQ test on same day, eye gets perfect score, brain paper left mostly blank."}, {"f": "A cheetah's coat has solid black spots while a leopard has rosette-shaped markings.", "a": "Cheetah and leopard at pattern comparison booth, cheetah points at spots proudly, leopard shows rosettes, judge still confused y loose neck skin so they can turn around inside their own skin to bite attackers.", "a": "Predator grabs sun bear by neck, sun bear rotates 180 degrees inside own skin, faces attacker, predator releases."}, {"f": "Sloth bears have no front teeth leaving a perfect gap to vacuum insects directly into their mouths.", "a": "Sloth bear approaches termite mound, presses nose to entrance, inhales dramatically, mound completely empty in seconds."}, {"f": "Giant pandas secrete an oily fluid to mark their territory by rubbing it onto bamboo stems.", "a": "Panda at bamboo trunk, gets out tiny spray bottle, realizes it makes its own, applies methodically, nods."}, {"f": "The red panda uses its long fluffy tail as a pillow and a face warmer while sleeping.", "a": "Red panda wraps tail around face for sleep, alarm goes off, tail unwraps, shakes off, perfectly cozy."}, {"f": "Raccoons have excellent memories and can remember the solution to a complex puzzle for up to three years.", "a": "Raccoon solves puzzle box at lab, three years later walks in, solves it instantly, researcher speechless."}, {"f": "White-nosed coatis are active during the day and live in groups of up to thirty while males are solitary.", "a": "Large coati group having brunch, lone male watches from distance, pretends he chose this, clearly did not."}, {"f": "Kinkajous have a tongue up to twelve centimetres long for licking honey and nectar from flowers.", "a": "Kinkajou at flower, extends tongue slowly, keeps extending, other animals watching get increasingly uncomfortable."}, {"f": "Badgers have a distinctive black and white striped head that acts as a warning signal to predators.", "a": "Badger walks into clearing, predators see the stripes, collectively step back, badger walks through unbothered."}, {"f": "Honey badgers often follow honeyguide birds to find and break open bee nests.", "a": "Honey badger and tiny bird shake hands at start of shift, bird finds hive, badger smashes it, both get paid."}, {"f": "Pine martens have a yellow throat patch while stone martens have a white forked one.", "a": "Pine marten and stone marten at fancy dress comparing throat patches, each convinced theirs is better."}, {"f": "Stone martens frequently nest inside roof insulation and wall cavities of houses.", "a": "Stone marten rings doorbell, owner answers, marten holds up tiny moving boxes, owner sighs and steps aside."}, {"f": "A stoat can become invisible to predators if it turns completely white in winter but snow never arrives.", "a": "Stoat turns brilliant white for winter, no snow comes, stands in green field looking absolutely furious."}, {"f": "Weasels hunt mainly on voles and can enter mouse tunnels easily thanks to their extremely slender bodies.", "a": "Weasel measures tunnel opening with tiny tape, nods, zips through effortlessly, vole on other end very surprised."}, {"f": "Polecats sometimes roll frogs in mud to scrub off their toxic skin secretions before eating them.", "a": "Polecat catches frog, holds up mud, frog sighs, polecat rolls it thoroughly, frog now muddy but frog is definitely getting eaten."}, {"f": "Ferrets can squeeze through the tiniest gaps because their ribcage is extremely flexible and compressible.", "a": "Ferret approaches door with 1cm gap, flattens like paper, slides through, pops back to normal on other side."}, {"f": "European otters mark their territory with droppings that smell distinctly of fresh cut grass or jasmine.", "a": "Otter leaves marking, passing animals stop, sniff, look confused, one pulls out a bouquet to compare."}, {"f": "Sea otters sometimes wrap themselves in kelp so they do not drift away while sleeping on the ocean.", "a": "Sea otter finds kelp strand, wraps it round three times, sets up pillow, nods off, current has zero effect."}, {"f": "Skunks are immune to their own smell but are careful never to spray and soil their own fur.", "a": "Skunk sprays threat, immediately steps to side to avoid its own cloud, adjusts position, very hygienic."}, {"f": "Seals have short flippered hands with nails that give them grip on slippery wet rocks.", "a": "Seal approaching wet rock, extends flipper, nails click on rock surface, pulls itself up confidently, other seals impressed."}, {"f": "Common seal pups can swim from birth, unlike grey seal pups which must wait before entering the water.", "a": "Common seal pup born, immediately dives in, grey seal pup watches from beach, mum says not yet."}, {"f": "Grey seals pup in the middle of winter in December and January right on exposed sandbanks.", "a": "Grey seal pup born in December blizzard on a sandbank, blinks, this is fine, mum nods approvingly."}, {"f": "The hooded seal has the shortest nursing period of any mammal with pups drinking milk for only four days.", "a": "Hooded seal pup handed a four-day calendar at birth, both mum and pup look at it, then at each other."}, {"f": "Leopard seals have a streamlined head and razor teeth for skinning penguins alive underwater.", "a": "Penguin swimming happily, leopard seal appears behind it with clearly bad intentions, penguin swims faster."}, {"f": "Walruses have skin up to four centimetres thick that protects them from the tusks of rivals.", "a": "Two walruses clash tusks, both bounce off each other's thick hide, shrug, try again, same result."}, {"f": "California sea lions can reach speeds of up to forty kilometres per hour underwater.", "a": "Sea lion at underwater speed trap, officer clocks it, cannot believe reading, sea lion is already long gone."}, {"f": "Northern fur seals have bare patches on the back of their flippers to release excess body heat through blood flow.", "a": "Northern fur seal fans flipper backs at camera, explains the cooling system, other seals very impressed."}, {"f": "Male elephant seals fight bloody battles on the beach to claim a harem of up to a hundred females.", "a": "Two enormous male elephant seals square up, referee blows whistle, absolute chaos, hundred females watching unimpressed."}, {"f": "The trunk-like nose of an elephant seal acts as a moisture trap recycling water while breathing on land.", "a": "Elephant seal steps onto beach, enormous nose inflates, breathes out without losing a drop, very water-efficient."}, {"f": "Dolphins give each other unique whistle tones that function as names to call one another.", "a": "Dolphin makes specific whistle, across the bay another dolphin's head pops up, that's my name."}, {"f": "Bottlenose dolphins can leap up to six metres out of the water.", "a": "Dolphin approaches surface at speed, launches six metres into air, lands perfectly, other dolphins applaud."}, {"f": "Orcas are the only natural predators of moose when they swim between islands in North America.", "a": "Moose confidently enters water to cross to island, orca surfaces, moose immediately reconsiders the whole plan."}, {"f": "Sperm whales sleep vertically just beneath the surface like enormous floating logs.", "a": "Ship navigator spots group of vertical whales, marks them on chart as logs, whale opens one eye."}, {"f": "Male narwhals may use their tusk to sense water temperature and salt levels as well as for display.", "a": "Narwhal dips tusk in water, reads readout, nods, temperature fine, salinity fine, continues journey."}, {"f": "Common dolphins live in groups sometimes numbering in the thousands called a megaschool.", "a": "Dolphin navigator plots route through megaschool, gives up, there are just too many, goes around."}, {"f": "Harbour porpoises have a blunt snout and a small triangular dorsal fin that barely shows above water.", "a": "Porpoise surfaces briefly, tiny fin appears for half a second, dives, bird watching group argues over what it was."}, {"f": "Amazon river dolphins have a flexible neck that lets them turn their head 90 degrees to navigate between flooded trees.", "a": "River dolphin swimming through flooded forest, head rotates left then right, ducking branches, absolutely nailing it."}, {"f": "Blue whales communicate at such low frequencies that their calls can travel across an entire ocean.", "a": "Blue whale calls across Pacific, other blue whale answers three hours later, both nod, long distance relationship."}, {"f": "Humpback whales slap their enormous pectoral fins on the water surface to communicate with others.", "a": "Humpback whale slaps fin on water surface, enormous splash, whale miles away gets the message immediately."}, {"f": "Bowhead whales have an extremely reinforced skull that can break through ice thirty centimetres thick.", "a": "Bowhead whale approaches ice sheet, lowers head, runs at it, ice shatters, whale surfaces on other side."}, {"f": "Grey whales are often completely covered in barnacles and whale lice over their entire skin surface.", "a": "Grey whale at spa asks for deep clean, technician looks at the barnacle coverage, books extra sessions."}, {"f": "The dwarf minke whale has a distinctive white band across its pectoral fins.", "a": "Dwarf minke whale shows off white fin bands at underwater fashion show, other whales very envious."}, {"f": "Horses have the largest eyes of any land mammal in the world.", "a": "Horse at optometrist, doctor holds up chart, cannot find frame big enough for the glasses, everyone apologizes."}, {"f": "Przewalski's horses have 66 chromosomes while domestic horses have only 64.", "a": "Przewalski's horse at genetics lab, results come back, lab technician counts twice, horse shrugs."}, {"f": "Donkeys often refuse to go somewhere if they sense danger, which is wrongly called stubbornness.", "a": "Donkey stops at suspicious bridge, owner pulls, donkey unmoved, bridge collapses, donkey walks around, owner apologizes."}, {"f": "Zebras are black with white stripes, not white with black stripes, as shown by the embryo's development.", "a": "Science class, teacher reveals zebras are black with white stripes, class gasps, one student faints."}, {"f": "Tapirs are excellent swimmers and often dive underwater to escape predators like jaguars.", "a": "Jaguar chasing tapir, tapir hits river, dives and disappears, jaguar stares at water, completely outsmarted."}, {"f": "Indian rhinos have deep skin folds filled with flexible tissue that allow free movement despite their armoured appearance.", "a": "Indian rhino does yoga, skin folds accommodating every pose perfectly, instructor very impressed."}, {"f": "White rhinos get their name from a mistranslation of the Afrikaans word for wide lip, not from their colour.", "a": "White rhino at naming ceremony, translator announces wide-lip rhino, everyone mishears white, shrug, sticks."}, {"f": "Black rhinos are considerably more aggressive and quick to charge than the larger white rhinos.", "a": "Black rhino and white rhino at anger management class, black rhino charges through the door, white rhino fills in form."}, {"f": "Hippos can seal their ears and nostrils completely watertight when submerged.", "a": "Hippo at underwater meeting, ears and nose close with cartoon pop, nods confidently, stays as long as needed."}, {"f": "Pygmy hippos sweat a clear substance rather than the reddish fluid produced by the common hippo.", "a": "Common hippo and pygmy hippo at spa, common hippo dripping red, pygmy hippo neat and clear, both puzzled."}, {"f": "Wild boars live in groups called sounders led by an experienced sow.", "a": "Sounder of boars arrives at forest clearing, experienced sow consults mental map, makes decision, all follow."}, {"f": "Warthogs have large calluses on their knees that protect them while kneeling to dig for roots.", "a": "Warthog drops to kneeling position to dig, kneecap calluses click satisfyingly on ground, very comfortable."}, {"f": "Babirusa pigs have tusks that curve so far back they can eventually pierce their own skull if not worn down.", "a": "Babirusa at dentist, dentist studies tusk trajectory, pulls out calculator, recommends urgent grinding."}, {"f": "Camels have three eyelids and two rows of long lashes to protect their eyes from blowing sand.", "a": "Sandstorm hits, camel calmly deploys three eyelids in sequence, opens all at end, perfect visibility."}, {"f": "Dromedary camels can let their body temperature rise to 41 degrees Celsius to avoid sweating and losing water.", "a": "Camel in desert turns internal thermostat up, stops sweating, other animals dripping, camel nods, efficient."}, {"f": "Llamas have flexible soles with nails rather than hooves so they cause less damage to mountain paths.", "a": "Llama and horse walk same mountain path, horse leaves craters, llama treads perfectly, path preserved."}, {"f": "Alpacas have a strong preference for a fixed toilet corner in the field to reduce parasite spread.", "a": "Alpaca arrives at new field, surveys area, selects corner, builds tiny sign, routine established immediately."}, {"f": "Guanacos can survive the extreme cold and arid conditions of Patagonia.", "a": "Guanaco in Patagonia blizzard, checks thermometer, shrugs, pulls up collar, keeps walking."}, {"f": "Vicuñas were captured, sheared, and released by the Inca because their wool was worth its weight in gold.", "a": "Inca official approaches vicuña with shears, vicuña sighs, steps forward, holds still, shear, released, see you next year."}, {"f": "Red deer have impressive antlers covered in velvet skin during growth that they shed each year.", "a": "Red deer grows antlers all spring covered in velvet, strips it off in autumn, shakes head impressively."}, {"f": "Roe deer have the unique ability to pause embryo development for months after mating before pregnancy continues.", "a": "Roe deer embryo receives notification: growth paused until further notice, settles in, reads tiny book."}, {"f": "Moose have a large hanging flap of skin under their throat called a bell or dewlap.", "a": "Moose at formal event, flap swings with every step, other animals cannot stop staring, moose oblivious."}, {"f": "Reindeer are the only mammals that can see ultraviolet light allowing them to spot food beneath the snow.", "a": "Reindeer wearing UV glasses scans snowfield, lichens appear highlighted below, removes glasses, nods, dinner found."}, {"f": "Fallow deer perform a warning display called pronking by jumping into the air on all four legs at once.", "a": "Fallow deer spots threat, launches into air on all four legs simultaneously, bounces away, predator very confused."}, {"f": "Giraffes sleep as little as twenty minutes to two hours a day split into brief naps.", "a": "Giraffe sets alarm for 20 minutes, sleeps deeply, alarm goes off, immediately alert, fully rested, carries on."}, {"f": "Okapis have a tongue so long they can clean their own eyes and ears with it.", "a": "Okapi gets dust in eye, extends tongue upward, wipes eye clean, closes mouth, other animals speechless."}, {"f": "Cattle chew their cud by regurgitating partially digested grass from their rumen to chew again.", "a": "Cow finishes dinner, pauses, grass returns from stomach, cow chews thoughtfully, swallows again, very content."}, {"f": "Buffalo have a massive fused horn base on their forehead forming an impenetrable shield called the boss.", "a": "Lion aims for buffalo head, bounces off the boss, looks at paw, looks at buffalo, very different plan."}, {"f": "Yaks produce extremely fatty milk to protect calves from intense cold at high altitude.", "a": "Yak calf takes first sip, immediately looks warmer, thermometer rises, calf gives satisfied nod."}, {"f": "Bison have a large muscle-filled hump on their back for pushing their heavy head through deep snow.", "a": "Bison approaches snowdrift, lowers head, hump powers the push, snow flies, bison keeps walking."}, {"f": "European bison are the largest land mammals in Europe and live mainly in dense mixed forests.", "a": "European bison strolls into forest, signs reading largest land mammal in Europe along the path, nods."}, {"f": "Chamois have hooves with a hard outer edge and a soft inner pad for maximum grip on steep rock.", "a": "Chamois at climbing gym, hooves grip tiny holds effortlessly, human climbers watching with serious envy."}, {"f": "Alpine ibex can scale almost vertical dam walls to lick minerals from the stone surface.", "a": "Ibex approaches vertical dam, starts climbing, other animals watch from base, ibex reaches top, licks stone."}, {"f": "Musk oxen form a tight defensive circle with horns pointing outward when threatened, calves in the middle.", "a": "Wolves approach musk oxen, herd locks into circle formation instantly, horns out, calves safe, wolves reassess."}, {"f": "Goats have excellent balance and can stand on the narrowest branch tips or rock points without falling.", "a": "Goat on impossibly thin branch, wind blowing, eating leaves calmly, other animals below watching through fingers."}, {"f": "Mouflon are the wild ancestors of all our domestic sheep breeds.", "a": "Mouflon at family reunion, points at woolly sheep, says that is my descendant, sheep looks embarrassed."}, {"f": "Kangaroos cannot jump if their tail is not in contact with the ground as it acts as a spring.", "a": "Kangaroo tries to jump with tail lifted, goes nowhere, looks down, lowers tail, bounces immediately."}, {"f": "Red kangaroos can reach speeds of over sixty kilometres per hour at full hop.", "a": "Red kangaroo at speed camera, camera reads 62kph, kangaroo gives thumbs up mid-bounce."}, {"f": "Wallabies have shorter hind legs making them far more agile in dense scrubland than kangaroos.", "a": "Kangaroo and wallaby enter thick bush, kangaroo gets stuck immediately, wallaby darts through, turns and waves."}, {"f": "Tree kangaroos can leap up to nine metres down from a tree without injury.", "a": "Tree kangaroo at top of tree, measures distance, nods, launches off, lands perfectly, bounces once."}, {"f": "Koalas have two thumbs on each front paw to grip branches with extra strength.", "a": "Koala grips branch with both double-thumbed paws, wind picks up, koala completely unmoved, very secure."}, {"f": "Wombat droppings are so dry that the cube-shaped pellets can be stacked neatly on top of each other.", "a": "Wombat drops cube, another lands on top perfectly, and another, and another, small tower forming, wombat inspects it."}, {"f": "Bandicoots have one of the shortest gestation periods of any mammal at just twelve days.", "a": "Bandicoot checks pregnancy calendar, circles day twelve, doctor confirms, bandicoot puts kettle on immediately."}, {"f": "Sugar gliders get their name from their love of sweet foods like nectar and eucalyptus sap.", "a": "Sugar glider at dessert table, bypasses everything savoury, finds the honey bowl, sits down, fully committed."}, {"f": "Tasmanian devils open their jaws terrifyingly wide when they yawn, which signals stress rather than tiredness.", "a": "Tasmanian devil yawns in vet waiting room, everyone shuffles their chairs back slightly, devil looks apologetic."}, {"f": "The thylacine could open its jaw up to an extraordinary 120 degrees wide.", "a": "Scientist studies old thylacine footage, measures jaw angle, puts ruler down slowly, writes 120 degrees, stares."}, {"f": "Platypuses hunt with eyes, ears, and nostrils shut and detect prey purely through electric signals in their bill.", "a": "Platypus blindfolds itself, earplugs in, nose closed, dives, finds every shrimp perfectly, comes up, shrugs."}, {"f": "Echidnas have a single body opening called a cloaca for waste and reproduction just like birds and reptiles.", "a": "Echidna at biology class, teacher asks what makes a mammal, echidna raises hand, everyone looks, class restarts."}, {"f": "Giant anteaters have claws sharp enough to defend themselves against a jaguar.", "a": "Jaguar approaches giant anteater confidently, anteater raises claw, jaguar stops, recalculates, walks away."}, {"f": "Two-toed sloths have more neck vertebrae than most mammals allowing them to rotate their head far around.", "a": "Two-toed sloth slowly rotates head to watch a fly, takes forty seconds, fly long gone, sloth continues rotating."}, {"f": "Armadillos almost always give birth to identical quadruplets from a single fertilized egg.", "a": "Armadillo at ultrasound, doctor counts four identical readings, looks at armadillo, armadillo already knew."}, {"f": "Pangolins curl into a sharp ball when threatened and the edges of their scales are razor sharp.", "a": "Predator tries to uncurl pangolin, cuts paw immediately, bandages paw, tries other side, same result."}, {"f": "African elephants fan their enormous ears to cool blood before circulating it back through their body.", "a": "Elephant on hot day rapidly fans ears, internal temperature drops visibly, other animals gather to stand nearby."}, {"f": "An elephant's trunk can hold up to eight litres of water at once to spray directly into its mouth.", "a": "Elephant fills trunk at river, raises it overhead, empties entire eight litres into mouth in one go."}, {"f": "Asian elephants have two bumps on their forehead while African elephants have a smooth rounded head.", "a": "Elephant identifier at wildlife station checking foreheads methodically, Asian two bumps, African smooth, stamps passports."}, {"f": "Manatees have teeth that continuously shift forward and fall out at the front like a conveyor belt.", "a": "Manatee at dentist, dentist finds tooth at back, explains they are all moving forward, manatee already knew."}, {"f": "Dugongs live exclusively in saltwater while manatees are also commonly found in freshwater rivers.", "a": "Dugong and manatee at crossroads, river to the left, sea to the right, dugong goes right, manatee waves, goes left."}, {"f": "Hyraxes live on rocks and have a special lens in their eye that lets them look directly at the sun to spot eagles.", "a": "Hyrax on rock stares directly at sun, eagle circles above, hyrax tracks it perfectly, eagle changes direction."}, {"f": "Aardvarks have spade-shaped claws that let them dig faster than a team of workers with shovels.", "a": "Aardvark and construction crew at starting line, whistle blows, aardvark hole finished before crew puts shovels in ground."}, {"f": "Elephant shrews maintain clear highways through leaf litter and diligently keep them free of tiny obstacles.", "a": "Elephant shrew patrols its path with tiny broom, flicks away every leaf and twig, inspects work, satisfied."}, {"f": "Ring-tailed lemurs hold stink fights by rubbing scent glands on their wrists onto their tails and waving them at rivals.", "a": "Two lemurs prepare for stink battle, apply wrist scent to tails, wave aggressively, third lemur passes out."}, {"f": "Sifakas have extremely rough textured foot soles for maximum grip on smooth polished tree trunks.", "a": "Sifaka steps onto mirror-smooth trunk, feet grip immediately, walks straight up, other lemurs very jealous."}, {"f": "Aye-ayes tap their long middle finger on bark to locate hollow cavities where grubs are hiding.", "a": "Aye-aye taps tree rapidly like sonar, hollow space detected, taps X on trunk, extracts grub perfectly."}, {"f": "Slow lorises get their name from their deliberate and careful movements through the forest canopy.", "a": "Slow loris race in progress, all lorises moving with excruciating patience, crowd very unsure how long this will take."}, {"f": "Galagos can jump up to five metres from a standing start to catch insects from the air.", "a": "Galago crouches, insect buzzes overhead, galago launches five metres into air, catches it, lands, continues."}, {"f": "Tarsiers can rotate their head almost 180 degrees like an owl because their eyes are fixed in their sockets.", "a": "Tarsier tries to look sideways, head rotates almost all the way around, other tarsiers step back slightly."}, {"f": "Howler monkeys have an enlarged throat structure that acts as a natural amplifier for their deep calls.", "a": "Howler monkey clears throat, opens mouth, call echoes across three valleys, neighbouring animals wake up."}, {"f": "Spider monkeys have no thumbs on their front hands and use them purely as hooks for swinging through trees.", "a": "Spider monkey breezes through canopy hook by hook, reaches door, tries to open it, cannot, looks at hands."}, {"f": "Squirrel monkeys sometimes rub their own urine on their hands and tail to improve grip and leave scent trails.", "a": "Squirrel monkey at grip training, applies own urine, grabs branch, holds tight, trainer makes note, says it works."}, {"f": "Capuchin monkeys wash their fur with crushed insects that secrete a natural insect repellent.", "a": "Capuchin catches beetle, grinds it carefully, rubs it into fur methodically, mosquitoes approach, then retreat."}, {"f": "Uakari monkeys have a very short tail which is extremely unusual for tree-dwelling South American monkeys.", "a": "Uakari at monkey ID check, officer asks about tail, uakari shows tiny stub, officer squints, checks rulebook."}, {"f": "Baboons live in complex groups with a strict hierarchy constantly tested through displays of dominance.", "a": "Baboon group at meeting, dominance display breaks out immediately, three minutes in, hierarchy reconfirmed."}, {"f": "Male mandrills develop brighter red and blue facial colours as testosterone levels and dominance increase.", "a": "Mandrill checks dominance ranking, face gets slightly more blue and red, rival checks ranking, same thing."}, {"f": "Rhesus macaques can survive in environments ranging from hot deserts to snow-covered mountain regions.", "a": "Rhesus macaque packs one bag for both desert and mountain, arrives at each extreme perfectly equipped."}, {"f": "Barbary macaque males are unusually caring fathers and carry and protect infants to form social bonds with other males.", "a": "Barbary macaque dad carries baby, approaches other males, baby works as excellent conversation starter, friendships made."}, {"f": "Japanese macaques roll snowballs for their own amusement with no practical purpose whatsoever.", "a": "Japanese macaque rolls snowball carefully, reaches flat area, snowball stops, macaque looks at it, satisfied, rolls again."}, {"f": "Male proboscis monkeys may use their enormous drooping nose to make their calls echo louder through the mangrove.", "a": "Proboscis monkey calls across swamp, nose acting as megaphone, sound doubles, other monkeys cover ears."}, {"f": "Langur monkeys have special stomach bacteria that neutralize the toxins found in the leaves they eat.", "a": "Langur eats poisonous leaf calmly, stomach bacteria get to work, leaf rendered harmless, langur eats another."}, {"f": "Gibbons form monogamous pairs and sing loud dawn duets every morning to confirm their territory boundaries.", "a": "Gibbon pair set 5am alarm, launch into full territorial duet, neighbourhood gibbons receive the message clearly."}, {"f": "Orang-utans can have an arm span of up to two and a half metres, far longer than their body height.", "a": "Orang-utan spreads arms for measurement, tape runs out, measurer needs extension, orang-utan patiently holds pose."}, {"f": "Chimpanzees fish for termites by carefully inserting a thin stick into holes in the mound and licking it.", "a": "Chimpanzee selects stick carefully, trims it to size, inserts it slowly, extracts covered in termites, licks clean."}, {"f": "Bonobos have a slimmer body and rounder skull than chimpanzees and live in female-led groups.", "a": "Bonobo group arrives at clearing, female takes the lead position immediately, male holds the map."}, {"f": "Gorillas communicate frequently by beating their chest with cupped hollow hands to signal their presence.", "a": "Gorilla chest beats at full volume, echo crosses valley, rival gorilla three kilometres away receives message clearly."}, {"f": "Flying foxes eat only juice and fruit flesh, chewing fruit to extract the liquid and spitting out the fibre.", "a": "Flying fox at breakfast, takes enormous bite of mango, chews, spits neat fibre ball, swallows juice only."}, {"f": "Pygmy bats weigh less than a sugar cube and can squeeze through gaps only one centimetre wide.", "a": "Pygmy bat approaches 1cm gap, turns sideways, folds wings flat, pops through, immediately pops back to normal."}, {"f": "Vampire bats have an anticoagulant in their saliva that keeps the host's blood flowing while they feed.", "a": "Vampire bat approaches sleeping animal, applies anticoagulant saliva carefully, laps blood, animal stays asleep, bat full."}, {"f": "Long-eared bats fold their enormous ears backward under their wings to protect them during hibernation.", "a": "Long-eared bat prepares for hibernation, folds ears carefully behind wings, pats them down, settles in for winter."}, {"f": "Daubenton's bats catch insects flying just above the water surface using their tail membrane as a net.", "a": "Daubenton's bat skims water surface, tail deploys as net, insect scooped clean, bat pulls up, mission complete."}, {"f": "Mosquitoes have 47 teeth lining their proboscis used to pierce skin.", "a": "Mosquito at dentist getting all 47 teeth checked, dentist runs out of X-ray film, mosquito very patient."}, {"f": "Goldfish can remember events from up to five months ago, disproving the three-second memory myth.", "a": "Goldfish swims past rock, recognizes it from five months ago, nods knowingly, swims on."}, {"f": "Snails have four noses located on their four tentacles, two for smell and two for sight.", "a": "Snail at perfume counter, extends all four tentacles simultaneously, overwhelmed by the options, slowly retreats."}, {"f": "A frog cannot swallow with its eyes open because it uses its eyes to push food down its throat.", "a": "Frog tries to swallow fly with eyes open, food refuses to go down, frog closes eyes, problem solved."}, {"f": "Elephants can feel the vibrations of a thunderstorm 50 kilometres away through their feet.", "a": "Elephant puts foot to ground like a phone call, looks at herd and says storm in two hours, everyone nods."}, {"f": "Frogs can vomit their entire stomach out, wipe it clean with their front legs, then swallow it back.", "a": "Frog at restaurant, stomach comes out, wipes it carefully with tiny napkin, tucks it back in, continues eating."}, {"f": "A cockroach can survive up to nine days without its head before dying of thirst.", "a": "Cockroach loses head in accident, checks calendar, runs nine more errands headlessly, collapses on day ten."}, {"f": "Earthworms have five hearts arranged in a row along their body.", "a": "Earthworm at doctor, stethoscope on each heart in turn, doctor fills out extremely long form, five ticks."}, {"f": "A praying mantis has only one ear located between its hind legs.", "a": "Praying mantis at hearing test, audiologist searches for ear, finds it between legs, both look at each other."}, {"f": "Whales can get sunburned and are increasingly suffering from it due to ozone layer thinning.", "a": "Whale surfaces, winces, reaches for enormous tube of suncream, cannot apply it, sighs, dives back down."}, {"f": "Cockroaches were already living on Earth before the dinosaurs appeared.", "a": "Cockroach at history museum, walks past dinosaur exhibit, points at itself, then at the date, been here longer."}, {"f": "Goldfish lose their colour if kept in the dark for too long without light exposure.", "a": "Goldfish in dark tank slowly fading to white, holds up sign saying turn on the light please."}, {"f": "Mosquitoes prefer people with blood type O over any other blood type.", "a": "Mosquitoes at blood type identification booth, type O person walks by, entire booth goes wild."}, {"f": "A cheetah can accelerate from zero to 100 kilometres per hour in under three seconds.", "a": "Cheetah at starting line, traffic light goes green, cheetah gone, timer reads 2.7 seconds, crowd blinks."}, {"f": "Giraffes have exactly seven neck vertebrae, the same number as humans.", "a": "Giraffe and human at skeleton comparison, vertebrae count identical, giraffe's just slightly more spread out."}, {"f": "A giraffe's tongue is bluish-black and can extend to 45 centimetres in length.", "a": "Giraffe extends tongue to measure a branch, other animals use it as a tape measure while it holds still."}, {"f": "Ticks can survive for up to three years without feeding on a host.", "a": "Tick at three-year anniversary of last meal, blows out tiny candle, still waiting, very patient."}, {"f": "An octopus can squeeze through any hole larger than a euro coin since that is its only rigid part.", "a": "Octopus at euro coin display, measures gap carefully, gives thumbs up, pours itself through perfectly."}, {"f": "Manatees are the closest living relatives of the elephant despite living entirely in water.", "a": "Manatee and elephant at family reunion, compare features, manatee has no trunk, elephant has no flippers, shrug."}, {"f": "Grey parrots can reason logically at the level of a four-year-old child.", "a": "Grey parrot at child's puzzle competition, solves it first, child looks confused, parrot shrugs apologetically."}, {"f": "Penguins cannot walk backwards due to the structure of their legs and feet.", "a": "Penguin tries to reverse out of tight spot, impossible, does 47-point forward shuffle instead, very slow."}, {"f": "Blue whales produce sounds that can be heard by other whales 1600 kilometres away.", "a": "Blue whale calls across ocean, three days later gets a reply, both nod, long distance relationship confirmed."}, {"f": "Chimpanzees use leaves as a kind of sponge to soak up water from hard-to-reach places.", "a": "Chimpanzee at water hole, can't reach, finds leaf, dips it, squeezes it into mouth, engineer of the forest."}, {"f": "Male gorillas can weigh up to 200 kilograms while eating an entirely plant-based diet.", "a": "Gorilla at gym, trainer asks about protein sources, gorilla shows handful of leaves, trainer speechless."}, {"f": "Seahorses have no stomach so food passes straight through and they must eat almost constantly.", "a": "Seahorse checks watch, eats, checks watch again, eats again, no break, food goes straight through."}, {"f": "Shark teeth are as hard as steel and grow back continuously throughout their lives.", "a": "Shark at steelworks, worker tests shark tooth against steel beam, tooth wins, worker takes notes."}, {"f": "Some shark species must keep swimming constantly to breathe and therefore sleep while moving.", "a": "Shark at sleep clinic, doctor asks to lie still, shark explains the situation, doctor books a waterproof appointment."}, {"f": "A jellyfish has no circulatory system, brain, heart, or blood whatsoever.", "a": "Jellyfish fills out hospital admission form, ticks none for brain, heart, blood and circulatory system, receptionist stares."}, {"f": "The poison dart frog carries enough toxin on its skin to kill ten adult humans.", "a": "Poison dart frog approaches hazmat training, instructor sees warning label on frog, cancels the class."}, {"f": "Crocodiles cannot stick their tongue out because it is fused to the bottom of their mouth.", "a": "Crocodile at tongue-sticking-out competition, tries, fails, tries harder, judge marks zero, crocodile very frustrated."}, {"f": "Alligators can hold their breath for up to two hours underwater.", "a": "Alligator at underwater breath holding contest, human competitors all surface, alligator still down there reading."}, {"f": "Turtles can breathe through their rear end during hibernation absorbing oxygen from the water.", "a": "Turtle in winter river, bubbles coming from wrong end, fish swim past slowly, turtle perfectly comfortable."}, {"f": "Giant tortoises can live for more than 150 years making them among the longest-lived animals.", "a": "Giant tortoise blows out birthday cake, 150 candles, takes twenty minutes, cake melted by the end."}, {"f": "Lizards can deliberately shed their tail to escape predators and regrow it later.", "a": "Lizard grabbed by tail, presses emergency release, tail left behind wriggling, lizard strolls off, tail waves goodbye."}, {"f": "Snakes sleep with their eyes permanently open because they have no eyelids.", "a": "Snake at slumber party, everyone else's eyes closed, snake's stay open, other animals very unsettled."}, {"f": "Some snake species can breathe partially through their skin during extended periods underwater.", "a": "Snake at biology lecture, demonstrates skin-breathing to class, students very confused, professor very excited."}, {"f": "Anacondas can go months without eating after consuming a large meal.", "a": "Anaconda finishes enormous meal, sets out-of-office message, goes to sofa, reappears four months later."}, {"f": "Vultures cool their legs by urinating on them, as the evaporation helps regulate their temperature.", "a": "Vulture on hot day, looks around, pees on own legs, other birds recoil, vulture nods, much better."}, {"f": "Hummingbirds weigh less than a euro cent coin.", "a": "Hummingbird at post office being weighed for letter, scale registers nothing, post office very confused."}, {"f": "Eagles can spot prey from several kilometres away with their extraordinarily powerful vision.", "a": "Eagle at lookout point, spots mouse three kilometres away, calculates trajectory, mouse has no idea."}, {"f": "Pelicans lose heat by opening their pouch and flapping it rapidly like a fan.", "a": "Pelican on hot day, opens enormous pouch, starts waving it, creates small local wind, everyone nearby grateful."}, {"f": "Penguins have a special salt gland above their eyes that filters salt from their blood so they can drink seawater.", "a": "Penguin drinks straight from ocean, salt exits above eyes in tiny stream, penguin completely unbothered."}, {"f": "A turkey's head changes colour between red, white, and blue depending on its mood.", "a": "Turkey walks into room angry, head turns red, embarrassed, goes white, patriotic, goes blue, everyone watching."}, {"f": "Chickens can recognise more than one hundred individual faces of other chickens.", "a": "Chicken at reunion, immediately identifies every other chicken by face, no name tags needed, very impressive."}, {"f": "Pigs are more intelligent than dogs and can be taught to play simple video games using their snout.", "a": "Pig at arcade, controls game with snout, beats high score, dog watching from outside, very humbling."}, {"f": "Sheep can remember and recognise human faces for years after a single meeting.", "a": "Sheep spots farmer from three years ago, nods in recognition, farmer very touched, sheep continues eating."}, {"f": "A horse can sleep standing up by locking its knee joints in place using a special stay apparatus.", "a": "Horse at sleepover, all other animals lie down, horse remains vertical, closes eyes, fully asleep, impressive."}, {"f": "Donkeys can hear each other calling across several kilometres in open desert conditions.", "a": "Donkey makes call in desert, three kilometre distant donkey immediately looks up and responds, very efficient."}, {"f": "A camel can drink over one hundred litres of water in just fifteen minutes.", "a": "Camel arrives at water trough, drinks for fifteen minutes, owner watches meter spin, camel fully refreshed."}, {"f": "Dromedaries have one hump while Bactrian camels have two.", "a": "Dromedary and Bactrian camel at lost property, one checks single hump, other checks two, both find their tag."}, {"f": "Llamas spit at each other to establish dominance or resolve conflicts within the group.", "a": "Two llamas in disagreement, both spit simultaneously, both hit targets, stand there wet, argument resolved."}, {"f": "Alpacas can die of loneliness if they are kept without any companions of their own kind.", "a": "Alpaca at welcome party for new alpaca, pulls out schedule of activities, clearly very prepared."}, {"f": "A cheetah cannot roar but can purr continuously just like a domestic cat.", "a": "Cheetah at big cat meeting, everyone roars in turn, cheetah's turn comes, purrs loudly, awkward silence."}, {"f": "Hyenas are more closely related to cats than to dogs despite their dog-like appearance.", "a": "Hyena at family tree presentation, audience expects dog branch, hyena points to cat branch, everyone gasps."}, {"f": "Foxes use Earth's magnetic field to calculate the precise distance and angle when pouncing on prey under snow.", "a": "Fox at snow-covered field, closes eyes, aligns to magnetic north, pounces, perfect hit, prey baffled underground."}, {"f": "A polar bear can swim at thirty kilometres per hour making them powerful open-water swimmers.", "a": "Polar bear at swim meet, other competitors ready, polar bear dives in, thirty km/h, race over quickly."}, {"f": "Brown bears can run at up to fifty kilometres per hour over short distances.", "a": "Brown bear at sprinting track, timer reads 50km/h, human sprinter looks at their own time, considers retirement."}, {"f": "Giant pandas must spend up to twelve hours a day eating bamboo because it has so little nutrition.", "a": "Panda sets twelve-hour eating alarm, starts bamboo pile at 6am, finishes at 6pm, sets same alarm for tomorrow."}, {"f": "Raccoons wet their food in water not to wash it but to enhance the sensitivity of their touch receptors.", "a": "Raccoon dunks food in water, feels it carefully with wet paws, nods, confirmed edible, eats it."}, {"f": "Badgers build underground burrows called setts that are passed down through generations for centuries.", "a": "Badger estate agent shows young badger around ancestral sett, points to original 1650 extension, good bones."}, {"f": "Sea otters have the densest fur of any animal on Earth with a million hairs per square centimetre.", "a": "Sea otter enters fur density competition, judge measures, machine breaks, fur confirmed beyond measurable range."}, {"f": "A weasel can kill prey many times larger than itself by biting the back of the skull with precision.", "a": "Weasel approaches animal ten times its size, other animals look worried, weasel unimpressed, gets on with it."}, {"f": "Skunks can spray their defensive fluid up to four metres with remarkable accuracy.", "a": "Skunk at target practice, sprays four metres, hits bullseye, takes bow, everyone nearby politely evacuates."}, {"f": "A hedgehog has between five and seven thousand spines covering its back.", "a": "Hedgehog at spine counting appointment, counter reaches three thousand, asks for a break, hedgehog very patient."}, {"f": "Moles can dig a tunnel one hundred metres long in a single night.", "a": "Mole clocks in at sunset, digs all night, clocks out at sunrise, foreman measures tunnel, writes one hundred metres."}, {"f": "A horse has a field of vision of almost 360 degrees because its eyes are on the sides of its head.", "a": "Horse at panoramic photography workshop, instructor asks them to turn around, horse says no need, very efficient."}, {"f": "Przewalski's horses are the only truly wild horses never domesticated by humans.", "a": "Przewalski's horse at wild horse convention, all others have been domesticated at some point, awkward."}, {"f": "Donkeys cannot tolerate rain and cold well because their coat is not waterproof unlike horses.", "a": "Donkey and horse caught in rainstorm, horse fine, donkey immediately soaked, very unimpressed, seeks shelter."}, {"f": "Zebra stripes may also confuse biting flies like the tsetse fly making them harder to land on.", "a": "Tsetse fly approaches zebra confidently, stripes cause visual confusion, fly spirals away dizzily, zebra unmoved."}, {"f": "Tapirs have a short flexible trunk they use to grab leaves and pull branches towards their mouth.", "a": "Tapir at buffet, flexible nose extends to reach the top shelf, grabs several items at once, very efficient."}, {"f": "Indian rhinos have only one horn and skin that looks like thick armour plating with rivets.", "a": "Indian rhino walks past medieval museum, knight looks at rhino's skin, asks where they got the armour."}, {"f": "White rhinos have a wide flat lip for grazing grass while black rhinos have a pointed lip for browsing shrubs.", "a": "White rhino and black rhino at salad bar, white rhino grazes the flat surface, black rhino plucks individual items."}, {"f": "A hippo can open its jaw up to 150 degrees wide to threaten rivals.", "a": "Hippo at jaw angle competition, opens to 150 degrees, judge's protractor cannot measure it, disqualified for being too wide."}, {"f": "Dwarf hippos live solitary lives in dense West African forests unlike their sociable larger relatives.", "a": "Dwarf hippo receives party invitation from regular hippos, sends polite decline, enjoys quiet evening alone."}, {"f": "Wild boars use their powerful snout to root through forest floors for acorns and underground food.", "a": "Wild boar at truffle hunting school, teacher demonstrates technique, boar already finished and found seventeen."}, {"f": "Warthogs kneel on their wrists while grazing so they can reach short grass more easily.", "a": "Warthog kneels at grass level, looks around, this works extremely well, other animals make note of the technique."}, {"f": "Babirusa pigs have upper tusks that grow back through the skin of their snout and curve backward.", "a": "Babirusa at tusk checkup, dentist measures backward curve, books urgent grinding appointment, very concerned."}, {"f": "Camel humps store fat not water and can droop to one side when depleted then refill after eating.", "a": "Camel arrives at desert crossing, hump upright, returns on the other side, hump flopped sideways, needs snack."}, {"f": "Dromedary camels can close their nostrils completely to keep sand out during desert storms.", "a": "Sandstorm hits, dromedary seals nostrils with cartoon pop sound, waits for storm to pass, opens again, fine."}, {"f": "Llamas are used as pack animals to carry heavy goods through the mountain passes of South America.", "a": "Llama with enormous load at mountain checkpoint, customs officer checks weight, llama shrugs, carries on."}, {"f": "Alpacas are kept primarily for their extraordinarily soft and high-quality wool.", "a": "Alpaca at wool quality com
