<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Prompt Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; color: #f0f0f0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; padding: 20px 16px; }
  h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
  .sub { color: #555; font-size: 0.85rem; margin-bottom: 24px; }
  .counter { font-size: 0.78rem; color: #444; margin-bottom: 16px; }
  .counter span { color: #ff6b35; font-weight: 700; }
  .btn-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  button { background: #ff6b35; color: #fff; border: none; border-radius: 10px; padding: 13px 22px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.15s, transform 0.1s; }
  button:active { transform: scale(0.97); }
  button:hover { background: #e85e2a; }
  button.sec { background: #1a1a1a; border: 1px solid #333; color: #aaa; }
  button.sec:hover { background: #222; }
  .card { background: #111; border: 1px solid #1e1e1e; border-radius: 14px; padding: 18px; margin-bottom: 12px; }
  .card-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #ff6b35; margin-bottom: 8px; }
  .fact-text { font-size: 1.05rem; line-height: 1.5; color: #f0f0f0; }
  .anim-text { font-size: 0.88rem; line-height: 1.6; color: #888; font-style: italic; }
  .prompt-box { background: #0a0a0a; border: 1px solid #222; border-radius: 10px; padding: 14px; font-size: 0.8rem; line-height: 1.7; color: #999; white-space: pre-wrap; word-break: break-word; max-height: 280px; overflow-y: auto; }
  .copy-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #888; padding: 9px 16px; font-size: 0.82rem; border-radius: 8px; margin-top: 10px; width: 100%; cursor: pointer; }
  .copy-btn:hover { background: #222; }
  .copy-btn.copied { background: #0f2a0f; border-color: #1a4a1a; color: #4a9a4a; }
  .history { margin-top: 28px; border-top: 1px solid #1a1a1a; padding-top: 20px; }
  .history-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #333; margin-bottom: 10px; }
  .history-item { background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
  .history-fact { font-size: 0.85rem; color: #aaa; line-height: 1.4; }
  .history-meta { font-size: 0.7rem; color: #333; margin-top: 4px; }
  .empty { text-align: center; color: #333; padding: 40px 20px; font-size: 0.9rem; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
  .tab { flex: 1; padding: 11px 8px; background: #111; border: 1px solid #222; border-radius: 10px; color: #555; font-size: 0.88rem; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.15s; }
  .tab.active { background: #ff6b35; border-color: #ff6b35; color: #fff; }
  .tab:hover:not(.active) { border-color: #333; color: #aaa; }
  .panel { display: none; }
  .panel.active { display: block; }
  textarea { width: 100%; background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 10px; color: #f0f0f0; font-size: 0.9rem; line-height: 1.6; padding: 14px; resize: vertical; font-family: inherit; min-height: 120px; margin-top: 4px; }
  textarea:focus { outline: none; border-color: #ff6b35; }
  textarea::placeholder { color: #333; }
  .input-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #ff6b35; margin-bottom: 6px; display: block; margin-top: 12px; }
  .shuffle-btn { background: #111; border: 1px solid #2a2a2a; color: #555; padding: 8px 14px; font-size: 0.8rem; border-radius: 8px; cursor: pointer; margin-top: 10px; }
  .shuffle-btn:hover { border-color: #333; color: #aaa; }
</style>
</head>
<body>

<h1>🎬 Flow Prompt Generator</h1>
<p class="sub">Unieke dierenfeitjes voor Google Flow</p>
<div class="counter">Gebruikt: <span id="usedCount">0</span> / <span id="totalCount">0</span></div>

<div class="tabs">
  <div class="tab active" id="tab-auto">✨ Automatisch</div>
  <div class="tab" id="tab-custom">✏️ Eigen animatie</div>
</div>

<div id="panel-auto" class="panel active">
  <div class="btn-row">
    <button id="btn-gen1">Genereer feitje</button>
    <button class="sec" id="btn-gen2">Genereer 2 feitjes</button>
  </div>
  <div id="results"><div class="empty">Klik op genereer om te beginnen</div></div>
</div>

<div id="panel-custom" class="panel">
  <div class="card" style="margin-bottom:12px">
    <div class="card-label">📌 Feitje</div>
    <div id="customFact" style="font-size:1rem;line-height:1.5;color:#f0f0f0;margin-bottom:10px">Klik op 'Nieuw feitje' om te beginnen</div>
    <button class="shuffle-btn" id="btn-shuffle">🔀 Nieuw feitje</button>
    <span class="input-label">✏️ Jouw animatiebeschrijving (Nederlands)</span>
    <textarea id="customAnim" placeholder="Beschrijf de animatie in het Nederlands. Bijv: Een haai zit aan een restauranttafel. De ober brengt een menu. De haai negeert het en slikt de ober in zijn geheel door. Bestelt daarna dessert."></textarea>
    <button id="btn-build" style="margin-top:12px; width:100%; background:#ff6b35; color:#fff; border:none; border-radius:10px; padding:13px; font-size:0.95rem; font-weight:600; cursor:pointer;">🎬 Genereer Flow-prompt</button>
  </div>
  <div id="customResult"></div>
</div>

<div id="historySection" style="display:none" class="history">
  <div class="history-label">Eerder gegenereerd</div>
  <div id="historyList"></div>
</div>

<script>
var FACTS = [{"f": "The wood frog freezes completely solid in winter — heart stopped, no brain activity — then thaws alive in spring.", "a": "SMASH CUT to a frog sitting on a log as snow falls. Ice creeps across it frame by frame — eyes freeze mid-blink, heart monitor flatlines with a sad boop. Title card: DECEMBER. The frog is now a perfect ice sculpture. SPRING: sunshine, melt, crack — the frog POPS back to life mid-sentence, gesturing wildly like it never stopped talking."}, {"f": "The tardigrade can survive open space, temperatures near absolute zero, and 30 years frozen — and still wake up fine.", "a": "A freezer door opens. A tiny tardigrade ice cube slides out. It thaws. The tardigrade stretches ONE leg. Then another. Looks around. Flying cars outside. Holograms everywhere. It finds a piece of moss. Sits down. Immediately starts eating. Completely unbothered. A calendar on the wall shows 30 years have passed. The tardigrade does not care."}, {"f": "The bombardier beetle fires a boiling toxic chemical jet from its rear end with an audible pop when threatened.", "a": "A toad grabs a bombardier beetle with maximum confidence. Smug toad face. Then — POC! — a boiling steam jet fires out the beetle's rear directly into the toad's mouth. Toad's eyes cross. Tongue curls backward. Smoke comes out its ears. It releases the beetle and hops in tiny panicked circles. The beetle lands, dusts off one leg, and keeps walking."}, {"f": "The horned lizard shoots pressurized streams of blood from its eyes up to five feet to deter predators.", "a": "EXTREME CLOSE-UP: a tiny lizard's face. Its eyes narrow. A huge coyote leans down grinning. Then — FWOOOSH — twin jets of blood fire from the lizard's eye sockets like cartoon fire hoses, catching the coyote full in the face and blasting it clear off its feet into the distance. A distant crash. The lizard blinks. Wipes nothing off. Keeps walking."}, {"f": "The hagfish releases such enormous quantities of slime in seconds that it can clog the gills of any predator alive.", "a": "A shark bites a hagfish. Satisfied shark face. One second later the shark is encased in an expanding white slime bubble — gills packed, vision zero. The hagfish slides out completely clean, gives its body one shake, and swims away. The shark slowly sinks with a slime cloud around it the size of a bus, quietly horrified."}, {"f": "The Malaysian exploding ant deliberately ruptures its own body to spray toxic acid on enemies, saving the colony.", "a": "One tiny ant faces 50 rival ants. It takes a deep breath. Puffs up like a balloon. Its abdomen glows red. A nearby ant whispers 'oh no' and DIVES behind a leaf. The explosion is enormous — orange shockwave, rival ants launched in all directions. The ant's tiny ghost floats upward, crosses its arms, gives a thumbs up, and ascends into the clouds."}, {"f": "The pistol shrimp snaps its claw so fast it creates a cavitation bubble hotter than the surface of the sun.", "a": "UNDERWATER. A pistol shrimp faces a fish with one giant claw raised. EXTREME SLOW MOTION snap — a water jet fires — a bubble forms — inside the bubble: a miniature SUN blazing white-hot for one frame. BOOM — shockwave. The fish is horizontal. The shrimp blows on its claw like a cowboy blowing smoke from a pistol barrel."}, {"f": "The sea cucumber expels its own organs through its rear end to distract predators, then simply regrows them.", "a": "A sea cucumber stands its ground as a fish approaches. Then it turns around and FIRES its own organs outward like a confetti cannon. The fish is buried in intestines. The sea cucumber dusts off its hands and walks away. CUT TO: three weeks later — same sea cucumber, brand new organs, sitting in a waiting room flipping through a magazine."}, {"f": "Some salamanders can regenerate the same limb dozens of times throughout their life with no loss of function.", "a": "A salamander in a tiny lab coat approaches a scientist. Points at its own arm. Then at a clipboard that says 'regeneration test #47'. The arm comes off. New arm grows in instant time-lapse — SNAP, full arm back. Salamander flexes it. The scientist slides over another clipboard: 'Can we try the brain?' The salamander slowly reads it. Slides it back."}, {"f": "The mimic octopus actively chooses which animal to impersonate based on what predator is currently approaching it.", "a": "An octopus with a mental ROLODEX: 15 animals on spinning cards. A lionfish predator approaches. The octopus flips through — click click click — LIONFISH. Transforms instantly, spines and all. The predator freezes. Backs away. The octopus closes the rolodex with a SNAP. Returns to normal. Checks its nails."}, {"f": "The star-nosed mole has 22 pink tentacles on its face and can identify and eat food in under 25 milliseconds.", "a": "A star-nosed mole ERUPTS from soil into extreme close-up — 22 pink tentacles filling the screen, wiggling at maximum speed. A worm appears. The tentacles BLUR. A digital clock appears: 0.025 seconds. The worm is gone. The mole blinks twice. Goes back underground. The clock is still spinning trying to process what happened."}, {"f": "The platypus hunts with its eyes, ears, and nostrils sealed shut, detecting prey purely through electrical signals in its bill.", "a": "A platypus blindfolds itself, inserts earplugs, plugs its nostrils. Dives into murky water. We see its mind's-eye view: pitch dark — then every shrimp and worm in the riverbed lights up as electric signals. It hoovers them up one by one. Surfaces. Removes blindfold. Holds up seven shrimp. Takes a bow to nobody."}, {"f": "Mantis shrimp have 16 types of colour receptors compared to 3 in humans, and can see wavelengths we cannot even describe.", "a": "A mantis shrimp and a human stand at a reef. Human: sees blue and orange. We switch to the shrimp's vision — the screen immediately GLITCHES, overloads with impossible colours that have no names, then CRASHES entirely with an error sound. The shrimp puts on sunglasses. Exhales slowly. Finally. Some peace."}, {"f": "The elephant can detect seismic vibrations from other elephant herds 32 kilometres away through the soles of its feet.", "a": "An elephant on a savanna presses one foot flat to the ground and goes completely still. CLOSE-UP: the foot. The ground shivers invisibly. The elephant's eye moves. A tiny mental picture forms: a herd 32 km away, mid-stride. The elephant turns. Makes one single low call. 32 km away, another elephant's ear rotates slowly toward the sound."}, {"f": "Sharks can detect a single drop of blood dissolved in an Olympic swimming pool's worth of water.", "a": "A shark in a tiny detective hat. A SINGLE drop of blood falls into the water far in the distance. The shark's nostrils FLARE. It rotates 47 degrees with mechanical precision. Pulls out a tiny GPS. Types: 0.000001% blood concentration. Target acquired. ETA 4 minutes. Adjusts hat. Sets off at cruise speed."}, {"f": "Toads can sense the approach of an earthquake days before it happens through changes in groundwater chemistry.", "a": "A toad by a pond reading a newspaper. Puts it down. Sniffs the air. Looks at the ground. Hops to a whiteboard. Writes: EARTHQUAKE. TUESDAY. 14:30. Smaller toads gather, look at the board, look at each other. Tuesday arrives. 14:30. The ground shakes. The toad picks up its newspaper. Turns the page."}, {"f": "The dung beetle is the only known non-human animal that navigates using the Milky Way.", "a": "Pitch black desert. A dung beetle with a ball of dung looks straight up at the Milky Way. Tilts its head. Rotates exactly 23 degrees with a tiny click. Rolls the ball in a PERFECTLY straight line across infinite darkness. Arrives at its exact destination. Checks the sky one more time. Nods once. Done."}, {"f": "Reindeer can see ultraviolet light, which makes wolf urine glow bright blue in the snow, revealing hidden predators.", "a": "A reindeer scans a snowy forest. Normal vision: nothing. UV vision: the entire snow is COVERED in bright glowing blue patches — wolf urine trails zigzagging everywhere, mapping every predator's position. The reindeer calmly folds a mental map. Takes a completely different path. Whistles quietly."}, {"f": "A blue whale's heart is the size of a small car and its blood vessels are wide enough for a human to swim through.", "a": "Workers in yellow vests lower an enormous car-sized heart into a whale with a crane — cables straining, operator sweating. The heart is installed. Silence. BOOM. BOOM. The whale's eyes OPEN. It exhales the tallest spout in recorded history. A nearby boat gets completely soaked. The whale doesn't notice. Disappears into deep water."}, {"f": "The giraffe's heart must pump blood 2.5 metres upward against gravity to reach its brain.", "a": "Animated cross-section of a giraffe. A tiny heart pumps. Blood begins climbing. And climbing. A tiny blood cell inside checks its watch. Clouds outside the window. Still climbing. A tiny oxygen mask drops from the ceiling of the blood vessel. Finally reaches the brain. The brain opens the door. Blood cell collapses on the doorstep."}, {"f": "An octopus has three hearts, blue blood, and two of its hearts stop beating whenever it swims.", "a": "An octopus starts swimming confidently. A medical monitor shows THREE heartbeats. The moment it starts swimming: two FLATLINE with a sad beep. The octopus looks at the monitor. Looks at its swimming. Immediately sits back down on the seafloor. All three hearts resume. It crosses its arms. Pulls out a book. Not doing that again."}, {"f": "The tongue of a blue whale weighs as much as a fully grown elephant.", "a": "Blue whale opens its mouth at an underwater party. A dramatic pause. Its tongue flops out — enormous — and LANDS on top of a nearby elephant that was standing there for scale. One elephant trunk waves from underneath. The whale looks left. Looks right. Tries to pretend this didn't happen."}, {"f": "The chameleon's tongue is longer than its entire body and accelerates faster than a fighter jet.", "a": "A chameleon spots a fly three metres away. Does not move. Does not blink. Does not breathe. Then — ZERO WARNING — a sonic boom ripples through the frame. A tiny crater marks where the fly was. The chameleon has not shifted a millimetre. A passing bird slowly turns. Stares at the chameleon. Stares at the crater. Walks away faster."}, {"f": "A snail's mouth contains up to 25,000 microscopic teeth arranged on a ribbon-like tongue called a radula.", "a": "A snail approaches a leaf. Opens its mouth — EXTREME CLOSE-UP reveals row after row after row of tiny teeth going back into darkness. A tiny dental hygienist appears inside, looks at the rows of teeth, faints immediately. The snail closes its mouth. Rasps through the entire leaf in ten seconds. Walks away."}, {"f": "The migratory bar-tailed godwit flies non-stop from Alaska to New Zealand — 12,000 kilometres — without eating.", "a": "A godwit at a departure gate. Announcement: 12,000 km, no food, no stops, no landing. 11 days. The godwit nods. Expected. Takes off. FAST FORWARD: 11 days blur. The godwit lands in New Zealand. Walks to the café. Sits down. A waiter approaches. The godwit opens the menu, points at every single item, and taps the table."}, {"f": "The sperm whale has the largest brain of any animal that has ever lived on Earth.", "a": "Underwater awards ceremony. LARGEST BRAIN EVER. The announcer opens the envelope. Looks up. Everyone turns to the back of the hall. A sperm whale is there, taking up the entire section. It raises a flipper modestly. Polite applause. The trophy is the size of a lorry. The whale tries to carry it. It doesn't fit through the door."}, {"f": "Crows remember individual human faces for years, hold grudges, and recruit other crows to harass the person.", "a": "A crow watches a man steal its sandwich. Memorises every detail of his face. SEASONS CHANGE. YEARS PASS. The same man walks by. The crow spots him from across the street. One short call. From every tree, rooftop, bin, and wire: dozens of crows land silently. They all stare. The man walks faster. The crows keep pace."}, {"f": "Chimpanzees in western Africa use stone anvils to crack nuts — a cultural tradition passed between generations for thousands of years.", "a": "An elder chimp places a nut on a stone anvil and cracks it with one precise hammer blow. A young chimp watches every detail. The elder hands over a nut. The young one places it. Picks up the hammer. Looks at the elder. The elder nods. CRACK — perfect first try. The elder chimp slaps its knee with satisfaction."}, {"f": "Japanese macaques learned to wash sweet potatoes in seawater — not for cleanliness, but for the salty flavour.", "a": "A macaque washes a sweet potato in a river. Tastes it. Something is missing. Walks to the ocean. Dips it in seawater. Tastes again. EYES CLOSE. Pure bliss. Another macaque watches. Tries it. Same face. By the next morning: a line of twenty macaques at the ocean's edge, all holding sweet potatoes."}, {"f": "Dolphins give each other unique signature whistles that function as names — and use each other's names when calling.", "a": "Underwater. A dolphin whistles a specific three-note sequence. Half a kilometre away another dolphin's head SNAPS up — that's my name. It whistles back. They rush toward each other whistling at high speed. A third dolphin hears its name. Pokes its head in. A fourth. Now six dolphins are all talking at once."}, {"f": "Ravens have been observed sliding down snowy rooftops repeatedly for no functional reason — purely for fun.", "a": "A raven finds an icy roof. Slides down accidentally. Lands. Looks back up. Climbs back. Slides again. Faster. Adds a spin. Faster. Adds a flip. A crow on a branch watches with increasing bafflement. The raven ignores it completely. The crow eventually flies away. The raven is still going."}, {"f": "Vampire bats make a precise microscopic cut in sleeping prey and lap blood so gently the animal never wakes.", "a": "A tiny vampire bat descends onto a sleeping cow with extraordinary care — not a single sound. Makes one invisible incision. Laps methodically. The cow dreams of a pleasant meadow. The bat finishes. Presses a microscopic bandage over the spot with one wingtip. Folds its wings. Flies off. The cow sleeps on."}, {"f": "Honey badgers have been filmed escaping from locked enclosures by crafting tools from available debris.", "a": "A honey badger paces its enclosure studying the lock. Stick: no. Rock: no. Bent wire: PAUSE. A slow smile. Click. The gate opens. The honey badger strolls out without looking back. The camera stays on the empty enclosure. On the ground: a tiny folded note. It says: back later."}, {"f": "Octopuses have been filmed at night sneaking out of their tank, hunting in other tanks, and returning before morning.", "a": "Security camera timestamp: 2:17am. An octopus carefully lifts its tank lid. Checks left. Checks right. Squeezes through the gap. Slides silently to the crab tank. Efficient. Professional. Returns at 4:48am. Replaces the lid from the inside. By morning it is sitting perfectly centred in its tank, looking out with complete innocence."}, {"f": "Some crows place hard nuts on road crossings at red lights and wait for cars to crack them before retrieving the pieces.", "a": "A crow places a walnut on a pedestrian crossing at a red light. Steps back onto the pavement. Green: a lorry rolls over it. Red: the crow walks out, collects perfectly cracked walnut pieces, eats them with dignity, returns to the kerb, places another one. A pigeon watches. Tries to copy. Runs out at the wrong moment. Just barely makes it back."}, {"f": "Male seahorses are the ones who get pregnant and give birth — the female deposits eggs into his pouch.", "a": "A female seahorse deposits eggs into a male's pouch with great efficiency. Gives him a look. Swims away. The male seahorse looks down at his now-bulging stomach. Looks at where she went. Looks at his stomach. Sits on a tiny rock. Nine weeks later his pouch EXPLODES open — hundreds of tiny seahorses shoot outward like confetti. He looks at the chaos. Sits back down."}, {"f": "The hooded seal nurses its pup for only 4 days — the shortest lactation period of any mammal — but the milk is 60% fat.", "a": "A hooded seal pup is born. A four-day countdown clock appears. DAY 1: tiny pup, normal size. DAY 2: noticeably bigger. DAY 3: enormous. DAY 4: the pup is almost the size of the mother. The mother looks at the pup. Looks at herself. Hands over the last bottle. The pup finishes it in one. The mother turns around and leaves without a word."}, {"f": "The immortal jellyfish can revert to its juvenile polyp state after reaching full adulthood — potentially cycling forever.", "a": "An ancient wrinkled jellyfish floats sadly. Touches its own reflection. GASPS. Its body compresses backward in time — wrinkles snapping tight, colour flooding back — WHOOSH — a tiny glowing baby jellyfish appears, bouncing in place, confused. It spots the reflection again. Sighs heavily. Here we go again."}, {"f": "Armadillos almost always give birth to genetically identical quadruplets from a single fertilised egg.", "a": "Hospital ultrasound. The armadillo lies back. The technician moves the wand. Looks at the screen. Counts. Looks at the armadillo. Counts again. Holds up four fingers. The armadillo shrugs — completely expected. A door opens and four IDENTICAL armadillos file in, sit in four chairs, and pick up four identical magazines."}, {"f": "The surinam toad gives birth by having young burst out of individual pockets across the skin of its back.", "a": "A surinam toad reads a newspaper. Bumps start appearing on its back — one, then two, then — POP POP POP POP POP — a cascade of tiny toads erupting from its back like a bag of popcorn, bouncing in every direction. The parent slowly turns ONE page of the newspaper. Doesn't look up once."}, {"f": "Snails can sleep continuously for up to three years during drought conditions, sealed inside their shell.", "a": "A snail checks a weather app: DROUGHT. 3 YEARS. The snail nods. Sets a tiny alarm clock. Retreats into its shell. Seals the door. The calendar on the wall FAST-FORWARDS — three full years blur by. The alarm rings. The snail cracks open the door. Sniffs. Checks the app. LIGHT DRIZZLE. Closes the door. Not enough."}, {"f": "The slow loris is the only venomous primate — it licks a gland under its own arm, mixing saliva with the toxin to create venom.", "a": "A slow loris in jungle at night. An animal gets too close. The slow loris raises one arm. SLOWLY. Begins licking the gland underneath. SLOWLY. Raises its head with venom now active. SLOWLY. The other animal left eleven minutes ago. The slow loris continues raising its head, alone in the dark."}, {"f": "The poison dart frog has enough toxin on its skin to kill ten adult humans — but loses its toxicity completely in captivity.", "a": "A tiny red frog the size of a coin sits in a terrarium. Scientists in full biohazard suits peer through triple glass. Warning lights flash everywhere. A sign: DO NOT TOUCH. The frog yawns. A second sign appears: NOTE — captive frogs are completely harmless. One scientist looks at his suit. Looks at the frog. Looks at his suit again."}, {"f": "The bombardier beetle has survived being swallowed by a frog by triggering its chemical weapon inside the stomach.", "a": "A frog swallows a bombardier beetle. Happy frog face. Then: a muffled POC from inside. The frog's eyes change. Smoke begins emerging from its nostrils. It opens its mouth and the beetle walks out, completely dry. Lands. Adjusts posture. Keeps walking. The frog sits very still with smoke coming from its mouth. Doesn't speak."}, {"f": "The blue-ringed octopus is smaller than a tennis ball but carries enough venom to kill 26 adults — with no antidote.", "a": "A tiny octopus sits on a reef. A scientist approaches. The octopus begins to GLOW — brilliant electric blue rings pulsing across its body like emergency lights. The scientist stops. Reads his notes. Looks at the octopus. Very slowly puts the clipboard on the floor. Backs away three metres. The octopus stops glowing. Returns to looking like a rock."}, {"f": "The peregrine falcon reaches 380 km/h in a hunting dive — making it the fastest animal on Earth.", "a": "A traffic officer on a clifftop with a speed gun. A falcon dives past. BEEP. The officer looks at the reading. Looks at the sky. The falcon is already a speck on the horizon. The officer slowly lowers the gun. Writes the number in a notebook. 380. Underlines it twice. Stares at it for a moment. Closes the notebook. Goes home early."}, {"f": "The archerfish shoots precise jets of water to knock insects off branches up to 3 metres above the surface.", "a": "An archerfish eyes a fly on a branch three metres up. It calculates: refraction angle, wind, branch position. FIRES. The water jet curves upward in a perfect arc. Dead centre hit. The fly spirals down. The archerfish catches it on the surface without moving a fin. The fly genuinely had no idea what happened."}, {"f": "The dragonfly catches over 95% of the prey it targets — the highest success rate of any predator on Earth.", "a": "SCOREBOARD: DRAGONFLY vs. PREY. 95/100. The dragonfly doesn't look at the board. It's already hunting. Target: CAUGHT. Reset. Target: CAUGHT. A lion watches from the side. Its own stat appears: 25%. The lion looks away. The dragonfly catches number 96 without blinking."}, {"f": "The mantis shrimp's punch accelerates faster than a 22-calibre bullet and can break aquarium glass.", "a": "WESTERN STANDOFF on the seafloor. A mantis shrimp and a crab. Tumbleweed drifts by. The shrimp's club moves — the camera misses it entirely. The crab is now embedded in a rock 3 metres away. A crack spiderwebs across the aquarium glass. Water drips. The shrimp shakes out its claw. Looks at the camera."}, {"f": "Some sharks must swim continuously to breathe and therefore sleep while still moving forward.", "a": "A shark in a sleep mask drifts through open ocean, snoring. Bumps into a reef — adjusts course without waking. Bumps into another shark — both shuffle sideways, eyes still closed. A fish watches this. The sleeping shark bumps a third thing. Still asleep. Still breathing. Still moving. Still snoring."}, {"f": "The migratory godwit flies 12,000 kilometres non-stop from Alaska to New Zealand in 11 days without eating.", "a": "Departure gate. Announcement: 12,000 km. No food. No stops. No landing. Eleven days. The godwit nods. Expected. Takes off. FAST FORWARD 11 DAYS. The godwit lands in New Zealand. Walks to baggage claim. Gets its bag. Sits at a café. Opens the menu. Points at everything. Taps the table."}, {"f": "Crocodiles can go over two years without a single meal by slowing their metabolism to almost nothing.", "a": "A crocodile at a restaurant table with perfect posture. Waves away the menu. The window behind it shows seasons changing — leaves, snow, spring, summer, leaves again. A child at the next table is born, learns to walk, starts school. The waiter reappears. The crocodile finally nods. Opens the menu. Takes its time reading every item."}, {"f": "A cockroach can survive a week without its head — it dies of thirst, not brain damage.", "a": "A cockroach in a tiny lab coat reads a newspaper. A dramatic accident happens off-screen. It walks back into frame: no head. Keeps reading. Turns a page. Makes tea. Organises its desk. On day eight it picks up a glass of water. Frowns. Looks at where its mouth used to be. Looks at the glass. Sets the glass down carefully."}, {"f": "A jumping flea accelerates faster than a Space Shuttle at launch and experiences 100 times the force of gravity.", "a": "Mission control. A flea in a tiny astronaut suit on a launch pad. Countdown: 3, 2, 1. LAUNCH. A blur. A scorch mark. Applause. A graph appears: G-FORCE COMPARISON. The Space Shuttle bar is barely visible. The flea's bar goes off the screen entirely, past the ceiling, out the window."}, {"f": "Wombats produce perfectly cube-shaped droppings — the only animal on Earth that does this.", "a": "A wombat strolls through forest. Perfect cubes drop behind it with each step. A wallaby picks one up. Can't roll it. Tries harder. Can't. A beaver arrives with shining eyes and immediately starts stacking them. A passing animal starts using them as steps. The wombat has not looked back once."}, {"f": "Flamingos are actually born grey — the pink comes entirely from carotenoid pigments in their shrimp and algae diet.", "a": "A grey flamingo chick stares at its own reflection in a puddle next to its blazing pink parent. Takes one tiny bite of shrimp. ONE feather turns pink — it flinches. Grabs a huge mouthful. Pink FLOODS up from its feet like a test tube filling. Checks reflection. Stands up straighter. Finally."}, {"f": "The glass frog is so transparent that its beating heart and organs are clearly visible through its chest wall.", "a": "Airport security. A glass frog places its bag on the belt. Walks through the scanner. On the monitor: everything — beating heart, tiny stomach contents, last week's fly still visible. The operator calls over a colleague. They both stare. The frog collects its bag. Notices them looking. Seems strangely proud."}, {"f": "Rats cannot vomit — they lack the neurological wiring and muscular ability to do it.", "a": "A rat eats something terrible at a restaurant. Its face says everything. It tries to vomit. Concentrates hard. Tries again. Looks at the ceiling. Tries a third time. Nothing. Looks at its stomach. Then at the chef. Pays the bill. Leaves ONE star online. The chef reads it. Cries."}, {"f": "The immortal jellyfish was declared to have no natural maximum lifespan — the oldest known individual may be centuries old.", "a": "A jellyfish at a birthday party. The candles need a second tier. Then a third. The table collapses. A historian arrives with documents. The jellyfish opens them. Points at an entry from 1648. That's me. Everyone takes a large step back. The jellyfish blows out all the candles. It takes a while."}, {"f": "The platypus is venomous — males have spurs on their hind legs that deliver venom strong enough to incapacitate a human.", "a": "A platypus at a mammal convention. Duck bill: check. Beaver tail: check. Lays eggs: check. Electric bill sensors: check. VENOMOUS ANKLE SPURS: the platypus slowly raises one hind leg. The entire convention hall backs away simultaneously. The platypus lowers its leg. Picks up its name badge. Heads to the buffet."}, {"f": "Elephants are afraid of bees — beehive fences are now used in Africa to keep elephants out of farmland.", "a": "An elephant charges toward a fence. Stops. Tilts its head. A single bee emerges from a hive attached to the fence. The elephant's eyes go wide. It backs up one step. Another bee. The elephant turns around and walks in the opposite direction at maximum dignity. The bee returns to the hive. Resumes work."}, {"f": "The sperm whale's click is the loudest sound produced by any animal — loud enough to stun a human diver.", "a": "An underwater decibel competition. A howler monkey: 88dB. A lion: 114dB. A pistol shrimp: 218dB. The sperm whale taps the microphone. Clears its throat. The microphone EXPLODES. The building shakes. Every instrument on the judges' table slides off. The whale adjusts its collar and waits patiently for a replacement microphone."}, {"f": "The coelacanth was believed extinct for 65 million years until one was found alive in a fish market in 1938.", "a": "A fish market, 1938. A fisherman hauls in a net. Something strange inside. A scientist walks past. Keeps walking. Stops. Turns back slowly. Stares. Pulls out a reference book. Page 47: EXTINCT — 65 MILLION YEARS. Looks at the fish. The fish looks back. The scientist sits down on the ground right there in the fish market."}, {"f": "The axolotl can regenerate its heart, brain, spine, and limbs — all with zero scarring.", "a": "An axolotl watches a scientist remove one of its limbs for study. It shrugs. New limb grows in instant time-lapse — SNAP, fully formed. The axolotl flexes it. Gives the scientist a look. The scientist, who has been completely silent, slowly slides a second paper across the table. It says: Can we try the spine? The axolotl reads it. Slides it back."}, {"f": "The lyrebird can perfectly replicate chainsaws, camera shutters, car alarms, and other machinery it hears in the wild.", "a": "A lyrebird steps onto a forest stage. Opens its beak. CHAINSAW ROAR — every tree in the vicinity leans away. SWITCHES to car alarm — birds cover their ears. SWITCHES to camera clicks — the audience shields their eyes. BABY CRYING — a mother in the audience checks her child instinctively. The lyrebird takes a bow. The forest is silent for several seconds."}, {"f": "The mimic octopus chooses which animal to impersonate based on the specific predator approaching it.", "a": "An octopus opens a mental filing cabinet. A lionfish approaches from the left. The octopus flips to LIONFISH, pulls out the card, transforms in under a second — spines, pattern, exact colour. The predator freezes. Retreats. The octopus files the card back. Closes the drawer. Closes its eyes. Back to relaxing."}, {"f": "Crows pass down the memory of dangerous human faces across generations — offspring avoid people their parents never met.", "a": "A crow parent shows a young crow a photo album. Points to one specific face. The young crow memorises it. Years pass. Now an adult crow spots that exact face in a crowd. Has never met this person. Calls once. Crows appear from everywhere. The human continues walking, baffled by why crows keep showing up everywhere he goes."}, {"f": "The electric eel can leap partially out of water to electrocute an animal that is leaning over the surface.", "a": "A caiman leans smugly over the river. Everything: calm. Then — FLASH — the eel LAUNCHES in a blinding arc, makes contact, crashes back in one motion. The caiman's scales stand on end. Its eyes rotate independently. It tips sideways off the bank in slow motion. The eel adjusts course. Keeps swimming."}, {"f": "Goblin sharks have jaws that fire forward out of their mouths on elastic ligaments to catch prey.", "a": "A pale goblin shark drifts past a fish. The fish: relaxed, no danger here. The shark's jaw LAUNCHES forward on its own — two body-lengths — grabs the fish — SNAPS back in half a second. The shark's face never moved. The surrounding fish realise what just happened. Very slowly back away."}, {"f": "The mantis shrimp can still see more colours than any other animal despite having the most complex eyes known to science.", "a": "A mantis shrimp and a human at an art gallery looking at the same painting. Human: blue and red. We switch to the shrimp's view — the screen GLITCHES with impossible colours, ERROR sounds, the display CRASHES entirely. The shrimp puts on sunglasses. Exhales slowly. That is much better."}, {"f": "The pistol shrimp colony creates such continuous snapping noise that submarines use it as acoustic cover.", "a": "Submarine sonar room. The operator drowns in static crackling noise. Traces it. Cuts to: a shallow reef — MILLIONS of pistol shrimp all snapping simultaneously in perfect chaos. The operator removes his headphones. A naval captain leans over, puts them on. Immediately removes them. They look at each other."}, {"f": "Orcas can tip ice floes by creating coordinated waves to slide seals directly into the water.", "a": "Three orcas underwater watch a seal on an ice floe. They line up in formation. Swim together — building a wave. The wave reaches the floe. It TILTS. The seal scrambles. Tilts more. The seal slides — slowly at first — then faster — and off the edge with a tiny shriek. The orcas surface. High-five flippers. Perfect execution."}, {"f": "The bowhead whale can live for over 200 years — some alive today were born before the US Declaration of Independence.", "a": "A whale at an official birthday party. A historian arrives with a scroll. Unrolls it. It goes off the edge of the table. Onto the floor. Out the door. Down the hall. The year of birth is announced: 1768. Everyone in the room looks at the whale. The whale adjusts its birthday hat. Blows out the candles. It takes several attempts."}, {"f": "Some ants carry their dead to a designated cemetery area at the edge of the colony — consistently, for their entire history.", "a": "An ant funeral procession: two ants in tiny black suits carry a third on a stretcher through the colony. Other ants pause, bow briefly, return to work. The procession arrives at the colony's edge. A very small headstone is placed next to many others. The pallbearers return. Everyone gets back to work immediately."}, {"f": "The pistol shrimp is believed to be one of the loudest animals in the ocean relative to its body size.", "a": "Underwater decibel finals. A blue whale. A sperm whale. Then a PISTOL SHRIMP walks up to the microphone. Everything goes quiet. It snaps its claw. Every instrument on the judges' table slides backward. A fish in row three checks if its ears are working. The shrimp adjusts the microphone. Walks off without accepting the trophy."}, {"f": "The vampire bat is the only mammal that regularly shares food — regurgitating blood meals to starving roostmates.", "a": "A thin bat sits alone in the corner of a roost, hungry. A plump bat returns from a successful night. It spots the thin bat. Approaches. Sits next to it. A long pause. Then it regurgitates a blood meal to share. The thin bat accepts it. The full bat pats its wing once. They sit together as rain falls outside."}, {"f": "The mantis shrimp repairs its burrow every day, collecting specific materials from the surrounding reef.", "a": "A mantis shrimp in a tiny hard hat pushes a wheelbarrow of pebbles toward its burrow. Deposits them. Adjusts three stones. Checks a tiny blueprint. Adjusts one more. NODS. Goes back for another load. The camera pulls back slowly to reveal the entire surrounding reef has been slowly dismantled over weeks."}, {"f": "Some species of jellyfish have been found in every ocean on Earth — likely spread by hitchhiking on ship ballast water.", "a": "A tiny jellyfish in a rocking chair. A researcher holds up a world map with pins in every ocean. Pacific — tick. Atlantic — tick. Indian — tick. Arctic — tick. Antarctic — tick. The jellyfish nods slowly at each. Opens its passport. Every page is full. Stamps. Visas. Entry dates going back centuries."}, {"f": "The axolotl can regrow its heart, brain, spine, and limbs — with zero scarring, every single time.", "a": "An axolotl in a tiny lab coat sits across from a scientist. The scientist nervously slides a waiver across the table. The axolotl signs it without reading it. Scientists remove one arm. The axolotl watches it go. SNAP — new arm in fast-motion. The axolotl flexes it. Gives the scientist a look. The scientist slides over another waiver. It says: brain. The axolotl slowly slides it back."}, {"f": "Wombats have a rear end made almost entirely of cartilage and bone — they use it to crush intruders against burrow walls.", "a": "A fox peers into a wombat burrow, grinning. The wombat retreats to the back — then REVERSES hard. The fox is now sandwiched between a wall of solid wombat rear and the tunnel wall. The wombat does not look back. Just reverses harder. Satisfied bump noise. The fox slides out flat."}, {"f": "The mimic octopus was only scientifically described in 2001 — despite living in plain sight on shallow seafloors for millennia.", "a": "A marine biologist wades through shallow water taking notes. An octopus has been sitting next to him for three years, disguised as a clipboard. Today it drops the disguise. Extends all eight arms. The biologist screams. The octopus shrugs. Been here the whole time."}, {"f": "Honey badgers are immune to most snake venom — a cobra bite will knock one out for a few hours, then it wakes up and keeps going.", "a": "A honey badger is bitten by a cobra. It staggers. Falls over. The cobra looks pleased. TWO HOURS LATER: the honey badger's eyes open. It sits up. Cracks its neck. The cobra is still there. The honey badger points at the cobra. Points at itself. Points at the cobra again. The cobra slowly backs into a bush."}, {"f": "The archerfish compensates for light refraction when aiming at prey above water — performing complex optics calculations in real time.", "a": "An archerfish underwater holds a tiny protractor. Measures the angle of the water surface. Consults a refraction table. Types numbers into a miniature calculator. Nods. FIRES a water jet. It curves upward in a perfect arc. The fly on the branch never knew what hit it. The archerfish puts the calculator away. Routine."}, {"f": "Cuttlefish can hypnotise prey by flashing rapid pulsing patterns across their skin before striking.", "a": "A cuttlefish faces a fish. It begins flashing — psychedelic ripples of colour spreading across its body in mesmerising waves. The fish's eyes go glassy. It sways. The cuttlefish snaps its fingers — the fish is completely under. The cuttlefish examines it. Then snaps its fingers again. The fish blinks, confused. Swims away. Has no idea what just happened."}, {"f": "The tarsier is the only completely carnivorous primate — it eats exclusively insects, lizards, and small birds. No plants whatsoever.", "a": "A tarsier arrives at the primate buffet. Every other monkey, ape, and lemur is loading up on fruit and leaves. The tarsier walks straight past all of it to the end of the table — where a tiny vivarium of live insects sits. It grabs one. Another primate offers it a banana. The tarsier stares at the banana. Stares at the insect. Stares at the banana. Walks away."}, {"f": "The deep sea anglerfish female can stretch to swallow prey twice her own body length — her entire body is basically a stomach.", "a": "An anglerfish eyeballs a fish twice her size. Other fish nearby shake their heads slowly. The anglerfish opens her mouth. Her jaw unhinges. Her body stretches. The large fish DISAPPEARS inside her. She returns to normal size. Smooths herself out. The other fish back away quietly."}, {"f": "Naked mole rats feel no pain from acid on their skin — they lost the relevant nerve protein through millions of years of evolution.", "a": "A naked mole rat at a chemistry lab. Hydrochloric acid spills directly onto its arm. It looks at its arm. Looks at the acid. Picks up the acid bottle. Reads the label. Shrugs. Goes back to work. A nearby scientist watches in stunned silence and writes three pages of notes."}, {"f": "The geoduck clam can live for over 160 years — and grows a neck that extends more than one metre from its shell.", "a": "An ancient clam sits on the seafloor. Scientists approach with a tape measure. They measure the neck. Run out of tape. Borrow more from a colleague. Still running. The clam waits patiently. Has been waiting since 1863. Has all the time in the world."}, {"f": "The pistol shrimp outnumbers virtually every other multicellular organism in tropical coastal waters.", "a": "A marine census worker arrives at a coral reef with a clipboard. Starts counting pistol shrimp. After ten minutes the clipboard is full. Gets a new clipboard. After an hour: surrounded by clipboards, all full. Sits down. Writes VERY MANY on a blank sheet. Submits it. The report is accepted."}, {"f": "Dolphins can stay awake for 15 days straight without showing any cognitive decline — by resting one brain hemisphere at a time.", "a": "A dolphin at a sleep study. Scientists attach electrodes. Day 1: alert. Day 5: still alert. Day 10: still completely sharp. Day 15: the dolphin does a backflip to celebrate. The scientists, who have been awake the whole time trying to keep up, are slumped over their desks. The dolphin brings them coffee."}, {"f": "The bombardier beetle stores two separate chemicals in its abdomen and only mixes them at the moment of firing, creating the explosion.", "a": "A bombardier beetle opens a tiny hatch in its abdomen to show the two separate chambers. Points at chamber A. Points at chamber B. Holds up a finger: NOT yet. A threat appears. The beetle rotates its rear, mixes the chemicals at the last possible second — POC — jet of boiling steam fires perfectly on target. Closes the hatch. Takes a bow."}, {"f": "Sea otters have loose skin pouches under their forearms where they store their favourite rocks while diving.", "a": "A sea otter checks its armpits before a dive. Left armpit: favourite flat cracking rock — present. Right armpit: backup rock — present. Nods. Dives. Cracks open a clam on its chest using the flat rock. Surfaces. Returns rocks to armpits. Pats them. Good rocks."}, {"f": "The satanic leaf-tailed gecko's tail looks so exactly like a dead leaf — including bite marks and veins — that it fooled scientists for decades.", "a": "A scientist cataloguing leaves in Madagascar. Picks up leaf number 47. Examines it closely. Notes the veins. Notes the bite marks. Notes it has eyes. The leaf blinks. The scientist very slowly sets it back down. Writes leaf — NO in his notebook. Closes the notebook. Sits on the ground."}, {"f": "Hummingbirds enter torpor every night — their heart drops from 1,200 beats per minute to around 50, and they become unresponsive.", "a": "A hummingbird is zooming everywhere at insane speed — flowers, feeders, loops, spirals. Then: 8:00pm. MID-ZOOM it drops face-first onto a branch. Completely still. A passing bird pokes it. Nothing. Pokes again. Nothing. Morning comes. The hummingbird's eyes SNAP open and it immediately resumes the loop it was in the middle of."}, {"f": "The mantis shrimp can deliver over 500 punches per second during extended combat — its clubs never break due to their unique structure.", "a": "Two mantis shrimp in a boxing ring. The bell rings. Both start punching. A punch counter on the wall starts spinning. In two seconds it reads 1,000. The crowd can barely see them. The referee checks his watch. Blows the whistle. Both shrimp lower their clubs simultaneously. Each examines the other's clubs. Both nod with professional respect."}, {"f": "The secretary bird kills snakes by stamping on them with enough force to shatter bone — in stilettos, basically.", "a": "An elegant secretary bird in business attire strolls through the savanna. Spots a cobra. Sets its briefcase down carefully. Sizes up the snake. Then STAMPS — one decisive blow with a pointed foot. The cobra is dealt with. The bird picks up its briefcase. Adjusts its feathers. Continues its morning walk."}, {"f": "Elephants are the only mammals known to perform rituals over their dead — touching bones, standing in silence, returning for years.", "a": "A herd of elephants approaches some large bones in the grass. They slow down. Stop. The youngest elephant reaches out and touches the bones with its trunk. The oldest elephant stands very still. No movement. No sound. Just presence. Then, slowly, the herd moves on. The youngest looks back once."}, {"f": "The leafcutter ant cuts leaves not to eat, but to grow fungus — and that fungus has been cultivated by ants for 50 million years.", "a": "A leafcutter ant in a tiny chef's hat carefully selects a leaf, cuts a perfect circle, and carries it underground. It arranges it on a fungus garden. Sprinkles it with tiny droplets from a watering can. Checks the temperature. Adjusts the humidity dial. Tastes a small piece of fungus. Nods. Generations of ants have done this before it. Generations will after."}, {"f": "The vampire squid doesn't actually drink blood — it eats marine snow, the tiny particles of dead matter that drift down from above.", "a": "A vampire squid in a tiny tuxedo floats in pitch darkness. A flake of marine snow drifts past. It extends one arm. Catches it on a tiny silver fork. Inspects it with a monocle. Nods approvingly. Places it delicately in its mouth. A second flake arrives. The squid refolds its napkin. This is fine dining."}, {"f": "Sloths come down from their trees only once a week to defecate — and lose up to a third of their body weight when they do.", "a": "A sloth checks a calendar on its tree. MONDAY — TOILET DAY. It sighs deeply. Begins descending. The descent takes several minutes. It reaches the ground. Does its business. Steps on a scale. Then begins climbing back up. Marks NEXT MONDAY on the calendar. Returns to sleeping immediately upon arrival. Six days of peace restored."}, {"f": "The migratory monarch butterfly navigates to a specific forest in Mexico it has never visited — guided by a magnetic compass in its antennae.", "a": "A monarch butterfly hatches. Opens its wings. Looks around. Something pulls. North? No. South. No. SOUTHWEST. Yes. It launches without hesitation. Thousands of kilometres. Mountain ranges. Storm fronts. Rivers. It lands on a specific tree in a specific forest in Mexico. Touches the bark. This is it. Has never been here. Knows it immediately."}, {"f": "The pistol shrimp's snap creates a flash of light visible to the naked eye — a phenomenon called sonoluminescence.", "a": "A pistol shrimp at an aquarium reaches into a box and produces a tiny birthday cake. Sets it on the seafloor. Raises its claw. SNAP — the cavitation flash lights up the entire tank like a camera flash. The candle is lit. The shrimp crosses its arms. Happy birthday to whoever. Slides the cake forward."}, {"f": "Crows will deliberately cache food in front of other crows — then secretly move it when they think they're no longer being watched.", "a": "A crow buries a nut. Another crow watches from a branch. The first crow covers it up. Walks away. Glances back — the other crow is still looking. Walks further. Glances back again. Digs up the nut. Moves it to a different spot. Covers it again. Checks. Still being watched. The crow and the watching crow stare at each other for a long time."}, {"f": "The axolotl can accept transplanted limbs from other axolotls without rejection — naturally suppressing its immune response.", "a": "An axolotl surgical team in tiny scrubs. They carefully transplant an arm from one axolotl to another. The receiving axolotl watches calmly. Wiggles the new arm. Nods. Wiggles it again. The donor axolotl already has a new one growing back. They do a tiny fist-bump with their respective new arms."}, {"f": "The blue whale's voice is so low in frequency that other whales can hear it from 1,600 kilometres away.", "a": "A blue whale opens its mouth. We hear nothing — the frequency is too low for us. But 1,600 km away another blue whale's ear twitches. It stops swimming. Listens. Turns. A long pause. Then replies. 1,600 km back: the first whale hears it and nods slowly. This is their phone call."}, {"f": "Some deep-sea fish have transparent heads — with tubular eyes that point upward through the fluid-filled dome of their skull.", "a": "A barreleye fish drifts past. Its head is a transparent dome. Inside: two gleaming green tubes pointing straight up through its own skull. We see its eye-tubes slowly rotating to track something above. It has been watching us through its own forehead this entire time. It blinks — with the tubes."}, {"f": "The giant Pacific octopus can change colour AND texture simultaneously — going from smooth to completely spiky in under a second.", "a": "An octopus is asleep on smooth sand. A predator approaches. The octopus doesn't open its eyes. In 0.8 seconds: colour shifts to sand pattern AND skin erupts into full spiky texture. The predator reaches out to grab what looks like a rock. Gets a fistful of spikes. The octopus opens one eye. Still half asleep."}, {"f": "Tardigrades can survive exposure to open space, radiation, extreme pressure, and temperatures from -272°C to 150°C.", "a": "A tardigrade is placed in a rocket. Launched into space. Floats around for a year. Brought back. Frozen. Then boiled. Then irradiated. Then crushed. At each step a scientist makes a checkmark. The tardigrade, at the end of this, stretches its eight legs, yawns, and immediately starts eating moss. The scientist stares at the checklist. All ticks."}, {"f": "The bombardier beetle rotates its rear end with precise aim — it can target its chemical spray within a few degrees of any direction.", "a": "A bombardier beetle on a rifle range. Paper targets in every direction. The beetle rotates its abdomen like a turret — LOCK — POC. Bullseye left. Rotates — LOCK — POC. Bullseye right. Behind it — LOCK — POC. Bullseye behind. The range instructor slowly puts down his clipboard. The beetle reloads."}, {"f": "The mimic octopus can flatten itself and swim along the seafloor rippling its arms to impersonate a flatfish.", "a": "An octopus spots a predator. It flattens its body completely — paper-thin — and begins undulating along the seafloor in perfect flatfish style. Another actual flatfish swims alongside it, looking confused. They move in parallel for a while. The predator swims between them. Cannot decide. The octopus silently peels off and disappears around a corner."}, {"f": "Horseshoe crab blood turns blue when exposed to oxygen — and immediately clots around any bacterial contamination.", "a": "A horseshoe crab at a hospital. Gives blood. The technician holds up the vial. It's bright blue. They stare at it. Drop one molecule of bacteria in. The blue blood INSTANTLY clots around it — a tiny solid ball. The technician looks at the crab. The crab looks at its own arm. This happens every time. Still remarkable."}, {"f": "The lyrebird's mimicry is so precise it can reproduce sounds it has only heard once, years earlier.", "a": "A lyrebird opens its eyes. It is 2019. It heard a ringtone once in 2016. A specific ringtone. It opens its beak. The EXACT ringtone plays — perfectly — three years later. A phone in a nearby hiker's pocket vibrates in confusion. The lyrebird closes its beak. Files the ringtone away for another decade."}, {"f": "Elephants can recognise themselves in a mirror — one of only a handful of species known to pass the mirror test.", "a": "A large mirror is placed in front of an elephant. It approaches. Examines the reflection carefully. Raises its trunk. The reflection raises its trunk. The elephant tilts its head. Tilts it the other way. Then — slowly — it raises one foot and checks the mud on the bottom. The reflection does the same. The elephant nods. Walks away. It knows."}, {"f": "The black dragonfish produces red bioluminescent light — invisible to all other deep-sea animals except itself.", "a": "Pitch black deep ocean. All other fish: blind. A black dragonfish switches on its red headlamp. To us it glows. To every other creature: nothing. The dragonfish sweeps the beam across the seafloor. Maps everything. Spots prey. The prey has no idea there is a light. The dragonfish approaches in full visibility. Completely invisible. Both things at once."}, {"f": "The immortal jellyfish can cycle back to a juvenile state an unknown number of times — no maximum age has ever been documented.", "a": "A marine biologist fills out an age form for a jellyfish. Date of birth: UNKNOWN. Maximum age: UNKNOWN. Number of life cycles completed: UNKNOWN. Cause of death anticipated: UNKNOWN. The biologist looks at the jellyfish. The jellyfish bobs pleasantly. The biologist submits the form. It comes back with a red stamp: MORE INFORMATION REQUIRED."}, {"f": "Gorillas share 98.3% of their DNA with humans — closer than chimpanzees share with orangutans.", "a": "A gorilla and a human sit side by side in waiting room chairs. Both are reading the same magazine. Both cross their legs at the same moment. Both reach for a coffee. Both check their phone. Both sigh at the same moment about something. They look at each other. Slightly uncomfortable. Both look away. Go back to the magazine."}, {"f": "The Greenland shark reaches sexual maturity at around 150 years old — making it the slowest-maturing vertebrate on Earth.", "a": "A massive ancient shark with a vast white wizard beard drifts through the deep. A young excited shark zooms past making social calls. The old shark does not blink. Does not move. Has been here since the 1700s. A tiny plankton lands on its nose. It considers it. Decides against reacting. Slowly continues. At its own pace."}, {"f": "Crows manufacture tools they have never been shown — bending wire into hooks to extract food from containers.", "a": "A crow is given an unfamiliar straight piece of wire and a food container it cannot reach into. It picks up the wire. Looks at it. Looks at the container. Looks at the wire again. In 30 seconds it has bent a perfect hook. Extracts the food. Looks at the camera. Looks back at the hook. Sets it down. Eats."}, {"f": "The mantis shrimp's clubs have a helicoidal fibre structure that prevents fracture under repeated massive impacts.", "a": "A materials engineer opens a box containing a mantis shrimp club sample. Places it in a stress-testing machine. The machine fires. The sample is fine. Fires again. Fine. Fires at maximum power. The machine breaks. The sample: fine. The engineer picks it up, examines it, puts it in a briefcase, and leaves without a word."}, {"f": "Dolphins have been observed grieving — carrying dead calves for days and refusing to leave them.", "a": "Open ocean. Quiet. A dolphin swims slowly near the surface, a still calf resting on its back. It does not rush. It does not dive. It simply moves through the water, quietly, unhurried. Other dolphins nearby are gentle. No frantic motion. Just time, and water, and the dolphin that refuses to let go yet."}, {"f": "Some species of shark glow green in the dark — using pigments that convert blue light into green bioluminescence.", "a": "A swell shark drifts through the deep. Another fish passes — nothing unusual. Then the blue water catches the shark's skin and it GLOWS — full green bioluminescence, vivid and alien. The fish reverses course slowly. The shark looks at its own glowing fin. Does a small glowing spin. Checks it from the other angle. Acceptable."}, {"f": "The pistol shrimp is estimated to be responsible for most of the background ocean noise on Earth.", "a": "A hydrophone is lowered into the ocean. A scientist puts on headphones. Her eyes go wide. She holds out the headphones for a colleague. He puts them on. Same expression. They trace the source. Zoom in on a map. Zoom in further. It is a two-centimetre shrimp on a reef in Indonesia. Snapping. Continuously. Since before recorded history."}, {"f": "The electric eel can remote-control the muscles of hidden prey — forcing them to twitch and reveal their location.", "a": "An electric eel searches a muddy riverbank. Nothing visible. It sends a low electric pulse. A fish hidden under a leaf TWITCHES — involuntarily, just once. The eel stops. Looks. The fish freezes. The eel sends another pulse. The fish twitches again. The eels eye moves slowly toward the leaf. The fish realises the leaf was not enough cover."}, {"f": "The pangolin is the only mammal covered in scales — which are made of the same material as human fingernails.", "a": "A pangolin at a threat assessment. A leopard tries to bite it. Scales: impenetrable. A lion tries to unclaw it. Scales: impenetrable. A hyena tries everything. Nothing. The pangolin is rolled into a perfect armoured ball. The hyena gives up and sits down. The pangolin unrolls. Smooths its scales. Walks away without acknowledging any of it."}, {"f": "The dumbo octopus lives deeper than almost any cephalopod — flapping its ear-like fins to fly slowly through the dark.", "a": "Absolute deep-sea darkness. Then, from below: two tiny fins flapping gently. A dumbo octopus rises into frame, pink and round, ears waving like a dog that discovered floating. It makes no attempt to be menacing. It approaches the camera. Blinks with enormous eyes. Flaps its ears once more. Drifts upward. The most gentle thing in the abyss."}, {"f": "Jumping spiders don't use the muscles in their legs to jump — they pump fluid into them hydraulically to extend them instantly.", "a": "A jumping spider eyeballs a fly across a gap three times its body length. It anchors a safety silk line. Internal hydraulics BUILD — we see a pressure gauge somewhere in its abdomen rising. FULL PRESSURE. It launches. Lands perfectly on the fly. Eats it. The safety line drifts in the breeze. Never needed."}, {"f": "The Venus flytrap can count — it needs two touches within 20 seconds to trigger, preventing it from wasting energy on raindrops.", "a": "A raindrop falls on a Venus flytrap trigger. ONE. The plant waits. Seconds pass. Nothing else. The trap relaxes. Another raindrop falls. ONE. Waits. Nothing. Relaxes again. Then a fly lands. ONE. Pauses. TWO — the fly moves. SNAP. The trap fires. Inside the darkness the plant seems very satisfied. It counted correctly again."}, {"f": "The cuttlefish has been shown to pass a version of the marshmallow test — waiting for a better reward rather than taking the immediate one.", "a": "A cuttlefish faces a choice: one shrimp now, or three shrimp if it waits. Scientists watch. The cuttlefish looks at the one shrimp. Looks at the wall where the three will appear. Looks at the single shrimp. Waits. Five minutes pass. Three shrimp appear. The cuttlefish collects all three. One of the scientists is visibly impressed. Takes notes."}, {"f": "The aye-aye taps on bark with its elongated middle finger to echolocate hollow chambers where grubs are hiding.", "a": "An aye-aye moves along a branch at night. Taps. Taps. Hollow sound — detected. It taps again for confirmation. Maps the cavity mentally. Inserts its skeletal middle finger into a tiny hole. Extracts a fat grub with surgical precision. Eats it. Moves forward one step. Taps again. This is the whole job. It is very good at it."}, {"f": "When threatened, the fulmar seabird projectile-vomits a stomach oil at predators that ruins the waterproofing of their feathers.", "a": "A large seagull approaches a fulmar nest with full predator confidence. The fulmar calmly turns. Opens its beak. FIRES a stream of yellow stomach oil directly at the seagull's chest. The seagull looks down. Looks up. Looks down again. Its feathers are already losing their structure. The seagull leaves. Very quickly. The fulmar closes its beak. Sits back down."}, {"f": "The opossum doesn't choose to play dead — it enters an involuntary catatonic state triggered by extreme fear.", "a": "An opossum rounds a corner and comes face-to-face with a dog. Its eyes widen. Then — completely against its will — it tips over sideways, tongue out, eyes glazed, perfectly still. The dog sniffs it. Pokes it. Nothing. The dog walks away. The opossum's eyes slowly refocus. It sits up. Looks around. Stands up. Smooths its fur. Walks away with dignity. Didn't choose any of that."}, {"f": "The shoebill stork stands motionless for hours, then strikes prey — including lungfish and baby crocodiles — with explosive speed.", "a": "A shoebill stork in a swamp. Motionless. Absolutely motionless. A fish swims by. Nothing. Another fish. Nothing. A frog. Nothing. An entire minute of absolute stillness. Then: LUNGE — beak fires like a cannon — the water explodes — and the shoebill stands back up, holding a fish, looking like it barely moved. It barely moved."}, {"f": "The pistol shrimp can regenerate its snapping claw — but it sometimes grows back on the wrong side, becoming left-handed.", "a": "A pistol shrimp loses its right claw in a fight. A month later a new one has grown — on the LEFT side. The shrimp looks at it. Raises the new left claw. Snaps. WRONG DIRECTION. It snaps and hits itself. It stares at the claw. Stares at where the right one used to be. Snaps again. Still wrong. It is going to take some adjustment."}, {"f": "Some moths can jam bat echolocation by emitting ultrasonic clicks that interfere with the bat's targeting system.", "a": "A bat diving at a moth at full speed. The moth hears the echolocation. It opens a tiny hatch on its abdomen and FIRES ultrasonic countermeasures. The bat's targeting system goes haywire — it swerves, overshoots, does a confused loop, and flies into a tree. The moth closes the hatch. Flies away. Completely routine defensive measure."}, {"f": "The decorator crab covers itself in living sponges, corals, and anemones — essentially wearing a poisonous garden as armour.", "a": "A decorator crab approaches a reef with a tiny shopping basket. Picks up a sponge — attaches it. A small anemone — attaches it. A piece of coral — attaches it. Examines its reflection in a smooth shell. Adjusts the anemone slightly. Looks again. Better. It now looks exactly like a small reef. Walks away looking like absolutely nothing dangerous at all."}, {"f": "The platypus bill contains 40,000 electroreceptors — more than any other known mammal — allowing it to detect prey in complete darkness.", "a": "Absolute blackout underwater. A platypus with its eyes sealed, earplugs in, and nostrils pinched shuts. Its bill sweeps left and right. In its mind: every shrimp and worm on the riverbed appears as a glowing dot. It collects eight shrimp with clinical efficiency. Surfaces. Removes everything. Holds up the shrimp. Breakfast."}, {"f": "Baby elephants suck on their trunks for comfort — exactly like human babies suck their thumbs.", "a": "A baby elephant is startled by a bird. It runs back to its mother. Wraps around her leg. Then — slowly — the end of its tiny trunk creeps up toward its mouth. It inserts the trunk tip. Sucks. Calms down. The mother looks down at it. Looks at the camera. Gently removes the trunk from its mouth. The trunk goes back. The mother sighs."}, {"f": "The Pacific octopus has been documented unscrewing jar lids, disassembling tank equipment, and escaping through pipes at night.", "a": "3am security footage. An octopus carefully unscrews a jar. Examines the contents. Puts it back. Moves to the filtration unit. Removes three components. Studies them. Reassembles it incorrectly. Notices the error. Fixes it. Checks the clock. Returns to its tank. Replaces the lid. 9am: it is sitting perfectly still looking like it has been there all night."}, {"f": "Spiders eat more insects per year than the total weight of all humans on Earth combined.", "a": "A small ordinary house spider in the corner of a room. A fly comes in. Gone. Another fly. Gone. A moth. Gone. A ceiling chart begins tracking its consumption over a year. The numbers climb. And climb. By December the bar has passed an icon labelled ALL HUMANS. The spider is not aware of the chart. It is looking for another fly."}, {"f": "The hummingbird hawk-moth is a moth that hovers, drinks nectar, and moves like a hummingbird — and is regularly mistaken for one.", "a": "A birdwatcher in a garden. Spots something hovering at flowers. Raises binoculars. Writes in notebook: HUMMINGBIRD. Circles it twice. Underlines it. Later at home he shows his photo to a friend. His friend zooms in. Points at the antennae. The birdwatcher zooms in. Stares. Zooms in further. Puts the binoculars down. Crosses out the entry."}, {"f": "The electric torpedo ray was used by ancient Roman doctors to treat headaches and gout — by applying it directly to the patient.", "a": "Ancient Rome. A doctor's waiting room. A patient with a headache is called in. The doctor gestures to a tray. On the tray: a torpedo ray, flat and ready. The patient looks at the ray. The doctor nods reassuringly. The patient touches it. ZAP. Wide awake. Headache gone. The doctor makes a note. Bills for two sessions."}, {"f": "Some species of ants create living chains with their own bodies to bridge gaps — and hold the chain for hours without moving.", "a": "A column of ants reaches a gap in a branch. The first ant stops. Grabs a second. The second grabs a third. A living bridge assembles itself, taut and still, across the gap. The column streams over them. The bridge ants look at each other. Hold. The column keeps coming. They hold. Another column. They hold. Eventually: one ant gets a shift replacement."}, {"f": "The immortal jellyfish Turritopsis dohrnii has been found in every major ocean — likely spreading by hitchhiking on ships.", "a": "A port official reviewing shipping manifests. Under cargo for one vessel: electronics, 500 units. Textiles, 2 tonnes. One immortal jellyfish, stowaways: uncountable. In the ballast water tank we see a jellyfish — stamp collection in a tiny folder, tiny passport full of entry stamps. Pacific, Atlantic, Indian. Picks up a tiny pen. Adds one more."}, {"f": "The peacock mantis shrimp can punch with a force 2,500 times its own weight — equivalent to a human punching with 190 tonnes of force.", "a": "MATHS CORNER. A peacock mantis shrimp in a boxing ring. Weight: 50 grams. Punch force: 1,500 newtons. EQUIVALENT HUMAN PUNCH: 190 tonnes. A tiny cartoon human next to it punches a punching bag with one finger. The number 190 TONNES floats above the shrimp. The shrimp punches the scoreboard. The scoreboard explodes."}, {"f": "Blind mole rats are resistant to cancer — scientists are studying their cells to understand why tumours cannot grow in them.", "a": "A blind mole rat at a hospital in a tiny gown. Doctor reads results. Normal blood: fine. Cancer markers: zero. Unusual mutations: zero. Tumour resistance: extraordinary. Doctor leans forward. The mole rat cannot see the doctor. The doctor leans back. Makes a note. The mole rat waits patiently, still blind, still completely healthy."}, {"f": "The lyrebird can mimic entire soundscapes — including all the birds in its territory simultaneously.", "a": "A forest clearing. The lyrebird stands alone. Opens its beak. From a single bird: the sound of forty birds at once — wrens, kookaburras, honeyeaters, whipbirds, all in perfect harmony. A real kookaburra sitting nearby stops laughing. Listens. Looks at the lyrebird. This bird is doing all of us. It flies away, offended."}, {"f": "Octopuses are so intelligent they get bored in captivity — aquariums must provide daily puzzles to keep them mentally stimulated.", "a": "An octopus stares at the aquarium wall. A keeper slides in a jar with a crab inside. The octopus opens it in four seconds. Slides it back. Another jar, new lock. Three seconds. Slides it back. A third jar, three locks and a childproof cap. The octopus pauses. Eleven seconds. Slides it back. The keeper makes a note: needs harder puzzles."}, {"f": "The wandering albatross has the largest wingspan of any living bird — up to 3.5 metres — and can glide for hours without flapping.", "a": "An albatross spreads its wings for measurement. A researcher runs a tape measure from tip to tip. Runs out of tape. Borrows more. 3.5 metres total. The researcher stands between the wings. He fits, with room to spare. The albatross looks down at him with mild curiosity. Folds its wings. The researcher steps out. Makes a note."}, {"f": "The blob sculpin looks unremarkable underwater — it only gets its famous melting face when dragged up from extreme depth.", "a": "Deep ocean: a distinguished blob sculpin in a tiny monocle, gliding elegantly. A net appears. The monocle flies off. As the sculpin rises through the water column, its face slowly sags — lower, lower, until it arrives at the surface looking like it lost an argument with gravity. It stares into a camera held by a scientist. The scientist is trying not to laugh."}, {"f": "Hippopotamuses secrete a natural sunscreen and antibiotic called 'blood sweat' — it is neither blood nor sweat.", "a": "A hippo emerges from a river on a hot day. It begins to glisten red. A nearby tourist screams: IT'S BLEEDING. A second tourist: IT'S SWEATING BLOOD. A third, reading a guidebook: it's neither. It's a natural SPF and antibiotic. Everyone looks at the hippo. The hippo looks at everyone. Goes back in the river."}, {"f": "The deep sea dragonfish has transparent teeth — completely invisible to prey approaching its open mouth in the dark.", "a": "A deep sea dragonfish smiles — its huge open mouth contains teeth that are simply not there. Another fish swims toward it. Peers inside. Sees nothing to worry about. Swims closer. Still nothing suspicious. Swims right in. SNAP. In the darkness, the teeth were always there. Just invisible. The dragonfish smiles again. Same trick every time."}, {"f": "Komodo dragons have venom glands between their teeth — the bacteria theory was actually wrong.", "a": "A Komodo dragon sits in a laboratory while scientists hold a meeting next to it. One scientist has a whiteboard: BACTERIA. Another scientist crosses it out. Writes: VENOM. The Komodo dragon watches the debate with mild interest. It yawns. Its mouth opens. Everyone in the meeting takes a step back. Debate concluded."}, {"f": "The glass frog male guards his egg clutch on a leaf all night — keeping them moist by urinating on them.", "a": "A glass frog settles in for night guard duty on a leaf full of eggs. It looks at the eggs. Looks at the sky. Looks at the eggs. Then, with complete parental dedication, begins its shift. A time-lapse: all night, the glass frog stands guard. Making sure the eggs stay moist. With whatever resources are available. The eggs hatch in the morning. Father looks exhausted but satisfied."}, {"f": "The immortal jellyfish's ability to revert to a juvenile state was only discovered in 1988 — scientists were trying to understand why one didn't die.", "a": "A lab, 1988. A scientist marks a jellyfish for observation. Leaves for the weekend. Returns Monday. The jellyfish is gone. In its place: a tiny juvenile polyp. The scientist checks all the tanks. Checks the floor. Checks under the bench. Sits down. Writes a very long paper. The paper is titled: WHERE DID THE JELLYFISH GO."}, {"f": "Elephants purr — they produce a low rumbling sound when content, similar in structure to a cat's purr.", "a": "A elephant herd at golden hour. One elephant nuzzles a calf. A low rumbling begins — felt more than heard. A nearby researcher puts her hand on the elephant's flank. The rumble travels through her arm. She looks at the herd. Everyone is purring. She sits down in the grass. Takes off her headphones. Just listens."}, {"f": "The frogfish walks on its fins and can swallow prey larger than itself in 6 milliseconds — the fastest strike of any vertebrate.", "a": "A frogfish strolls across the seafloor in what can only be described as a waddle. A fish twice its size drifts past, completely relaxed. The frogfish stops. Its mouth opens — SLOWLY at first — then in 6 milliseconds: the large fish is simply gone. The frogfish's cheeks bulge slightly. It resumes waddling. The surrounding fish have backed away six metres."}, {"f": "The bombardier beetle can fire its boiling chemical spray up to 500 times per second in rapid pulses.", "a": "A stopwatch. A bombardier beetle faces a threat. The watch starts. POC POC POC POC POC — the spray fires so fast it sounds like a tiny machine gun. The threat is retreating before the third pulse. The beetle keeps firing anyway. By pulse 200 the threat is entirely gone. The beetle fires pulse 201. Just to be sure."}, {"f": "Octopus arms have minds of their own — two-thirds of an octopus's neurons are in its arms, not its brain.", "a": "An octopus tries to direct its own arm to grab a crab. The arm goes left. The octopus gestures right. The arm goes further left. The octopus throws up its other arms in frustration. The arm independently finds and catches the crab. Returns it. The octopus examines the crab. Looks at the arm. The arm does nothing. Waits for credit."}, {"f": "The narwhal's tusk is actually a tooth that grows through its lip — and contains 10 million nerve endings.", "a": "A narwhal approaches a patch of seawater. It dips its tusk in very gently. Its entire face changes expression — it can feel the temperature, the salinity, the current, every particle. It slowly removes the tusk. Processes this information. Nods. Dips it in again. It is extremely sensitive. Everything is extremely loud. Everything is a lot."}, {"f": "Crows will deliberately drop nuts onto pedestrian crossings and wait for the traffic light to turn red before collecting them.", "a": "A crow at a crossing. Places nut. Traffic light: green. Lorry rolls over it. CRUNCH. Light turns red. The crow walks out with complete dignity, collects the cracked pieces, returns to the kerb. Eats. Places another nut. A pigeon watches. Rushes out at green. Immediately nearly hit. Scrambles back. The crow does not comment."}, {"f": "The pistol shrimp is believed to have been snapping continuously since before humans evolved — for at least 50 million years.", "a": "A marine scientist holds up a fossil. Shows it to a pistol shrimp in a tank. Points at the fossil claw. Points at the shrimp's claw. The shrimp looks at the fossil. Looks at its own claw. Snaps it once. The scientist writes: 50 million years. Same snap. The shrimp snaps again. Still works."}, {"f": "The immortal jellyfish Turritopsis has no known maximum lifespan — it simply reverses when it gets old or stressed.", "a": "A jellyfish gets a birthday card. Opens it. Reads it. Looks at the number. Closes the card. Sets it aside. Touches itself with one tentacle. Begins compressing backward in time — wrinkles tightening, glow returning — until it is a tiny polyp again. It opens the card. The number is still the same. It closes the card again."}, {"f": "The tardigrade has been found on every continent, in every ocean, at the top of mountains, and in hot springs.", "a": "A world map. Pins appear: Antarctica — pin. Sahara desert — pin. Mariana Trench — pin. Top of Everest — pin. Active volcano — pin. Your kitchen — pin. The tardigrade is already here. Was always here. Will always be here. The tardigrade appears in frame eating moss. Has been watching the entire presentation. Continues eating."}, {"f": "The mantis shrimp uses
