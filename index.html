<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Prompt Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; color: #f0f0f0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; padding: 24px 16px; }
  h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
  .sub { color: #666; font-size: 0.85rem; margin-bottom: 20px; }
  .btn-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  button { background: #ff6b35; color: #fff; border: none; border-radius: 10px; padding: 13px 22px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.15s, transform 0.1s; }
  button:active { transform: scale(0.97); }
  button:hover { background: #e85e2a; }
  button.sec { background: #1e1e1e; border: 1px solid #333; color: #ccc; }
  button.sec:hover { background: #2a2a2a; }
  button.grn { background: #1a6b1a; }
  button.grn:hover { background: #1e831e; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .card { background: #141414; border: 1px solid #222; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .card-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #ff6b35; margin-bottom: 8px; }
  .fact-text { font-size: 1.05rem; line-height: 1.5; color: #f0f0f0; }
  .anim-text { font-size: 0.88rem; line-height: 1.5; color: #aaa; font-style: italic; }
  .prompt-box { background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 10px; padding: 14px; font-size: 0.82rem; line-height: 1.6; color: #bbb; white-space: pre-wrap; word-break: break-word; max-height: 280px; overflow-y: auto; }
  .status-bar { background: #111; border: 1px solid #222; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .status-count { font-size: 0.9rem; color: #ccc; }
  .status-count span { color: #ff6b35; font-weight: 700; }
  .progress-bar { width: 100%; height: 4px; background: #222; border-radius: 2px; margin-top: 8px; }
  .progress-fill { height: 4px; background: #ff6b35; border-radius: 2px; transition: width 0.3s; }
  .loading { display: flex; align-items: center; gap: 10px; color: #666; font-size: 0.9rem; padding: 16px 0; }
  .dot { width: 8px; height: 8px; background: #ff6b35; border-radius: 50%; animation: pulse 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1)} }
  .copy-btn { background: #1e1e1e; border: 1px solid #333; color: #ccc; padding: 9px 16px; font-size: 0.82rem; border-radius: 8px; margin-top: 10px; width: 100%; }
  .copy-btn.copied { background: #1a3a1a; border-color: #2d6a2d; color: #6abf6a; }
  .build-log { background: #0a0a0a; border: 1px solid #1e1e1e; border-radius: 8px; padding: 12px; font-size: 0.75rem; color: #555; max-height: 120px; overflow-y: auto; font-family: monospace; margin-top: 10px; }
  .log-line { margin-bottom: 2px; }
  .log-line.ok { color: #2d6a2d; }
  .log-line.err { color: #6a2d2d; }
  .history { margin-top: 28px; border-top: 1px solid #1e1e1e; padding-top: 20px; }
  .history-title { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #444; margin-bottom: 12px; }
  .history-item { background: #111; border: 1px solid #1e1e1e; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s; }
  .history-item:hover { border-color: #333; }
  .history-fact { font-size: 0.88rem; color: #ccc; line-height: 1.4; }
  .history-meta { font-size: 0.72rem; color: #444; margin-top: 4px; }
  .section-title { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #444; margin-bottom: 10px; margin-top: 20px; }
</style>
</head>
<body>

<h1>🎬 Flow Prompt Generator</h1>
<p class="sub">Onbeperkte unieke dierenfeitjes — bouw je eigen database op</p>

<div class="status-bar">
  <div>
    <div class="status-count">Database: <span id="dbCount">0</span> feitjes beschikbaar · <span id="usedCount">0</span> gebruikt</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <button class="grn" onclick="buildDatabase()" id="buildBtn">+ Voeg 50 feitjes toe</button>
</div>

<div id="buildSection" style="display:none">
  <div class="loading" id="buildLoading"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span id="buildStatus">Feitjes genereren...</span></div>
  <div class="build-log" id="buildLog"></div>
</div>

<div class="btn-row">
  <button onclick="generate(1)" id="genBtn">✨ Genereer feitje</button>
  <button class="sec" onclick="generate(2)" id="gen2Btn">✨✨ Genereer 2 feitjes</button>
</div>

<div id="loading" style="display:none"><div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span>Prompt aan het maken...</span></div></div>
<div id="results"></div>
<div id="history" style="display:none" class="history"><div class="history-title">Eerder gegenereerd</div><div id="historyList"></div></div>

<script>
// === DATABASE ===
let db = JSON.parse(localStorage.getItem('factdb') || '[]');
let usedIds = JSON.parse(sessionStorage.getItem('usedIds') || '[]');
let sessionHistory = [];
let isBuilding = false;

const VOICEOVER_STYLES = [
  f => `a deadpan narrator drops the fact cold and flat, letting visuals do the work: "${f}." — said once`,
  f => `a warm curious narrator speaks with genuine wonder, as if discovering it live: "${f}." — one take`,
  f => `an urgent whispering narrator delivers it like a secret: "${f}." — hushed and intense`,
  f => `a deep cinematic nature-documentary narrator, slow and deliberate: "${f}." — powerful, once`,
  f => `a bright playful narrator pops it like a punchline: "${f}!" — quick and punchy`,
  f => `a breathless narrator rushes in mid-thought: "Wait — ${f}?!" — one exclamation`,
  f => `a calm BBC-documentary narrator with quiet authority: "${f}." — confident certainty`,
  f => `a high-energy sports commentator shouts it: "${f}!!" — explosive, once, done`,
];
const CAMERA_OPENS = [
  `Opens on extreme macro close-up — barely recognisable — then instantly pulls back to reveal the subject.`,
  `Opens mid-action, cutting straight into the most dynamic moment with no buildup.`,
  `Opens with a dramatic low-angle shot looking up, giving the subject enormous scale.`,
  `Opens with a fast whip-pan swinging into the subject from the side, full speed.`,
  `Opens with a crash-zoom punch directly into the subject's face or key detail.`,
  `Opens from the subject's POV — we see what it sees — then instantly cuts to wide shot.`,
  `Opens in slow-motion close-up of the most striking detail, then snaps to normal speed.`,
  `Opens with a bird's-eye overhead shot, then dramatically tilts to face-level.`,
];
const BACKGROUNDS = [
  "a lush jungle clearing with soft dappled sunlight filtering through the canopy",
  "a dramatic savanna at golden hour with long shadows stretching across the grass",
  "a vibrant coral reef teeming with colorful fish and swaying anemones",
  "a snowy arctic landscape with pale blue light and distant icebergs",
  "a dense rainforest with misty waterfalls cascading in the background",
  "a sun-baked desert with rippling heat haze and distant dunes",
  "a moonlit ocean surface with bioluminescent waves glowing below",
  "a vibrant underwater kelp forest with shafts of light cutting through",
  "a misty mountain valley with ancient trees and roaring waterfalls",
  "a vivid tidal pool teeming with starfish, crabs, and darting fish",
];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function buildPrompt(f, a) {
  return `An 8-second Pixar-style comedic 3D animation YouTube Short, 9:16 vertical format, hyper-detailed, vibrant colors, exaggerated cartoony character design, expressive rubbery faces, slapstick energy, clean studio lighting.

VOICE: Use the voice named Alnilam for the voiceover. This is fixed and non-negotiable — do not use any other voice.

AUDIO: Energetic upbeat background music from the very first frame. Over this music, ${pick(VOICEOVER_STYLES)(f)} CRITICAL: voiceover speaks the fact ONCE then stops completely. No repetition, no filler — absolute silence from narrator after delivery.

VISUAL PACING: Every scene cut or visual transformation must begin exactly 0.1 to 0.2 seconds BEFORE the corresponding spoken word hits. Visuals always lead the audio by this fraction — the image anticipates the word, never follows it.

AUDIO OUTRO PAD: After the voiceover speaks its final word, the animation continues for exactly 1.5 to 2 seconds with no new voiceover. During this pad the background music gradually fades from full volume to complete silence. The video does not cut or end abruptly — it plays out fully through this fade before ending.

VISUALS (0–8s): Full frame, full screen: Pixar-style comedic 3D animation of ${a}, set in ${pick(BACKGROUNDS)}. NO presenter, NO "Did you know", NO intro. ${pick(CAMERA_OPENS)} The animal has an exaggerated cartoon personality — big expressive eyes, rubbery reactions, comic timing. Continuous motion throughout, camera angles shift, reactions build, timing lands. No loops, no repeated frames.

Pixar comedic style. Think Finding Nemo meets Looney Tunes. No real-world footage.`;
}

function updateUI() {
  document.getElementById('dbCount').textContent = db.length;
  document.getElementById('usedCount').textContent = usedIds.length;
  const pct = db.length > 0 ? Math.round((usedIds.length / db.length) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function log(msg, type = '') {
  const el = document.getElementById('buildLog');
  const line = document.createElement('div');
  line.className = 'log-line ' + type;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function buildDatabase() {
  if (isBuilding) return;
  isBuilding = true;
  document.getElementById('buildBtn').disabled = true;
  document.getElementById('buildSection').style.display = 'block';
  document.getElementById('buildLog').innerHTML = '';

  const existingSample = db.slice(-30).map(x => x.f);
  const existingAnimals = [...new Set(db.map(x => x.animal || '').filter(Boolean))].slice(-80);
  
  const excludeText = existingSample.length > 0
    ? `\n\nDO NOT repeat or closely resemble these existing facts:\n${existingSample.map(f => `- ${f}`).join('\n')}`
    : '';
  const excludeAnimals = existingAnimals.length > 0
    ? `\n\nDO NOT use these animals (already in database): ${existingAnimals.join(', ')}`
    : '';

  document.getElementById('buildStatus').textContent = 'API aanroepen voor 50 nieuwe feitjes...';
  log('Bezig met ophalen van 50 nieuwe unieke feitjes...');

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 8000,
        messages: [{
          role: 'user',
          content: `Generate exactly 50 unique, surprising animal facts for TikTok/YouTube Shorts videos.

Rules:
- Each fact about a DIFFERENT animal — maximum 1 fact per animal
- Wildly varied: insects, deep sea, birds, mammals, reptiles, prehistoric, microscopic, amphibians, arachnids, molluscs, crustaceans, fish, worms, fungi-related animals — spread across ALL categories
- Each fact must be true and verifiable
- Visually dramatic, bizarre, or funny enough to stop a scroller
- One sentence, max 20 words
- Obscure and unexpected — NOT the most famous fact about that animal
- No generic facts about speed, strength, size, loyalty, or memory${excludeAnimals}${excludeText}

For each fact also write a SHORT (max 20 words) FUNNY Pixar-style animation description. Think slapstick, cartoon physics, exaggerated reactions, visual punchlines.

Respond ONLY with a valid JSON array, no other text:
[{"f":"fact","a":"animation","animal":"animal name"},...]`
        }]
      })
    });

    const data = await res.json();
    const text = data.content[0].text.trim();
    const start = text.indexOf('[');
    const end = text.lastIndexOf(']') + 1;
    const parsed = JSON.parse(text.slice(start, end));

    let added = 0;
    const existingFacts = new Set(db.map(x => x.f.toLowerCase()));
    const existingAnimalsSet = new Set(db.map(x => (x.animal || '').toLowerCase()));

    for (const item of parsed) {
      if (!item.f || !item.a) continue;
      if (existingFacts.has(item.f.toLowerCase())) continue;
      if (item.animal && existingAnimalsSet.has(item.animal.toLowerCase())) continue;
      db.push({ f: item.f, a: item.a, animal: item.animal || '' });
      existingFacts.add(item.f.toLowerCase());
      if (item.animal) existingAnimalsSet.add(item.animal.toLowerCase());
      added++;
    }

    localStorage.setItem('factdb', JSON.stringify(db));
    log(`✓ ${added} nieuwe feitjes toegevoegd. Totaal: ${db.length}`, 'ok');
    updateUI();
  } catch(e) {
    log(`✗ Fout: ${e.message}`, 'err');
  }

  isBuilding = false;
  document.getElementById('buildBtn').disabled = false;
  document.getElementById('buildStatus').textContent = 'Klaar!';
}

function getRandomFact() {
  const available = db.filter((_,i) => !usedIds.includes(i));
  if (available.length === 0) {
    usedIds = [];
    sessionStorage.setItem('usedIds', '[]');
    return db[Math.floor(Math.random() * db.length)];
  }
  const availableIndexes = db.map((_,i) => i).filter(i => !usedIds.includes(i));
  const idx = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
  usedIds.push(idx);
  sessionStorage.setItem('usedIds', JSON.stringify(usedIds));
  return db[idx];
}

function renderResult(item, n) {
  const prompt = buildPrompt(item.f, item.a);
  return `<div class="card"><div class="card-label">📌 Feitje${n > 1 ? ' ' + n : ''}</div><div class="fact-text">${item.f}</div></div>
<div class="card"><div class="card-label">🎨 Animatie${n > 1 ? ' ' + n : ''}</div><div class="anim-text">${item.a}</div></div>
<div class="card"><div class="card-label">📋 Google Flow Prompt${n > 1 ? ' ' + n : ''}</div><div class="prompt-box" id="pb${n}">${prompt}</div>
<button class="copy-btn" id="cb${n}" onclick="copyPrompt(${n})">Kopieer prompt${n > 1 ? ' ' + n : ''}</button></div>`;
}

function generate(count) {
  if (db.length === 0) {
    alert('Database is leeg! Klik eerst op "+ Voeg 50 feitjes toe" om te beginnen.');
    return;
  }
  document.getElementById('loading').style.display = 'block';
  document.getElementById('results').innerHTML = '';
  setTimeout(() => {
    let html = '';
    for (let i = 1; i <= count; i++) {
      const item = getRandomFact();
      sessionHistory.unshift({ f: item.f, a: item.a, time: new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) });
      if (sessionHistory.length > 15) sessionHistory.pop();
      html += renderResult(item, i);
    }
    document.getElementById('results').innerHTML = html;
    document.getElementById('loading').style.display = 'none';
    updateUI();
    renderHistory();
  }, 150);
}

function copyPrompt(n) {
  navigator.clipboard.writeText(document.getElementById('pb' + n).textContent).then(() => {
    const btn = document.getElementById('cb' + n);
    btn.textContent = 'Gekopieerd! ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Kopieer prompt' + (n > 1 ? ' ' + n : ''); btn.classList.remove('copied'); }, 2500);
  });
}

function renderHistory() {
  if (!sessionHistory.length) return;
  document.getElementById('history').style.display = 'block';
  document.getElementById('historyList').innerHTML = sessionHistory.map((h, i) =>
    `<div class="history-item" onclick="loadHistory(${i})"><div class="history-fact">${h.f}</div><div class="history-meta">${h.time} · klik om te laden</div></div>`
  ).join('');
}

function loadHistory(i) {
  const h = sessionHistory[i];
  document.getElementById('results').innerHTML = renderResult({ f: h.f, a: h.a }, 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

updateUI();
</script>
</body>
</html>
